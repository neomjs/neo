openapi: 3.0.3
info:
  title: Neo.mjs GitHub Workflow MCP Server API
  description: |
    This API provides structured access to the Neo.mjs GitHub repository, enabling the automation of contribution workflows.
    It uses a hybrid approach, leveraging both the GitHub CLI (`gh`) for simple, direct commands (e.g., checking out a PR)
    and the GitHub GraphQL API for complex data fetching and mutations (e.g., listing PRs, creating comments, syncing issues).
    This allows AI agents to programmatically interact with pull requests and issues in a safe and efficient manner.
  version: 1.0.0
  contact:
    name: Neo.mjs Project
    url: https://github.com/neomjs/neo
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8002
    description: Local development server

tags:
  - name: Health
    description: Server health and status endpoints
  - name: Pull Requests
    description: Operations related to GitHub Pull Requests
  - name: Labels
    description: Operations related to repository labels
  - name: Issues
    description: Operations related to repository issues and pull requests
  - name: Repository
    description: Operations related to the repository itself

# Harness tool-projection policy (mirrors neural-link / knowledge-base). A maintainer harness spawned
# with `--tool-projection-mode harness-embedded` loads the read + write (core-maintainer) tiers; the
# `extended` (rare ops) + `admin` (dangerous) tiers are withheld, reachable on demand via
# `get_mcp_tool_handbook`. gh's visible set includes `write` because a maintainer's core writes
# (review, comment, create, assign, label, link, transition) are constant — unlike kb, whose writes are
# all admin-destructive (visible=[read] there).
x-neo-harness-tool-projection:
  defaultVisibleTiers:
    - read
    - write
  operatorOnlyTiers:
    - admin

paths:
  /docs:
    get:
      summary: API Documentation
      description: Serves the interactive Swagger UI for this API
      tags: [Health]
      responses:
        '200':
          description: Swagger UI HTML page
          content:
            text/html:
              schema:
                type: string

  /healthcheck:
    get:
      summary: Check GitHub CLI Health
      operationId: healthcheck
      x-neo-tool-tier: read
      x-annotations:
        readOnlyHint: true
      description: |
        Verifies that the GitHub CLI (`gh`) is installed, authenticated, and meets the minimum version requirement.

        **When to Use:**
        This should be the first tool you run if you suspect any issues with the GitHub Workflow MCP server. It provides a quick diagnostic check on the server's primary dependency.
      tags: [Health]
      responses:
        '200':
          description: Server is healthy and `gh` is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
        '503':
          description: Server is unhealthy or `gh` CLI is not available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tool/handbook:
    post:
      summary: Tool Handbook
      operationId: get_mcp_tool_handbook
      x-neo-tool-tier: read
      x-annotations:
        readOnlyHint: true
      description: Returns lazy-loaded usage detail for one GitHub Workflow MCP tool.
      tags: [Repository]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toolId]
              properties:
                toolId:
                  type: string
                  description: Tool operation id to inspect.
      responses:
        '200':
          description: Tool handbook lookup result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  toolId:
                    type: string
                  found:
                    type: boolean
                  title:
                    type: string
                  description:
                    type: string
                  handbook:
                    type: string
                  source:
                    type: string
                  code:
                    type: string
                  message:
                    type: string
                  inputSchema:
                    type: object
                  outputSchema:
                    type: object

  /labels:
    get:
      summary: List Repository Labels
      operationId: list_labels
      x-neo-tool-tier: read
      x-annotations:
        readOnlyHint: true
      description: |
        Retrieves a list of all available labels in the repository.

        **When to Use:**
        This is a crucial discovery tool. Call it before using `create_issue` or `manage_issue_labels` to ensure you are using valid, existing label names.
      tags: [Labels]
      responses:
        '200':
          description: A list of repository labels.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelListResponse'
        '500':
          description: Internal server error, e.g., `gh` command failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /pull-requests:
    get:
      summary: List Pull Requests
      operationId: list_pull_requests
      x-neo-tool-tier: read
      x-neo-tool-summary: List PRs; optionally falsify exact PR numbers supplied through believedOpen.
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: true
      description: |
        Retrieves a list of pull requests from the GitHub repository.

        **When to Use:**
        - To get a high-level overview of pending work (using the default `state: 'open'`).
        - To research historical context by looking at past work (e.g., using `state: 'closed'` or `state: 'merged'`).
        - To find a specific pull request number for use in other tools.
        - To falsify an exact caller-owned list of believed-open PR numbers in the same source read.
        - When the user asks questions like:
          - "What pull requests are currently open?"
          - "Show me recently merged PRs."

        **Best Practices:**
        - After calling this tool, summarize the list of PRs for the user.
        - Use the current head, review, reviewer-request, and merge-state fields before making a PR-state claim.
        - `reviewRequests: null` means the reviewer source was unavailable or incomplete; `[]` means fetched and empty.
        - `believedOpen` resolves each supplied number directly; it never infers terminal state from bounded-page absence.
      tags: [Pull Requests]
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of pull requests to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - name: state
          in: query
          required: false
          description: Filter pull requests by state.
          schema:
            type: string
            enum: [open, closed, merged, all]
            default: open
        - name: believedOpen
          in: query
          required: false
          description: Up to 100 exact PR numbers currently believed open; over-cap input is rejected before GitHub I/O.
          schema:
            type: array
            maxItems: 100
            uniqueItems: true
            items:
              type: integer
              minimum: 1
      responses:
        '200':
          description: A list of open pull requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullRequestListResponse'
        '500':
          description: Internal server error, e.g., `gh` command failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /pull-requests/{pr_number}/checkout:
    post:
      summary: Checkout PR Branch
      operationId: checkout_pull_request
      x-neo-tool-tier: admin
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: false
      description: Checks out a PR in explicit caller git-root `repoPath`; refuses with `CALLER_WORKSPACE_REQUIRED` when omitted. Use only for local review/test work after saving target workspace changes, then compare returned `headSha` with the current PR head. If you cannot supply `repoPath`, run manual `gh pr checkout` in your workspace.
      tags: [Pull Requests]
      parameters:
        - name: pr_number
          in: path
          required: true
          description: The number of the pull request to check out.
          schema:
            type: integer
            example: 123
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                repoPath:
                  type: string
                  description: Absolute path to the caller workspace git root that may be mutated by `gh pr checkout`.
                  example: "/Users/Shared/codex/neomjs/neo"
      responses:
        '200':
          description: Pull request branch checked out successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutPullRequestResponse'
        '404':
          description: Pull request not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error, e.g., `gh` command failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /pull-requests/{pr_number}/diff:
    get:
      summary: Get PR Diff
      operationId: get_pull_request_diff
      x-neo-tool-tier: read
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: true
      description: |
        Retrieves the diff for a specific pull request using `gh pr diff`.
        This provides a quick, read-only overview of the changes without checking out the branch.

        **When to Use:**
        Use this tool for a quick review of the changes in a pull request. For a more in-depth review, use `checkout_pull_request`.
      tags: [Pull Requests]
      parameters:
        - name: pr_number
          in: path
          required: true
          description: The number of the pull request.
          schema:
            type: integer
            example: 123
        - name: file
          in: query
          required: false
          description: |
            Optional. Comma-separated list of file paths to filter the diff.
            When provided alone, filters the PR diff to only include chunks for these paths.
          schema:
            type: string
            example: "src/main.js,src/utils.js"
        - name: sha
          in: query
          required: false
          description: |
            Optional. When provided alongside `file`, the diff is computed against the named commit, not the live PR head.
            Defends against working-tree race conditions in concurrent-PR scenarios. Requires `file`.
          schema:
            type: string
        - name: files_only
          in: query
          required: false
          description: |
            Optional. If true, returns a structured JSON payload of affected files (`path`, `additions`, `deletions`) instead of a plaintext diff.
          schema:
            type: boolean
      responses:
        '200':
          description: The diff of the pull request or structured file list.
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        additions:
                          type: integer
                        deletions:
                          type: integer
        '400':
          description: Invalid arguments (e.g., missing file when sha is provided, or invalid sha format).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Pull request or SHA not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error, e.g., `gh` command failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /pull-requests/{pr_number}/conversation:
    get:
      summary: Get Conversation (Issue or PR)
      operationId: get_conversation
      x-neo-tool-tier: read
      x-neo-tool-summary: Fetch PR/issue conversation, or an identity-bound source-owned PR readiness projection.
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: true
      description: |
        Retrieves the conversation (title, body, comments) for a pull request OR an issue.
        Supply exactly one of `pr_number` or `issue_number`. The default
        `projection: conversation` preserves the existing response shape.

        `projection: merge-readiness` is PR-only and accepts no caller-composed readiness
        fields. GitHub Workflow binds the current AgentIdentity/GitHub principals, reads the PR
        twice around two effective branch-rules reads, compares the snapshots, selects every job
        from the latest exact-head invocation of each GitHub Actions workflow, derives
        required-vs-emitted context states, and feeds them to the existing `validateMergeReady()`
        predicate. A missing Memory Core principal does not hide readable GitHub evidence: the
        projection returns `verdict: unavailable` with a separate `checksVerdict`, names the missing
        binding, and withholds the identity-bound marker. This preserves B-prime verdict semantics
        while removing the need for a hand-rolled checks read. Only a positive observation with all
        three principals carries a copyable `[merge-eligible][B-prime:...]` marker. Negative or
        unreadable observations contain diagnostics and no marker. This resident-local observation
        reports what was merge-ready at `observedAt`; it never grants merge authority or promises
        later validity.

        **When to Use:**
        Use this tool to get the context of a pull request or issue — the initial proposal/body and the discussion history.

        **Comment selectors (optional, first-match precedence):**
        - `comment_id`: fetch ONLY the matching comment. Accepts the node ID (`IC_kwDO…`), the
          numeric database id (`5301580683`), a URL anchor (`issuecomment-5301580683`), or a full
          comment URL — an unrecognised shape ERRORS rather than returning an empty list. Used for A2A
          hand-off — a reviewer mailboxes the `commentId` (returned by `manage_issue_comment`
          action:`create`) to the peer, and the peer fetches just-this-comment rather than
          re-walking the whole thread. Scales linearly with new-comment volume.
        - `since_comment_id`: fetch comments AFTER the one with the given ID (exclusive).
          Incremental review cycles: track last-seen commentId, fetch only what's new.
        - `last_n`: fetch the last N comments. Coarse-grained catch-up when IDs aren't tracked.

        Omitting all selectors returns the full conversation (backward-compatible default).
      tags: [Pull Requests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pr_number:
                  type: integer
                  description: The pull request number. Supply either `pr_number` or `issue_number`, not both.
                  example: 10272
                issue_number:
                  type: integer
                  description: The issue number. Supply either `pr_number` or `issue_number`, not both.
                  example: 10702
                projection:
                  type: string
                  enum: [conversation, merge-readiness]
                  default: conversation
                  description: Response projection. `merge-readiness` requires `pr_number`, is identity-bound, and cannot be combined with comment selectors.
                comment_id:
                  type: string
                  description: >-
                    Return only the matching comment. Accepts a node ID, the numeric database id, a
                    `issuecomment-N` URL anchor, or a full comment URL. An unrecognised shape returns
                    a MALFORMED_COMMENT_ID error; a well-formed id absent from the thread returns an
                    empty comments list. Scoped requests omit the parent body (`bodyOmitted: true`).
                  example: "issuecomment-5301580683"
                since_comment_id:
                  type: string
                  description: >-
                    Return only comments AFTER the one with this ID (exclusive). Accepts the same
                    four spellings as `comment_id`. Unrecognised shape errors; a well-formed but
                    absent id returns empty comments. Scoped requests omit the parent body.
                  example: "issuecomment-5301580683"
                last_n:
                  type: integer
                  description: >-
                    Return only the last N comments (by creation order). This is a scoped request, so
                    the parent body is omitted and `bodyOmitted: true` is set.
                  example: 3
      responses:
        '200':
          description: Conversation data for the pull request, optionally filtered by selector.
          content:
            application/json:
              schema:
                type: object
                description: >-
                  Conversation shape (issue or pull request) — title/author plus a (possibly filtered)
                  comments collection. `body` is present on UNSCOPED requests only; a scoped request
                  (`comment_id`, `since_comment_id`, or `last_n`) omits it and sets `bodyOmitted: true`.
                properties:
                  title:
                    type: string
                  body:
                    type: string
                    description: >-
                      The issue/PR body. ABSENT on scoped requests — check `bodyOmitted` rather than
                      reading an absent body as an empty one.
                  bodyOmitted:
                    type: boolean
                    description: >-
                      Present and `true` only on scoped requests, where `body` was deliberately not
                      returned. Distinguishes "scoped away" from "this thread has an empty body".
                  author:
                    type: object
                    properties:
                      login:
                        type: string
                  comments:
                    type: object
                    properties:
                      nodes:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: The GitHub global node ID of the comment.
                            author:
                              type: object
                              properties:
                                login:
                                  type: string
                            body:
                              type: string
                            createdAt:
                              type: string
                              format: date-time
        '400':
          description: Bad Request (neither or both of `pr_number` / `issue_number` supplied).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error, e.g., `gh` command failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /comments/manage:
    post:
      summary: Manage Comments (Create or Update)
      # The compact `tools/list` description, and it MUST live here rather than in `summary`.
      # `ToolService` emits `title: operation.summary` AND falls back to `summary` for the compact
      # description, so putting the imperative in `summary` ships it twice — measured at +118 chars
      # on the projected record instead of +59. This annotation carries it once and leaves the title
      # stable at the tool's 34-char name.
      x-neo-tool-summary: Manage Comments (Create or Update) — dialogue only; corrections go in the BODY, not a comment
      operationId: manage_issue_comment
      x-neo-tool-tier: write
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: false
      description: |
        Unified tool for creating and updating comments on issues and pull requests.
        Supports both adding new comments and modifying existing ones.

        **A comment is dialogue. It cannot supersede the body.**

        - **BODY = state.** What is true now: problem, evidence, prescription, acceptance criteria.
          If any of those change — including because you falsified your own earlier claim — edit the
          body. On a PR the body *is* the contract.
        - **COMMENT = dialogue.** A review response, an answer to a peer, a measurement handed to a
          named person. Something whose value is *that it was said, by whom, when*.

        Two reasons this matters more than tidiness:

        1. **A reviewer checks the body for acceptance criteria.** Correcting an AC in a comment
           leaves them verifying rigorously against a dead contract — worse than a sloppy review,
           because it yields a confident verdict on the wrong target.
        2. **Comment sediment must be read in full to be safe**, since only the whole set reveals
           which correction supersedes which — while the economical read (body, then stop) returns
           the stale version. The tax punishes the careful reader, misleads the frugal one, and
           grows with how wrong the body is.

        Bodies are edited outside this tool (`gh issue edit` / `gh pr edit`).

        **Action: 'create'**
        - Creates a new comment on an issue or PR.
        - Requires `body` and either `issue_number` or `pr_number`.
        - Posts `body` as-authored; GitHub's authenticated author is the attribution.
        - **When to use:** To provide feedback, approve PRs (with "LGTM"), or ask questions.

        **Action: 'update'**
        - Updates an existing comment.
        - Requires `comment_id` and `body`.
        - **When to use:** To correct what *you said* in dialogue, or to collapse a superseded
          comment of yours to a one-line pointer once its content is folded into the body. To correct
          what the ticket or PR *claims*, edit the body instead.
        - **Note:** You can only update comments created by the authenticated user.
      tags: [Issues, Pull Requests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
                - body
              properties:
                action:
                  type: string
                  enum: [create, update]
                  description: The action to perform.
                  example: create
                issue_number:
                  type: integer
                  description: The number of the issue (required for 'create' if not a PR).
                  example: 456
                pr_number:
                  type: integer
                  description: The number of the pull request (required for 'create' if not an issue).
                  example: 123
                comment_id:
                  type: string
                  description: The global node ID of the comment (required for 'update').
                  example: "IC_kwDOABcD1234567890"
                body:
                  type: string
                  description: The content of the comment.
      responses:
        '200':
          description: |
            Comment created or updated successfully. Returns the canonical comment identifier
            (`commentId`), its GitHub URL, and the relevant timestamp (`createdAt` on create,
            `updatedAt` on update) so the caller can surface the canonical reference for A2A
            propagation patterns — see `.agents/skills/pr-review/references/pr-review-guide.md §9`
            and `.agents/skills/pull-request/references/pull-request-workflow.md §8` for the
            comment-ID hand-off convention that pairs with `get_conversation({comment_id: …})`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'
        '400':
          description: Bad Request (missing arguments or invalid action).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /issues/{issue_number}/labels/manage:
    post:
      summary: Manage Issue Labels (Add or Remove)
      operationId: manage_issue_labels
      x-neo-tool-tier: write
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: false
      description: |
        Unified tool for adding or removing labels from an issue or pull request.

        **Action: 'add'**
        - Adds one or more labels.
        - **Important:** Use exact label names. Check with `list_labels` first.

        **Action: 'remove'**
        - Removes one or more labels.
        - **Important:** Use exact label names.
      tags: [Issues]
      parameters:
        - name: issue_number
          in: path
          required: true
          description: The number of the issue or pull request.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
                - labels
              properties:
                action:
                  type: string
                  enum: [add, remove]
                  description: The action to perform.
                  example: add
                labels:
                  type: array
                  items:
                    type: string
                  description: An array of label names.
                  example: ["bug", "priority"]
      responses:
        '200':
          description: Labels updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request (invalid action).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Issue or label not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /issues/{issue_number}/assignees/manage:
    post:
      summary: Manage Issue Assignees (Single Guarded MCP Operation — Add or Remove)
      operationId: manage_issue_assignees
      x-neo-tool-tier: write
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: false
      description: |
        Unified tool for assigning or unassigning users from a GitHub issue.
        Performs a single guarded operation with precondition checking.

        **Action: 'add' — gated**
        - Default `requireUnassigned: true` rejects adding to already occupied issues with
          `ASSIGNEE_CONFLICT` (HTTP 409).
        - To override an occupied issue, pass `acknowledgedReassign: '<reason>'` for strict replacement.
          This clears existing assignees, assigns the new set, and posts an audit-trail comment with the reason.
        - `requireUnassigned: false` allows legacy blind-add.

        **Action: 'remove' — ungated**
        - Unassigns one or more users (the named set).

        **Empty assignees array (`action: 'add'`, `assignees: []`) — clear mode**
        - Clears all current assignees safely.

        **Special Values:**
        - `@me`: Resolves to the authenticated GitHub user.

        **Permission Check:**
        Requires `ADMIN`, `MAINTAIN`, or `WRITE` permissions. Returns 403 otherwise.
      tags: [Issues]
      parameters:
        - name: issue_number
          in: path
          required: true
          description: The number of the issue.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
                - assignees
              properties:
                action:
                  type: string
                  enum: [add, remove]
                  description: The action to perform.
                  example: add
                assignees:
                  type: array
                  items:
                    type: string
                  description: An array of GitHub user logins. Use `@me` to assign/unassign the authenticated user.
                  example: ["@me"]
                requireUnassigned:
                  type: boolean
                  default: true
                  description: |
                    Precondition gate for `action: 'add'`. When `true` (default), the tool fetches
                    current assignees and rejects with `ASSIGNEE_CONFLICT` (HTTP 409) if non-empty,
                    unless `acknowledgedReassign` is provided. Set to `false` to bypass the gate
                    (legacy blind-add path; new callers should not rely on this).
                  example: true
                acknowledgedReassign:
                  type: string
                  description: |
                    Reason-bearing override for strict-replacement reassignment. When provided
                    alongside `action: 'add'` on an occupied issue, the tool clears existing
                    assignees, assigns the new set, and posts an audit-trail comment on the
                    issue capturing this reason. Required when overriding an existing assignment.
                  example: "context-exhaustion handoff from peer who session-sunsetted"
      responses:
        '200':
          description: Assignees updated successfully. Response includes `verifiedAssignees` (post-verify state) and, for override paths, `acknowledgedReassign` + `previousAssignees`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '403':
          description: Forbidden (insufficient permissions).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Issue not found.
          content:
            application/json:
