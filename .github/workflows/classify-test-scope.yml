name: Classify test scope

# The one changed-path classifier, shared by every workflow that runs a test suite.
#
# It lived inline in `test.yml` and was correct there while `test.yml` owned every suite. That
# stopped holding when the e2e tier moved to its own pipeline (#18408, on operator direction:
# "it would need to be an own pipeline, that takes no longer than 5m"). The tier then ran on
# EVERY pull request and push — @neo-gpt's witness is PR #18466, whose entire diff is one `uses:`
# SHA and which provisioned and ran the tier anyway — because the only classifier in the
# repository sat inside a workflow that does not gate it.
#
# The two ways out were a second copy of this predicate or one shared caller-agnostic job. A
# second copy drifts, and two statements of one fact that disagree is the exact failure the
# components whitelist below already carries a comment about. Extraction rather than relocation:
# `neomjs/neo-agent-skills#14` centralises non-product governance and explicitly excludes
# repository-specific product tests, so these Engine path predicates stay in this repository.
#
# Sharing a classifier does NOT couple the suites' reds. Callers keep separate workflow
# identities and separate checks, which is the half of #14685's failing-honest intent that
# outlived its retired mechanism: an e2e failure must not be readable as `test.yml` being red.

on:
  workflow_call:
    inputs:
      resolve_brain_tip:
        description: Resolve the Brain's `dev` tip into `brain_sha` when the Brain-gated tier runs.
        type: boolean
        default: false
    outputs:
      run_unit:
        description: Whether the unit suite is relevant to the changed paths.
        value: ${{ jobs.classify.outputs.run_unit }}
      run_components:
        description: Whether the components suite is relevant to the changed paths.
        value: ${{ jobs.classify.outputs.run_components }}
      run_e2e:
        description: Whether the e2e (engine tier) suite is relevant to the changed paths.
        value: ${{ jobs.classify.outputs.run_e2e }}
      e2e_brain_tier:
        description: Which Brain-gated e2e population runs, `full`, or `none` when the change cannot reach the tier; a push is always `full`.
        value: ${{ jobs.classify.outputs.e2e_brain_tier }}
      skip_reason:
        description: Human-readable reason a caller can print when it skips.
        value: ${{ jobs.classify.outputs.skip_reason }}
      e2e_boundary_report:
        description: One line per changed file, saying whether the E2E boundary admits it and which rule leaves it out.
        value: ${{ jobs.classify.outputs.e2e_boundary_report }}
      brain_sha:
        description: The Brain's `dev` tip, resolved once per run when `resolve_brain_tip` is set and the Brain-gated tier runs; empty otherwise.
        value: ${{ jobs.classify.outputs.brain_sha }}

jobs:
  classify:
    name: Classify test scope
    runs-on: ubuntu-latest
    outputs:
      run_unit: ${{ steps.scope.outputs.run_unit }}
      run_components: ${{ steps.scope.outputs.run_components }}
      run_e2e: ${{ steps.scope.outputs.run_e2e }}
      e2e_brain_tier: ${{ steps.scope.outputs.e2e_brain_tier }}
      skip_reason: ${{ steps.scope.outputs.skip_reason }}
      e2e_boundary_report: ${{ steps.scope.outputs.e2e_boundary_report }}
      brain_sha: ${{ steps.tip.outputs.sha }}

    steps:
      - name: Classify changed paths
        id: scope
        uses: actions/github-script@v9
        with:
          script: |
            const eventName = context.eventName;

            // Why a diff is unavailable, printed as the skip reason when every tier runs instead
            let unavailableReason = 'changed files unavailable';

            // The base a push's changed files were diffed from; its content reads compare against it too
            let pushBase = null;

            // A newer push cancels this workflow's older run, so diffing from `before` would leave
            // the cancelled push's commits in no classified range. Diff from the head of this
            // workflow's last completed, non-cancelled push run instead: completed ranges then
            // chain, and their union covers every commit. No such run, or a failed lookup, fails
            // toward running.
            async function lastCompletedHead(after) {
              try {
                const { data: current } = await github.rest.actions.getWorkflowRun({
                  owner : context.repo.owner,
                  repo  : context.repo.repo,
                  run_id: context.runId
                });
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner      : context.repo.owner,
                  repo       : context.repo.repo,
                  workflow_id: current.workflow_id,
                  branch     : current.head_branch,
                  event      : 'push',
                  status     : 'completed',
                  per_page   : 20
                });
                const run = data.workflow_runs.find(run => run.conclusion !== 'cancelled' && run.head_sha !== after);

                if (!run) {
                  unavailableReason = 'no completed, non-cancelled push run of this workflow to diff against';
                  return null;
                }

                core.info(`Diffing from run ${run.id}'s head ${run.head_sha}, this workflow's last completed push run.`);
                return run.head_sha;
              } catch (error) {
                unavailableReason = `the last completed push run could not be read: ${error.message}`;
                return null;
              }
            }

            async function getChangedFiles() {
              if (eventName === 'pull_request') {
                const files = await github.paginate(github.rest.pulls.listFiles, {
                  owner      : context.repo.owner,
                  repo       : context.repo.repo,
                  pull_number: context.payload.pull_request.number,
                  per_page   : 100
                });

                return files.map(file => file.filename);
              }

              if (eventName === 'push') {
                const after = context.payload.after;
                pushBase    = after ? await lastCompletedHead(after) : null;

                if (!pushBase) {
                  return null;
                }

                const comparison = await github.rest.repos.compareCommitsWithBasehead({
                  owner   : context.repo.owner,
                  repo    : context.repo.repo,
                  basehead: `${pushBase}...${after}`,
                  per_page: 100
                });

                return comparison.data.files?.map(file => file.filename) || null;
              }

              return null;
            }

            async function isCurrentPullRequestHead() {
              if (eventName !== 'pull_request') {
                return true;
              }

              const pull = await github.rest.pulls.get({
                owner      : context.repo.owner,
                repo       : context.repo.repo,
                pull_number: context.payload.pull_request.number
              });
              const eventHead = context.payload.pull_request.head.sha;
              const liveHead  = pull.data.head.sha;

              if (eventHead === liveHead) {
                return true;
              }

              const reason = `stale workflow head ${eventHead}; live PR head is ${liveHead}`;

              core.notice(`Skipping expensive test suites: ${reason}`);
              core.setOutput('run_unit', 'false');
              core.setOutput('run_components', 'false');
              core.setOutput('run_e2e', 'false');
              core.setOutput('e2e_brain_tier', 'none');
              core.setOutput('skip_reason', reason);
              await core.summary
                .addHeading('Stale workflow attempt')
                .addRaw(`Skipped expensive test suites because ${reason}.`)
                .write();

              return false;
            }

            if (!await isCurrentPullRequestHead()) {
              return;
            }

            const files = await getChangedFiles();

            if (!files || files.length === 0) {
              core.info(`Changed files are unavailable (${unavailableReason}); running full test suites.`);
              core.setOutput('run_unit', 'true');
              core.setOutput('run_components', 'true');
              core.setOutput('run_e2e', 'true');
              core.setOutput('e2e_brain_tier', 'full');
              core.setOutput('skip_reason', unavailableReason);
              return;
            }

            const normalizedFiles = files.map(file => file.replace(/\\/g, '/'));

            // package.json carries unrelated kinds of change, and the path atom cannot tell them
            // apart, so resolve the CONTENT at both refs:
            //
            //   dependency-kind (dependencies / devDependencies / overrides) — shifts the installed
            //     tree every browser suite runs against.
            //   invoked scripts — the e2e job runs `bundle-browser-deps` and its two children, and
            //     the tier's own `webServer` launches `server-start`. Editing one of those changes
            //     what the tier executes just as surely as editing the server config it points at.
            //   everything else (an unrelated script, `version`, `description`) — cannot.
            //
            // Both facets come from ONE pair of fetches: the read is per ref, not per question.
            // The completeness rule is unchanged — anything undeterminable (missing refs, fetch or
            // parse failure) fails TOWARD running, for every facet at once.
            //
            // Packages no browser tier loads leave the dependency-kind comparison: agent tooling that
            // webpack never bundles and Playwright never imports. Unit still runs on their bump, and
            // its `prepare.spec.mjs` plus `baseline / Skills materialized` own their install path.
            // Named rather than inferred, so an unlisted package fails toward running.
            const browserUnreachablePackages = ['neo-agent-skills'];

            // One committed JSON file at both refs. Fork PRs: the head SHA exists only in the fork
            // repo, so the head read follows the fork's coordinates and the base read stays on the PR
            // target repo. Throws on an undeterminable ref or a failed read or parse; every caller
            // turns that into running.
            async function readAtBothRefs(filePath) {
              const baseRef = eventName === 'pull_request' ? context.payload.pull_request.base.sha : pushBase;
              const headRef = eventName === 'pull_request' ? context.payload.pull_request.head.sha : context.payload.after;

              if (!baseRef || !headRef || /^0+$/.test(baseRef)) {
                throw new Error('base/head ref undeterminable');
              }

              const headRepo = eventName === 'pull_request' && context.payload.pull_request.head.repo?.fork === true
                ? {owner: context.payload.pull_request.head.repo.owner.login, repo: context.payload.pull_request.head.repo.name}
                : {owner: context.repo.owner, repo: context.repo.repo};

              core.info(`${filePath} head content resolves from ${headRepo.owner}/${headRepo.repo}.`);

              const read = async (ref, {owner, repo}) => {
                const res = await github.rest.repos.getContent({owner, repo, path: filePath, ref});

                return JSON.parse(Buffer.from(res.data.content, 'base64').toString('utf8'));
              };

              return Promise.all([read(baseRef, {owner: context.repo.owner, repo: context.repo.repo}), read(headRef, headRepo)]);
            }

            async function packageJsonRelevance() {
              const untouched = {dependencyKind: false, e2eScripts: false},
                    undecided = {dependencyKind: true,  e2eScripts: true};

              if (!normalizedFiles.includes('package.json')) {
                return untouched;
              }

              try {
                const depKindKeys = ['dependencies', 'devDependencies', 'overrides'],
                      // Derived from the e2e job's own launch chain rather than guessed: the
                      // workflow step runs `bundle-browser-deps`, whose definition delegates to one
                      // `bundle-<name>` per shipped browser bundle, and `playwright.config.e2e.mjs`'s
                      // `webServer.command` runs `server-start`. Naming the children matters —
                      // `bundle-browser-deps` can keep its text while what it delegates to changes.
                      // The children track `buildScripts/util/browserBundles.mjs`, which a unit arm
                      // holds to this list because YAML cannot import it — plus `build-highlightjs` and
                      // `bundle-monaco`, whose outputs are directories rather than `dist/<name>.mjs` files.
                      e2eScriptKeys = ['build-highlightjs', 'bundle-browser-deps', 'bundle-marked', 'bundle-mermaid', 'bundle-monaco', 'bundle-parse5', 'server-start'];

                const facets = pkg => {
                  const depKind = {};
                  const scripts = {};

                  for (const key of depKindKeys) {
                    const entries = pkg[key];

                    if (entries && typeof entries === 'object') {
                      depKind[key] = Object.keys(entries)
                        .filter(name => !browserUnreachablePackages.includes(name))
                        .sort()
                        .map(name => [name, entries[name]]);
                    }
                  }

                  // Absent and present-but-empty must not compare equal: a DELETED script changes
                  // what the tier runs exactly as much as an edited one.
                  for (const key of e2eScriptKeys) {
                    scripts[key] = pkg.scripts?.[key] ?? null;
                  }

                  return {depKind, scripts};
                };

                const [base, head] = (await readAtBothRefs('package.json')).map(facets),
                      relevance    = {
                        dependencyKind: JSON.stringify(base.depKind) !== JSON.stringify(head.depKind),
                        e2eScripts    : JSON.stringify(base.scripts) !== JSON.stringify(head.scripts)
                      };

                core.info(`package.json dependency-kind change: ${relevance.dependencyKind}`);
                core.info(`package.json e2e-script change: ${relevance.e2eScripts}`);
                return relevance;
              } catch (error) {
                core.info(`package.json relevance undeterminable (${error.message}); failing toward running.`);
                return undecided;
              }
            }

            // The lockfile half of the dependency facet, so its path alone no longer admits both browser
            // tiers. Compared without the unreachable packages' own entries and the root's specifiers
            // for them: an unchanged remainder admits nothing, and a shared dependency such a bump
            // moves stays in it.
            async function packageLockRelevance() {
              if (!normalizedFiles.includes('package-lock.json')) {
                return false;
              }

              const specifierFields   = ['dependencies', 'devDependencies', 'optionalDependencies', 'peerDependencies'],
                    unreachable       = key => browserUnreachablePackages.some(name =>
                      key === `node_modules/${name}` || key.startsWith(`node_modules/${name}/`)),
                    withoutSpecifiers = root => Object.fromEntries(Object.entries(root).map(([field, value]) =>
                      [field, specifierFields.includes(field)
                        ? Object.fromEntries(Object.entries(value).filter(([name]) => !browserUnreachablePackages.includes(name)))
                        : value])),
                    remainder = lock => JSON.stringify({
                      ...lock,
                      packages: Object.fromEntries(Object.entries(lock.packages ?? {})
                        .filter(([key]) => !unreachable(key))
                        .map(([key, entry]) => [key, key === '' ? withoutSpecifiers(entry) : entry]))
                    });

              try {
                const [base, head] = (await readAtBothRefs('package-lock.json')).map(remainder);

                core.info(`package-lock.json change beyond browser-unreachable packages: ${base !== head}`);
                return base !== head;
              } catch (error) {
                core.info(`package-lock.json relevance undeterminable (${error.message}); failing toward running.`);
                return true;
              }
            }

            const packageJsonChange           = await packageJsonRelevance(),
                  packageJsonDependencyChange = packageJsonChange.dependencyKind,
                  packageJsonE2eScriptChange  = packageJsonChange.e2eScripts,
                  packageLockChange           = await packageLockRelevance();

            // Keep explicit unit/component statuses on docs-only PRs instead of
            // workflow-level paths-ignore. Missing checks can block protected branches.
            const isDocsOnlyPath = file =>
              file.endsWith('.md') ||
              file.startsWith('learn/');

            // Unit has committed content guards, notably the release-note mutable
            // GitHub-link scan and generated portal index fixtures.
            // `learn/` is docs-only by path but not by consequence: its links are checked against
            // learn/tree.json, so a guide-only edit can introduce a route that resolves to no record.
            // Without this the corpus gate is skipped exactly on the PRs it exists to catch.
            const requiresUnitForContent = file =>
              file.startsWith('.github/RELEASE_NOTES/') ||
              file.startsWith('apps/portal/resources/data/') ||
              file.startsWith('learn/');

            // Whitelist: the components suite mounts real components in a browser against
            // the webpack dev server — engine (src/), live-compiled theme SCSS, the component
            // specs + their harness apps, the config chain, dep manifests, or this workflow.
            // Same completeness rule as integration: a missed path silently skips the suite
            // (#15368 — this suite ran in NO workflow at all until it was wired here).
            //
            // "This workflow" is now two files: the runner that invokes the suite and the
            // classifier that gates it. An edit to either can change what the suite covers, so
            // both are named — extracting the predicate must not make editing the predicate
            // invisible to the suites it decides for.
            const isComponentsRelevantPath = file =>
              file.startsWith('src/') ||
              file.startsWith('resources/scss/') ||
              file.startsWith('test/playwright/component/') ||
              file === 'test/playwright/playwright.config.component.mjs' ||
              (file === 'package.json' && packageJsonDependencyChange) ||
              (file === 'package-lock.json' && packageLockChange) ||
              file === '.github/workflows/test.yml' ||
              file === '.github/workflows/classify-test-scope.yml';

            // The e2e (engine tier) boots real example and harness apps against a built dev server,
            // so its relevant surface is strictly wider than the components suite's — it takes in
            // what the job LAUNCHES and BUILDS, not only what its specs import.
            //
            // This predicate was a file list once, and the list was the defect: it named the specs'
            // own imports and their navigation targets, and went silently false on the config's
            // imports, the harness helpers, the theme build and the server it starts. A location
            // list cannot help doing that, because it can only name what existed when it was
            // written. So the boundary below is stated as RULES over the chain the job actually
            // runs, derived from `playwright.config.e2e.mjs` (its own imports plus
            // `webServer.command`), `fixtures.mjs`, `e2e/globalSetup.mjs` and the workflow's steps:
            //
            //   src/                  the engine under test
            //   examples/, apps/      navigated by the grid, colors, dock and workstation specs
            //   resources/scss/       compiled to the theme the paint and geometry arms measure
            //   buildScripts/         the theme assets, the webpack server `server-start` runs,
            //                         and `e2eCiSelection.mjs`, which DECIDES the spec population
            //   test/playwright/      the config, the fixtures, the helpers they import, the specs
            //
            // Two exclusions under `test/playwright/`, both counted: `unit/` and `component/` are
            // the sibling suites' own spec trees and cannot change what this tier covers.
            // `component/apps/` is re-admitted inside the second, because the e2e specs navigate
            // those harness apps directly.
            //
            // Whole directories rather than narrower paths — `apps/` not `apps/workstation/`,
            // `buildScripts/` not two files — because this gate's failure mode is SILENCE: a false
            // negative costs coverage behind a green check, and nothing reports it. So narrowing is a
            // DENY-list of what the run provably never reaches, imported OR fetched OR executed, and a
            // path added tomorrow still admits the tier:
            //
            //   apps/portal/resources/data/blog.json   read only by the lazily loaded news/blog view,
            //                                          a route no e2e spec opens; every blog post
            //                                          registers itself there. The rest of the portal's
            //                                          data stays in (`seo.json` loads on every route)
            //   buildScripts/{create,helpers,release}/ outside the launch chain except create/move.mjs,
            //                                          executed by SourceMoveWorkspaceNL
            //
            // A unit arm reds when either premise stops holding. A false positive is not cheap either:
            // the Brain-gated tier follows this boundary, so one costs fourteen jobs on a twenty-job cap.
            const isPortalBlogRegistry    = file => file === 'apps/portal/resources/data/blog.json';
            const isOutsideE2eLaunchChain = file =>
              /^buildScripts\/(create|helpers|release)\//.test(file) && file !== 'buildScripts/create/move.mjs';

            const isE2eTestSupportPath = file =>
              file.startsWith('test/playwright/component/apps/') || (
                file.startsWith('test/playwright/') &&
                !file.startsWith('test/playwright/unit/') &&
                !file.startsWith('test/playwright/component/')
              );

            const isE2eRelevantPath = file =>
              file.startsWith('src/') ||
              file.startsWith('examples/') ||
              (file.startsWith('apps/') && !isPortalBlogRegistry(file)) ||
              file.startsWith('resources/scss/') ||
              (file.startsWith('buildScripts/') && !isOutsideE2eLaunchChain(file)) ||
              isE2eTestSupportPath(file) ||
              (file === 'package.json' && (packageJsonDependencyChange || packageJsonE2eScriptChange)) ||
              (file === 'package-lock.json' && packageLockChange) ||
              file === '.github/workflows/test-e2e.yml' ||
              file === '.github/workflows/classify-test-scope.yml';

            // The Brain-gated tier runs in full on the same boundary plus its own workflow, and on every
            // push. Any other pull request selects `none`: the smoke shard it ran there tested the
            // Brain's `dev` tip rather than the change, and the `dev` push already runs the full tier on
            // every merge.
            const brainTier = eventName !== 'pull_request' || normalizedFiles.some(file =>
                isE2eRelevantPath(file) || file === '.github/workflows/test-e2e-brain.yml') ? 'full' : 'none';

            // Each changed file against the boundary, for the Brain tier's skip job to print. With
            // `none`, a misclassified path runs no Brain shard until the `dev` push; this way the
            // pull request that carries it shows the rule that left it out.
            const e2eBoundaryRule = file =>
              isE2eRelevantPath(file)       ? 'in' :
              isPortalBlogRegistry(file)    ? 'out (portal blog registry, read only on the news route)' :
              isOutsideE2eLaunchChain(file) ? 'out (buildScripts outside the e2e launch chain)' :
              file === 'package-lock.json'  ? 'out (unchanged beyond browser-unreachable packages)' :
              file === 'package.json'       ? 'out (no dependency-kind or invoked-script change)' :
              isDocsOnlyPath(file)          ? 'out (docs or content)' :
                                              'out (no e2e rule matches)';

            const runUnit        = normalizedFiles.some(file => !isDocsOnlyPath(file) || requiresUnitForContent(file));
            const runComponents  = normalizedFiles.some(isComponentsRelevantPath);
            const runE2e         = normalizedFiles.some(isE2eRelevantPath);

            core.info(`Changed files: ${normalizedFiles.join(', ')}`);
            core.info(`run_unit=${runUnit}`);
            core.info(`run_components=${runComponents}`);
            core.info(`run_e2e=${runE2e}`);
            core.info(`e2e_brain_tier=${brainTier}`);

            core.setOutput('run_unit', String(runUnit));
            core.setOutput('run_components', String(runComponents));
            core.setOutput('run_e2e', String(runE2e));
            core.setOutput('e2e_brain_tier', brainTier);
            const boundaryReport = normalizedFiles.map(file => `${file}: ${e2eBoundaryRule(file)}`).join('\n');
            const skipReason     = 'change does not touch relevant paths for this suite (docs/content/config or unrelated test suite)';

            core.setOutput('e2e_boundary_report', boundaryReport);
            core.setOutput('skip_reason', skipReason);

            // A ruled-out tier starts no runner, so its reason lives here: each changed file and the
            // rule that left it out, so a misclassification shows on the pull request that carries it.
            if (!runE2e || brainTier === 'none') {
              await core.summary
                .addHeading('E2E tiers ruled out', 3)
                .addRaw(`engine tier: ${runE2e ? 'runs' : 'skipped'} · Brain-gated tier: ${brainTier}. Reason: ${skipReason}.`, true)
                .addCodeBlock(boundaryReport)
                .write();
            }

      # The Brain-gated tier tests the Brain's `dev` tip, resolved once per run attempt: every shard,
      # and every rerun of failed jobs, reuses this output. Re-running ALL jobs re-runs this step and
      # resolves the tip again. It runs here, not in a job of its own: a job would boot a runner for
      # a three-second `git ls-remote`, and a ruled-out tier needs no tip at all.
      - name: Resolve the Brain's dev tip
        id: tip
        if: ${{ inputs.resolve_brain_tip && steps.scope.outputs.e2e_brain_tier != 'none' }}
        run: |
          sha=$(git ls-remote https://github.com/neomjs/neo-agent-brain refs/heads/dev | cut -f1)
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
