name: Agent PR Body Lint
on:
  pull_request:
    types: [opened, edited, synchronize, ready_for_review]


jobs:
  lint-pr-body:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Body
        uses: actions/github-script@v9
        with:
          script: |
            const pr     = context.payload.pull_request;
            const author = pr.user.login;
            const body   = pr.body || "";
            const isDraft = Boolean(pr.draft);

            // Only enforce for known AI agent accounts or PRs labeled with 'ai'
            const agentAuthors  = ['neo-opus-ada', 'neo-opus-grace', 'neo-opus-vega', 'neo-gemini-pro', 'neo-gpt'];
            const isAgentAuthor = agentAuthors.includes(author) || author.startsWith('neo-');
            const hasAiLabel    = pr.labels && pr.labels.some(l => l.name === 'ai');

            if (!isAgentAuthor && !hasAiLabel) {
              console.log(`✅ Author ${author} is not an AI agent and no 'ai' label present. Skipping lint.`);
              return;
            }

            console.log(`🔍 Linting PR body for agent-authored PR by: ${author}`);

            // ──────────────────────────────────────────────────────────────────────
            // Two-layer mechanical body-shape validation (#11501, mirrors reviewer-side
            // PR #11502/#11495 pattern derived from PR #11494's MCP `manage_pr_review`
            // canonical primary surface).
            //
            // VISIBLE layer: explicit anchors from `pull-request-workflow.md §9`
            // minimum-viable PR body structure. Misses surface as a precise list in
            // the collapsed details block + ONE diagnostic anchor named in the
            // human-facing message.
            //
            // INVISIBLE layer: structural template substrings checked SILENTLY.
            // Misses NOT named in the follow-up comment — neither in prose nor as
            // enumeration. Defeats Goodhart anchor-stuffing where an agent hallucinates
            // a body that contains exactly the named visible anchors but omits the
            // actual template structure or self-identification.
            //
            // ⚠️  SYNCHRONIZATION PROTOCOL: this list MUST stay in sync with
            // `pull-request-workflow.md §9` minimum-viable PR body + §5 Self-
            // Identification mandate. Per #11501 cycle-2 scope-correction, the
            // shared-module extraction (`prReviewAnchors.mjs`) was reverted in
            // PR #11502; sync-by-convention with comment-pointers is the accepted
            // cross-surface coordination shape going forward.
            // ──────────────────────────────────────────────────────────────────────

            const VISIBLE_PR_BODY_ANCHORS = [
              "Evidence:",
              "## Test Evidence",
              "## Post-Merge Validation"
            ];

            const INVISIBLE_PR_BODY_ANCHORS = [
              "Authored by ",
              "## Deltas"
            ];

            const missingVisible   = VISIBLE_PR_BODY_ANCHORS  .filter(a => !body.includes(a));
            const missingInvisible = INVISIBLE_PR_BODY_ANCHORS.filter(a => !body.includes(a));

            // Ticket-reference is a separate visible check (regex pattern, not substring).
            //
            // Operator rule (#12367): every agent PR body MUST contain at least one `Resolves #N`
            // — the ONLY sanctioned closing keyword (it means *delivered work*). This mechanically
            // enforces the 1-PR-per-ticket model: a ticket that needs N PRs cannot have N valid
            // `Resolves` (only one PR can resolve it), so it must become an epic + subs or be split.
            //   - `Closes #N` is FORBIDDEN: "Closes" = closed-without-delivery (not-planned /
            //     superseded / dropped) — that outcome needs NO PR, so a PR must never carry it.
            //   - `Fixes #N`  is FORBIDDEN: ambiguous; use `Resolves` (bug fixes included).
            //   - `Refs #N` / `Related: #N` are allowed as ADDITIONAL references (e.g. a parent
            //     epic). Draft PRs may temporarily use `Refs #N` / `Related: #N`
            //     without `Resolves #N`, but `ready_for_review` reruns this workflow and
            //     restores the mandatory close-target gate before handoff.
            const hasResolves            = /\bResolves:?\s+#\d+/i.test(body);
            const hasNonClosingReference = /\b(Refs|Related):?\s+#\d+/i.test(body);
            const forbiddenClose         = body.match(/\b(Closes|Fixes):?\s+#\d+/i);

            if (forbiddenClose) {
              missingVisible.push(
                "`" + forbiddenClose[1] + " #N` is forbidden — use `Resolves #N` " +
                "(`Closes` = closed-without-delivery → no PR needed; `Fixes` is ambiguous)"
              );
            }

            if (!hasResolves && !(isDraft && hasNonClosingReference)) {
              missingVisible.push(isDraft
                ? "`Refs #N` or `Related: #N` (draft-only non-closing reference required when `Resolves #N` is absent)"
                : "`Resolves #N` (mandatory closing keyword — `Refs`/`Related` alone is NOT sufficient)");
            }

            // ──────────────────────────────────────────────────────────────────────
            // Close-relation audit (#16829). GitHub auto-close is textual: `Resolves #N`
            // closes #N at merge no matter what its Acceptance Criteria still track.
            // `pr-review-guide.md §5.2` is reviewer discipline; this is its mechanical
            // floor. Two orphan classes, both mechanically decidable:
            //   (a) a close-target whose AC section carries an unchecked item WITHOUT an
            //       `[L<N>-deferred — …]` annotation (the sanctioned residual marker —
            //       annotated open-ended verification closes normally);
            //   (b) a Post-Merge Validation checklist item whose every `#N` reference is
            //       itself being closed (its home dies with the merge). No-reference PMV
            //       items are NOT flagged: §5.2 rule 4's open-ended verification rides
            //       free (#16796's close of #16800 is the control shape).
            // The decision core is pure — ticket bodies arrive as INPUT, the fetch lives
            // at the call site — so the unit spec slices it out of this file between the
            // sentinels and runs the fixture corpus off-CI. One producer, no twin.
            // ──────────────────────────────────────────────────────────────────────
            // #16829-CLOSE-RELATION-AUDIT-BEGIN
            function sliceBodySection(text, heading) {
              const match = text.match(new RegExp('^## ' + heading + '[ \\t]*$', 'm'));

              if (!match) return '';

              return text.slice(match.index + match[0].length).split(/^## /m)[0]
            }

            function auditCloseRelations(bodyText, issueBodiesByNumber) {
              const findings  = [];
              const closeNums = [...new Set([...bodyText.matchAll(/\bResolves:?\s+#(\d+)/gi)].map(m => m[1]))];

              for (const num of closeNums) {
                const ticketBody = issueBodiesByNumber[num];

                if (typeof ticketBody !== 'string') {
                  findings.push(`#${num}: the ticket body was unavailable to the audit — a gate that cannot see its input must not pass silently`);
                  continue
                }

                const unmet = sliceBodySection(ticketBody, 'Acceptance Criteria')
                  .split('\n')
                  .filter(line => /^\s*-\s+\[ \]/.test(line))
                  .filter(line => !/\[L\d+-deferred/i.test(line));

                for (const item of unmet) {
                  findings.push(`#${num} carries an unmet, un-annotated acceptance criterion this merge would close over: ${item.trim()}`)
                }
              }

              const pmvItems = sliceBodySection(bodyText, 'Post-Merge Validation')
                .split('\n')
                .filter(line => /^\s*-\s+\[[ xX]\]/.test(line));

              for (const item of pmvItems) {
                const refs = [...item.matchAll(/#(\d+)/g)].map(m => m[1]);

                if (refs.length > 0 && refs.every(ref => closeNums.includes(ref))) {
                  findings.push(`Post-Merge Validation item references only ticket(s) this PR closes — its home dies with the merge: ${item.trim()}`)
                }
              }

              return findings
            }
            // #16829-CLOSE-RELATION-AUDIT-END

            const closeRelationFindings = [];

            if (hasResolves) {
              const resolveNums = [...new Set([...body.matchAll(/\bResolves:?\s+#(\d+)/gi)].map(m => m[1]))];
              const issueBodies = {};

              for (const num of resolveNums) {
                try {
                  const issue = await github.rest.issues.get({
                    owner: context.repo.owner, repo: context.repo.repo, issue_number: Number(num)
                  });
                  issueBodies[num] = issue.data.body || "";
                } catch (err) {
                  // a gate that cannot see its input must not pass silently — the core
                  // converts the missing body into a finding below
                  issueBodies[num] = null;
                }
              }

              closeRelationFindings.push(...auditCloseRelations(body, issueBodies));
            }

            if (closeRelationFindings.length > 0) {
              missingVisible.push(
                "close-relation audit (#16829): " + closeRelationFindings.length + " orphaned item(s). " +
                "Sanctioned repairs: (a) tick the delivered ACs on the ticket with their receipts; " +
                "(b) annotate genuinely post-merge criteria on the ticket as `[L<N>-deferred — …]`; " +
                "(c) split an L2-delivered leaf (#16776 pattern) and `Resolves` the leaf. " +
                "Findings: " + closeRelationFindings.join(" | ")
              );
            }

            // ──────────────────────────────────────────────────────────────────────
            // Stacked-PR guard (#15352). A PR branched off another feature branch —
            // rather than `dev` — carries that branch's commits. It is INVISIBLE to
            // every other gate: GitHub computes the file diff from the merge-base, so
            // the reviewed surface is correct; CI is green (the code is fine, it is
            // just someone else's, in this PR); and this body lint's own `Resolves`
            // check passes (the body is honest about intent). The foreign commits
            // surface ONLY in the Commits tab, which reviewers do not read.
            //
            // The signal is the TICKET a commit claims, never a count: a legitimate PR
            // has many commits and a stacked one can have two. Every commit's trailing
            // `(#K)` must be a ticket this PR's body declares (`Resolves`/`Refs`/
            // `Related`). A commit with no `(#K)` suffix is the ticket gate's business,
            // not this one's — skipped here.
            const declaredTickets = new Set(
              [...body.matchAll(/\b(?:Resolves|Refs|Related):?\s+#(\d+)/gi)].map(m => m[1])
            );

            const foreignCommits = [];

            if (declaredTickets.size > 0) {
              const commits = await github.paginate(github.rest.pulls.listCommits, {
                owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number, per_page: 100
              });

              for (const c of commits) {
                const subject = (c.commit.message || "").split("\n")[0];
                const ticket  = subject.match(/\(#(\d+)\)\s*$/);
                // no ticket suffix → ticket gate's concern, not the stacking check
                if (ticket && !declaredTickets.has(ticket[1])) {
                  foreignCommits.push({ sha: c.sha.slice(0, 10), ticket: ticket[1], subject: subject.slice(0, 72) });
                }
              }
            }

            if (foreignCommits.length > 0) {
              const declaredList = [...declaredTickets].map(t => `#${t}`).join(", ");
              const rows = foreignCommits.map(c => `- \`${c.sha}\` claims **#${c.ticket}** — \`${c.subject}\``).join("\n");
              const stackedBody = [
                `## 🚨 Stacked-PR Guard: foreign commits in PR #${pr.number}`,
                ``,
                `@${author} — this PR's commit list contains ${foreignCommits.length} commit(s) for ticket(s) its body does not declare.`,
                `The body declares ${declaredList}. The commits below claim other tickets:`,
                ``,
                rows,
                ``,
                `**This almost always means the branch was cut from another feature branch instead of \`dev\`** — a`,
                `\`git checkout dev\` that failed silently (e.g. \`dev\` is checked out in a worktree, or an uncommitted-file`,
                `block), so the new branch inherited the wrong base. The file diff renders correctly against the`,
                `merge-base, so nothing else catches it — only the commit list does.`,
                ``,
                `**Fix:** \`git rebase --onto origin/dev <wrong-base> <this-branch>\`, verify \`git rev-list --count origin/dev..HEAD\``,
                `equals only your commits, then \`git push --force-with-lease\`. Verify the BASE, not the branch name.`,
                ``,
                `<sub>Resolves #15352. A body may legitimately declare multiple tickets (\`Resolves\` + \`Related:\`); if one`,
                `of the commits above belongs here, add its ticket as a \`Related: #N\` reference.</sub>`
              ].join("\n");

              if (context.payload.action === "opened") {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, body: stackedBody
                });
              }

              core.setFailed(
                `PR #${pr.number} carries ${foreignCommits.length} foreign commit(s) — ` +
                foreignCommits.map(c => `${c.sha} (#${c.ticket})`).join(", ") +
                `. Body declares ${declaredList}. Likely branched off a feature branch, not dev. See follow-up comment.`
              );
              return;
            }

            if (missingVisible.length === 0 && missingInvisible.length === 0) {
              console.log("✅ PR body contains all required anchors.");
              return;
            }

            // Compose comment that guides toward the skill without enumerating invisible
            // anchors. Even visible-list naming is bounded — at most ONE diagnostic
            // anchor in the prose (the full visible-miss list goes in the collapsed
            // details block for programmatic access; invisible misses are NEVER named).
            const diagnosticAnchor = missingVisible[0] || null;

            const skillPath    = '.agents/skills/pull-request/SKILL.md';
            const workflowPath = '.agents/skills/pull-request/references/pull-request-workflow.md';

            const prUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${pr.number}`;

            const commentBody = [
              `## 🚨 Agent PR Body Lint Violation`,
              ``,
              `@${author} — your [PR body on PR #${pr.number}](${prUrl}) does not match the pull-request template structure.`,
              ``,
              `**Required action**: read \`${skillPath}\` BEFORE editing the PR body. The skill points at:`,
              `  - Minimum-viable PR body structure: \`${workflowPath} §9\``,
              `  - Self-Identification mandate: \`${workflowPath} §5\``,
              ``,
              `Do NOT compose a substitute template or hallucinate section headings. The validator`,
              `checks more structural anchors than this comment names. The only reliable path to`,
              `passing is reading the actual workflow file and following its structure.`,
              ``,
              diagnosticAnchor
                ? `**Diagnostic hint**: at least one recognized anchor like \`${diagnosticAnchor}\` is missing.`
                : `**Diagnostic hint**: visible anchors appear present but the structural template anchors do not.`,
              ``,
              `<details>`,
              `<summary>Visible anchors missing (full list)</summary>`,
              ``,
              missingVisible.length > 0
                ? missingVisible.map(a => `- \`${a}\``).join('\n')
                : `(none — visible layer passed; invisible structural layer caught the miss)`,
              ``,
              `</details>`,
              ``,
              `<sub>This is the CI tool-boundary lint companion to PR #11494's MCP \`manage_pr_review\` validator and PR #11502's \`agent-pr-review-body-lint.yml\` reviewer-side lint.`,
              `Resolves #11501.</sub>`
            ].join('\n');

            // Only comment if this is a newly opened PR, to avoid spam on edits
            if (context.payload.action === 'opened') {
              await github.rest.issues.createComment({
                owner       : context.repo.owner,
                repo        : context.repo.repo,
                issue_number: pr.number,
                body        : commentBody
              });
            }

            // The annotation must carry the ANSWER, not a pointer to one. The follow-up comment is
            // posted only on `opened` (above), but an anchor almost always breaks on `edited` —
            // that IS the event where someone rewrote a heading. Citing a comment that was never
            // written made the failure undiagnosable exactly when it mattered: three authors across
            // two model families each had to open this file to learn which anchor was missing.
            // `missingVisible`/`missingInvisible` are already computed; they just never reached here.
            const missingAll = [...missingVisible, ...missingInvisible];

            core.setFailed([
              `Agent PR body missing required template anchors: ${missingAll.map(a => `\`${a}\``).join(', ')}.`,
              ``,
              `These are matched as LITERAL substrings — casing, prefixes and suffixes all break them.`,
              `Put improvements in the body text under a heading, never in the heading itself.`,
              context.payload.action === 'opened'
                ? `A follow-up comment on PR #${pr.number} carries the full guidance.`
                : `(No follow-up comment is posted on \`${context.payload.action}\` events — this annotation is the diagnostic.)`
            ].join('\n'));
