# Calls the canonical substrate guard. The logic lives in neomjs/neo-agent-skills so that every
# enrolled repo runs the same guard rather than 48 copies that drift apart — which is the exact
# failure this contract exists to close, reproduced one level up.
#
# A red here means the skill tree no longer matches the revision this repo's
# AGENT_SUBSTRATE_REVISION.json pins, or the .claude façade no longer matches what
# .agents/skills/skills.manifest.json declares. Re-sync from canonical; do not edit in place.

name: substrate-sync

# NO path filter, deliberately. Two reasons, and the second is the load-bearing one:
#
# 1. Reach — the revalidation trigger fires on `ai/graph/identityRoots.mjs`, and the guard's own
#    reach must include this workflow file. A filter enumerating paths will drift from what the
#    instrument actually reads.
# 2. Bindability — GitHub reports a path-SKIPPED workflow as pending, never success, so a filtered
#    check can never be a required status check: every PR that misses the filter blocks forever.
#    An always-emitted context is the only shape #17783 can safely bind.
#
# The job is cheap: two shallow-ish checkouts and two node scripts.
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  substrate:
    uses: neomjs/neo-agent-skills/.github/workflows/verify-substrate-sync.yml@main
