openapi: 3.0.0
info:
  title: Neo GitLab Workflow MCP API
  version: 1.0.0
paths:
  /healthcheck:
    get:
      operationId: healthcheck
      summary: Healthcheck
      description: Returns scaffold-level GitLab Workflow MCP server health.
      tags: [System]
      x-annotations:
        readOnlyHint: true
      responses:
        '200':
          description: GitLab Workflow MCP health state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /tool/handbook:
    post:
      operationId: get_mcp_tool_handbook
      summary: Tool Handbook
      description: Returns lazy-loaded usage detail for one GitLab Workflow MCP tool.
      tags: [System]
      x-annotations:
        readOnlyHint: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toolId]
              properties:
                toolId:
                  type: string
                  description: Tool operation id to inspect.
      responses:
        '200':
          description: Tool handbook lookup result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  toolId:
                    type: string
                  found:
                    type: boolean
                  title:
                    type: string
                  description:
                    type: string
                  handbook:
                    type: string
                  source:
                    type: string
                  code:
                    type: string
                  message:
                    type: string
                  inputSchema:
                    type: object
                  outputSchema:
                    type: object

  /issues:
    get:
      operationId: list_issues
      summary: List GitLab issues
      description: Lists GitLab project issues via the GitLab GraphQL API, with optional state / label / assignee filters.
      tags: [Issues]
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: true
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of issues to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - name: state
          in: query
          required: false
          description: Filter issues by state.
          schema:
            type: string
            enum: [opened, closed, all]
            default: opened
        - name: labels
          in: query
          required: false
          description: Comma separated list of labels to filter by.
          schema:
            type: string
        - name: assignee
          in: query
          required: false
          description: Filter issues by a single GitLab username.
          schema:
            type: string
      responses:
        '200':
          description: The matching GitLab project issues.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
    post:
      operationId: create_issue
      summary: Create a GitLab issue
      description: Creates a GitLab issue via the GitLab GraphQL API; optionally assigns labels (by name) and assignees (by username).
      tags: [Issues]
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  description: Issue title.
                body:
                  type: string
                  description: Issue description.
                  default: ''
                labels:
                  type: array
                  items:
                    type: string
                  description: Labels to apply.
                  default: []
                assignees:
                  type: array
                  items:
                    type: string
                  description: GitLab usernames to assign.
                  default: []
      responses:
        '200':
          description: The created issue, or a structured error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateIssueResponse'

  /merge-requests:
    get:
      operationId: list_merge_requests
      summary: List GitLab merge requests
      description: Lists GitLab merge requests for the configured project via the GitLab GraphQL API.
      tags: [Merge Requests]
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: true
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of merge requests to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - name: state
          in: query
          required: false
          description: Filter merge requests by state.
          schema:
            type: string
            enum: [opened, closed, merged, all]
            default: opened
        - name: author
          in: query
          required: false
          description: Filter merge requests by author GitLab username.
          schema:
            type: string
      responses:
        '200':
          description: The matching merge requests, or a structured error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergeRequestListResponse'

  /merge-requests/{merge_request_iid}:
    get:
      operationId: get_merge_request
      summary: Get a GitLab merge request
      description: Reads a single GitLab merge request by iid via the GitLab GraphQL API.
      tags: [Merge Requests]
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: true
      parameters:
        - name: merge_request_iid
          in: path
          required: true
          description: GitLab merge request iid.
          schema:
            type: integer
      responses:
        '200':
          description: The merge request, or a structured error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergeRequestResponse'

  /merge-requests/comments/manage:
    post:
      operationId: manage_mr_comment
      summary: Manage GitLab merge request comments
      description: Creates or updates a GitLab merge request comment (note) via the GitLab GraphQL API.
      tags: [Merge Requests]
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, merge_request_iid, body]
              properties:
                action:
                  type: string
                  enum: [create, update]
                  description: Comment action.
                merge_request_iid:
                  type: integer
                  description: GitLab merge request iid.
                note_id:
                  type: integer
                  description: GitLab note id for updates.
                body:
                  type: string
                  description: Comment body.
      responses:
        '200':
          description: The comment result, or a structured error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergeRequestCommentResponse'

  /merge-requests/{merge_request_iid}/labels/manage:
    post:
      operationId: manage_mr_labels
      summary: Manage GitLab merge request labels
      description: Adds or removes GitLab merge request labels (by name) via the GitLab GraphQL API.
      tags: [Merge Requests]
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: false
      parameters:
        - name: merge_request_iid
          in: path
          required: true
          description: GitLab merge request iid.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, labels]
              properties:
                action:
                  type: string
                  enum: [add, remove]
                  description: Label action.
                labels:
                  type: array
                  items:
                    type: string
                  description: Labels to add or remove.
      responses:
        '200':
          description: The label result, or a structured error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergeRequestLabelResponse'

  /merge-requests/{merge_request_iid}/assignees/manage:
    post:
      operationId: manage_mr_assignees
      summary: Manage GitLab merge request assignees
      description: Adds or removes GitLab merge request assignees (by username) via the GitLab GraphQL API.
      tags: [Merge Requests]
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: false
      parameters:
        - name: merge_request_iid
          in: path
          required: true
          description: GitLab merge request iid.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, assignees]
              properties:
                action:
                  type: string
                  enum: [add, remove]
                  description: Assignee action.
                assignees:
                  type: array
                  items:
                    type: string
                  description: GitLab usernames to add or remove.
      responses:
        '200':
          description: The assignee result, or a structured error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergeRequestAssigneeResponse'

  /merge-requests/{merge_request_iid}/reviewers/manage:
    post:
      operationId: manage_mr_reviewers
      summary: Manage GitLab merge request reviewers
      description: Adds or removes GitLab merge request reviewers (by username) via the GitLab GraphQL API.
      tags: [Merge Requests]
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: false
      parameters:
        - name: merge_request_iid
          in: path
          required: true
          description: GitLab merge request iid.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, reviewers]
              properties:
                action:
                  type: string
                  enum: [add, remove]
                  description: Reviewer action.
                reviewers:
                  type: array
                  items:
                    type: string
                  description: GitLab usernames to add or remove.
      responses:
        '200':
          description: The reviewer result, or a structured error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergeRequestReviewerResponse'

  /local/issues/{issue_number}:
    get:
      operationId: get_local_issue_by_id
      summary: Get a local GitLab issue file
      description: Retrieves a local GitLab issue markdown file by issue number. Scaffolded until syncer subtasks land.
      tags: [Local Files]
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: true
      parameters:
        - name: issue_number
          in: path
          required: true
          description: GitLab issue number.
          schema:
            type: integer
      responses:
        '200':
          description: Scaffolded local issue lookup response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScaffoldResponse'

  /comments/manage:
    post:
      operationId: manage_issue_comment
      summary: Manage GitLab issue comments
      description: Creates or updates a GitLab issue comment (note) via the GitLab GraphQL API.
      tags: [Issues]
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, issue_number, body]
              properties:
                action:
                  type: string
                  enum: [create, update]
                  description: Comment action.
                issue_number:
                  type: integer
                  description: GitLab issue number.
                note_id:
                  type: integer
                  description: GitLab note id for updates.
                body:
                  type: string
                  description: Comment body.
      responses:
        '200':
          description: The comment result, or a structured error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueCommentResponse'

  /issues/{issue_number}/labels/manage:
    post:
      operationId: manage_issue_labels
      summary: Manage GitLab issue labels
      description: Adds or removes GitLab issue labels (by name) via the GitLab GraphQL API.
      tags: [Issues]
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: false
      parameters:
        - name: issue_number
          in: path
          required: true
          description: GitLab issue number.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, labels]
              properties:
                action:
                  type: string
                  enum: [add, remove]
                  description: Label action.
                labels:
                  type: array
                  items:
                    type: string
                  description: Labels to add or remove.
      responses:
        '200':
          description: The label result, or a structured error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueLabelResponse'

  /issues/{issue_number}/assignees/manage:
    post:
      operationId: manage_issue_assignees
      summary: Manage GitLab issue assignees
      description: Adds or removes GitLab issue assignees (by username) via the GitLab GraphQL API.
      tags: [Issues]
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: false
      parameters:
        - name: issue_number
          in: path
          required: true
          description: GitLab issue number.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, assignees]
              properties:
                action:
                  type: string
                  enum: [add, remove]
                  description: Assignee action.
                assignees:
                  type: array
                  items:
                    type: string
                  description: GitLab usernames to add or remove.
      responses:
        '200':
          description: The assignee result, or a structured error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueAssigneeResponse'

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        gitlab:
          type: object
          additionalProperties: true
        details:
          type: array
          items:
            type: string
    ListResponse:
      type: object
      properties:
        status:
          type: string
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        count:
          type: integer
        message:
          type: string
    ScaffoldResponse:
      type: object
      properties:
        status:
          type: string
        tool:
          type: string
        message:
          type: string
        received:
          type: object
          additionalProperties: true
    CreateIssueResponse:
      type: object
      description: A created GitLab issue, or a structured error.
      properties:
        iid:
          type: string
        title:
          type: string
        webUrl:
          type: string
        assignees:
          type: array
          items:
            type: string
        assigneeWarning:
          type: string
        error:
          type: string
        message:
          type: string
        code:
          type: string
    IssueCommentResponse:
      type: object
      description: The result of a GitLab issue comment (note) operation, or a structured error.
      properties:
        message:
          type: string
        noteId:
          type: string
        error:
          type: string
        code:
          type: string
    IssueLabelResponse:
      type: object
      description: The resulting GitLab issue labels, or a structured error.
      properties:
        message:
          type: string
        labels:
          type: array
          items:
            type: string
        error:
          type: string
        code:
          type: string
    IssueAssigneeResponse:
      type: object
      description: The resulting GitLab issue assignees, or a structured error.
      properties:
        message:
          type: string
        assignees:
          type: array
          items:
            type: string
        error:
          type: string
        code:
          type: string
    MergeRequestResponse:
      type: object
      description: A single GitLab merge request, or a structured error.
      properties:
        iid:
          type: string
        title:
          type: string
        state:
          type: string
        webUrl:
          type: string
        sourceBranch:
          type: string
        targetBranch:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        labels:
          type: array
          items:
            type: string
        assignees:
          type: array
          items:
            type: string
        reviewers:
          type: array
          items:
            type: string
        error:
          type: string
        message:
          type: string
        code:
          type: string
    MergeRequestListResponse:
      type: object
      description: A list of GitLab merge requests, or a structured error.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MergeRequestResponse'
        count:
          type: integer
        error:
          type: string
        message:
          type: string
        code:
          type: string
    MergeRequestCommentResponse:
      type: object
      description: The result of a GitLab merge request comment (note) operation, or a structured error.
      properties:
        message:
          type: string
        noteId:
          type: string
        error:
          type: string
        code:
          type: string
    MergeRequestLabelResponse:
      type: object
      description: The resulting GitLab merge request labels, or a structured error.
      properties:
        message:
          type: string
        labels:
          type: array
          items:
            type: string
        error:
          type: string
        code:
          type: string
    MergeRequestAssigneeResponse:
      type: object
      description: The resulting GitLab merge request assignees, or a structured error.
      properties:
        message:
          type: string
        assignees:
          type: array
          items:
            type: string
        error:
          type: string
        code:
          type: string
    MergeRequestReviewerResponse:
      type: object
      description: The resulting GitLab merge request reviewers, or a structured error.
      properties:
        message:
          type: string
        reviewers:
          type: array
          items:
            type: string
        error:
          type: string
        code:
          type: string
