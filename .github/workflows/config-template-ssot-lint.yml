name: Config Template SSOT Lint

on:
  pull_request:
    branches: [dev]
    paths:
      - 'ai/**/config.template.mjs'
      # `ai/**/configBase.mjs`, not `ai/configBase.mjs`: the root was the only base when this filter
      # was written, and the template/base split puts a sibling base beside every server template. A
      # root-only pattern would leave a leaf deleted from a per-server base triggering nothing — the
      # guard present, correct, and never run.
      - 'ai/**/configBase.mjs'
      # The parity snapshot is an input to the check, so editing it must re-run the check. Otherwise a
      # removal can be blessed by updating the record of what exists, with nothing re-reading reality.
      - 'ai/scripts/lint/config-leaf-parity.json'
      - 'ai/scripts/lint/lint-config-template-ssot.mjs'
      - '.github/workflows/config-template-ssot-lint.yml'
  push:
    branches: [dev]
    paths:
      - 'ai/**/config.template.mjs'
      # `ai/**/configBase.mjs`, not `ai/configBase.mjs`: the root was the only base when this filter
      # was written, and the template/base split puts a sibling base beside every server template. A
      # root-only pattern would leave a leaf deleted from a per-server base triggering nothing — the
      # guard present, correct, and never run.
      - 'ai/**/configBase.mjs'
      # The parity snapshot is an input to the check, so editing it must re-run the check. Otherwise a
      # removal can be blessed by updating the record of what exists, with nothing re-reading reality.
      - 'ai/scripts/lint/config-leaf-parity.json'
      - 'ai/scripts/lint/lint-config-template-ssot.mjs'
      - '.github/workflows/config-template-ssot-lint.yml'

concurrency:
  group: config-template-ssot-lint-${{ github.run_attempt == '1' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint config.template.mjs leaves for inline process.env reads
        run: node ai/scripts/lint/lint-config-template-ssot.mjs
