openapi: 3.0.3
info:
  title: Neo.mjs GitHub Workflow MCP Server API
  description: |
    This API provides structured access to the Neo.mjs GitHub repository, enabling the automation of contribution workflows.
    It uses a hybrid approach, leveraging both the GitHub CLI (`gh`) for simple, direct commands (e.g., checking out a PR)
    and the GitHub GraphQL API for complex data fetching and mutations (e.g., listing PRs, creating comments, syncing issues).
    This allows AI agents to programmatically interact with pull requests and issues in a safe and efficient manner.
  version: 1.0.0
  contact:
    name: Neo.mjs Project
    url: https://github.com/neomjs/neo
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8002
    description: Local development server

tags:
  - name: Health
    description: Server health and status endpoints
  - name: Pull Requests
    description: Operations related to GitHub Pull Requests
  - name: Labels
    description: Operations related to repository labels
  - name: Issues
    description: Operations related to repository issues and pull requests
  - name: Repository
    description: Operations related to the repository itself

paths:
  /docs:
    get:
      summary: API Documentation
      description: Serves the interactive Swagger UI for this API
      tags: [Health]
      responses:
        '200':
          description: Swagger UI HTML page
          content:
            text/html:
              schema:
                type: string

  /healthcheck:
    get:
      summary: Check GitHub CLI Health
      operationId: healthcheck
      x-annotations:
        readOnlyHint: true
      description: |
        Verifies that the GitHub CLI (`gh`) is installed, authenticated, and meets the minimum version requirement.

        **When to Use:**
        This should be the first tool you run if you suspect any issues with the GitHub Workflow MCP server. It provides a quick diagnostic check on the server's primary dependency.
      tags: [Health]
      responses:
        '200':
          description: Server is healthy and `gh` is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
        '503':
          description: Server is unhealthy or `gh` CLI is not available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /labels:
    get:
      summary: List Repository Labels
      operationId: list_labels
      x-annotations:
        readOnlyHint: true
      description: |
        Retrieves a list of all available labels in the repository.

        **When to Use:**
        This is a crucial discovery tool. Call it before using `create_issue` or `manage_issue_labels` to ensure you are using valid, existing label names.
      tags: [Labels]
      responses:
        '200':
          description: A list of repository labels.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelListResponse'
        '500':
          description: Internal server error, e.g., `gh` command failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /pull-requests:
    get:
      summary: List Pull Requests
      operationId: list_pull_requests
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: true
      description: |
        Retrieves a list of pull requests from the GitHub repository.

        **When to Use:**
        - To get a high-level overview of pending work (using the default `state: 'open'`).
        - To research historical context by looking at past work (e.g., using `state: 'closed'` or `state: 'merged'`).
        - To find a specific pull request number for use in other tools.
        - When the user asks questions like:
          - "What pull requests are currently open?"
          - "Show me recently merged PRs."

        **Best Practices:**
        - After calling this tool, summarize the list of PRs for the user.
        - Highlight key details such as the PR number, title, author, and state.
        - Avoid showing the raw JSON output to the user unless they explicitly ask for it.

        **Future Enhancements:**
        Note that a future feature will sync PR conversations to local markdown files, providing a more detailed way to review historical PRs. For now, this tool is the primary way to browse PR history.
      tags: [Pull Requests]
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of pull requests to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - name: state
          in: query
          required: false
          description: Filter pull requests by state.
          schema:
            type: string
            enum: [open, closed, merged, all]
            default: open
      responses:
        '200':
          description: A list of open pull requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullRequestListResponse'
        '500':
          description: Internal server error, e.g., `gh` command failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /pull-requests/{pr_number}/checkout:
    post:
      summary: Checkout PR Branch
      operationId: checkout_pull_request
      x-annotations:
        readOnlyHint: false
      description: |
        Checks out the branch for a given pull request locally using `gh pr checkout`.
        This modifies the local filesystem to reflect the state of the pull request branch.

        **When to Use:**
        Use this tool when you need to locally inspect the code changes of a pull request, run tests, or perform a more detailed review.

        **Workflow:**
        1. **Ensure your current work is committed or stashed.** Before switching branches, make sure you save your current work to prevent losing changes (e.g., using `git stash`).
        2. **Check out the pull request branch** using this tool.
        3. **Review and test the code locally.**
        4. **Return to your previous branch** when you are done (e.g., using `git checkout -`).

        **Safety Note:** Always commit or stash your changes before checking out a new branch to avoid losing work.
      tags: [Pull Requests]
      parameters:
        - name: pr_number
          in: path
          required: true
          description: The number of the pull request to check out.
          schema:
            type: integer
            example: 123
      responses:
        '200':
          description: Pull request branch checked out successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Pull request not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error, e.g., `gh` command failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /pull-requests/{pr_number}/diff:
    get:
      summary: Get PR Diff
      operationId: get_pull_request_diff
      x-annotations:
        readOnlyHint: true
      description: |
        Retrieves the diff for a specific pull request using `gh pr diff`.
        This provides a quick, read-only overview of the changes without checking out the branch.

        **When to Use:**
        Use this tool for a quick review of the changes in a pull request. For a more in-depth review, use `checkout_pull_request`.
      tags: [Pull Requests]
      parameters:
        - name: pr_number
          in: path
          required: true
          description: The number of the pull request.
          schema:
            type: integer
            example: 123
        - name: file
          in: query
          required: false
          description: |
            Optional. Comma-separated list of file paths to filter the diff.
            When provided alone, filters the PR diff to only include chunks for these paths.
          schema:
            type: string
            example: "src/main.js,src/utils.js"
        - name: sha
          in: query
          required: false
          description: |
            Optional. When provided alongside `file`, the diff is computed against the named commit, not the live PR head.
            Defends against working-tree race conditions in concurrent-PR scenarios. Requires `file`.
          schema:
            type: string
        - name: files_only
          in: query
          required: false
          description: |
            Optional. If true, returns a structured JSON payload of affected files (`path`, `additions`, `deletions`) instead of a plaintext diff.
          schema:
            type: boolean
      responses:
        '200':
          description: The diff of the pull request or structured file list.
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        additions:
                          type: integer
                        deletions:
                          type: integer
        '400':
          description: Invalid arguments (e.g., missing file when sha is provided, or invalid sha format).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Pull request or SHA not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error, e.g., `gh` command failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /pull-requests/{pr_number}/conversation:
    get:
      summary: Get Conversation (Issue or PR)
      operationId: get_conversation
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: true
      description: |
        Retrieves the conversation (title, body, comments) for a pull request OR an issue.
        Supply exactly one of `pr_number` or `issue_number`.

        **When to Use:**
        Use this tool to get the context of a pull request or issue — the initial proposal/body and the discussion history.

        **Comment selectors (optional, first-match precedence):**
        - `comment_id`: fetch ONLY the comment whose GitHub node ID matches. Used for A2A
          hand-off — a reviewer mailboxes the `commentId` (returned by `manage_issue_comment`
          action:`create`) to the peer, and the peer fetches just-this-comment rather than
          re-walking the whole thread. Scales linearly with new-comment volume.
        - `since_comment_id`: fetch comments AFTER the one with the given ID (exclusive).
          Incremental review cycles: track last-seen commentId, fetch only what's new.
        - `last_n`: fetch the last N comments. Coarse-grained catch-up when IDs aren't tracked.

        Omitting all selectors returns the full conversation (backward-compatible default).
      tags: [Pull Requests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pr_number:
                  type: integer
                  description: The pull request number. Supply either `pr_number` or `issue_number`, not both.
                  example: 10272
                issue_number:
                  type: integer
                  description: The issue number. Supply either `pr_number` or `issue_number`, not both.
                  example: 10702
                comment_id:
                  type: string
                  description: Return only the comment whose GitHub global node ID matches. Elides all other comments; PR title/body are still returned.
                  example: "IC_kwDOABcD1234567890"
                since_comment_id:
                  type: string
                  description: Return only comments AFTER the one with this ID (exclusive). If the ID isn't found, returns empty comments.
                  example: "IC_kwDOABcD1234567890"
                last_n:
                  type: integer
                  description: Return only the last N comments (by creation order).
                  example: 3
      responses:
        '200':
          description: Conversation data for the pull request, optionally filtered by selector.
          content:
            application/json:
              schema:
                type: object
                description: Conversation shape (issue or pull request) — title/body/author plus a (possibly filtered) comments collection.
                properties:
                  title:
                    type: string
                  body:
                    type: string
                  author:
                    type: object
                    properties:
                      login:
                        type: string
                  comments:
                    type: object
                    properties:
                      nodes:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: The GitHub global node ID of the comment.
                            author:
                              type: object
                              properties:
                                login:
                                  type: string
                            body:
                              type: string
                            createdAt:
                              type: string
                              format: date-time
        '400':
          description: Bad Request (neither or both of `pr_number` / `issue_number` supplied).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error, e.g., `gh` command failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /comments/manage:
    post:
      summary: Manage Comments (Create or Update)
      operationId: manage_issue_comment
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: false
      description: |
        Unified tool for creating and updating comments on issues and pull requests.
        Supports both adding new comments and modifying existing ones.

        **Action: 'create'**
        - Creates a new comment on an issue or PR.
        - Requires `agent`, `body`, and either `issue_number` or `pr_number`.
        - Automatically formats the comment with the agent's identity.
        - **When to use:** To provide feedback, approve PRs (with "LGTM"), or ask questions.

        **Action: 'update'**
        - Updates an existing comment.
        - Requires `comment_id` and `body`.
        - **When to use:** To correct mistakes or update status in a previously posted comment.
        - **Note:** You can only update comments created by the authenticated user.
      tags: [Issues, Pull Requests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
                - body
              properties:
                action:
                  type: string
                  enum: [create, update]
                  description: The action to perform.
                  example: create
                issue_number:
                  type: integer
                  description: The number of the issue (required for 'create' if not a PR).
                  example: 456
                pr_number:
                  type: integer
                  description: The number of the pull request (required for 'create' if not an issue).
                  example: 123
                comment_id:
                  type: string
                  description: The global node ID of the comment (required for 'update').
                  example: "IC_kwDOABcD1234567890"
                body:
                  type: string
                  description: The content of the comment.
                agent:
                  type: string
                  description: The agent identity in the format '[Model Name] ([Agent Wrapper])' (required for 'create').
                  example: "Gemini 3.1 Pro (Antigravity)"
      responses:
        '200':
          description: |
            Comment created or updated successfully. Returns the canonical comment identifier
            (`commentId`), its GitHub URL, and the relevant timestamp (`createdAt` on create,
            `updatedAt` on update) so the caller can surface the canonical reference for A2A
            propagation patterns — see `.agents/skills/pr-review/references/pr-review-guide.md §9`
            and `.agents/skills/pull-request/references/pull-request-workflow.md §8` for the
            comment-ID hand-off convention that pairs with `get_conversation({comment_id: …})`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'
        '400':
          description: Bad Request (missing arguments or invalid action).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /issues/{issue_number}/labels/manage:
    post:
      summary: Manage Issue Labels (Add or Remove)
      operationId: manage_issue_labels
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: false
      description: |
        Unified tool for adding or removing labels from an issue or pull request.

        **Action: 'add'**
        - Adds one or more labels.
        - **Important:** Use exact label names. Check with `list_labels` first.

        **Action: 'remove'**
        - Removes one or more labels.
        - **Important:** Use exact label names.
      tags: [Issues]
      parameters:
        - name: issue_number
          in: path
          required: true
          description: The number of the issue or pull request.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
                - labels
              properties:
                action:
                  type: string
                  enum: [add, remove]
                  description: The action to perform.
                  example: add
                labels:
                  type: array
                  items:
                    type: string
                  description: An array of label names.
                  example: ["bug", "priority"]
      responses:
        '200':
          description: Labels updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request (invalid action).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Issue or label not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /issues/{issue_number}/assignees/manage:
    post:
      summary: Manage Issue Assignees (Single Guarded MCP Operation — Add or Remove)
      operationId: manage_issue_assignees
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: false
      description: |
        Unified tool for assigning or unassigning users from a GitHub issue.
        Performs a single guarded operation with precondition checking.

        **Action: 'add' — gated**
        - Default `requireUnassigned: true` rejects adding to already occupied issues with
          `ASSIGNEE_CONFLICT` (HTTP 409).
        - To override an occupied issue, pass `acknowledgedReassign: '<reason>'` for strict replacement.
          This clears existing assignees, assigns the new set, and posts an audit-trail comment with the reason.
        - `requireUnassigned: false` allows legacy blind-add.

        **Action: 'remove' — ungated**
        - Unassigns one or more users (the named set).

        **Empty assignees array (`action: 'add'`, `assignees: []`) — clear mode**
        - Clears all current assignees safely.

        **Special Values:**
        - `@me`: Resolves to the authenticated GitHub user.

        **Permission Check:**
        Requires `ADMIN`, `MAINTAIN`, or `WRITE` permissions. Returns 403 otherwise.
      tags: [Issues]
      parameters:
        - name: issue_number
          in: path
          required: true
          description: The number of the issue.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
                - assignees
              properties:
                action:
                  type: string
                  enum: [add, remove]
                  description: The action to perform.
                  example: add
                assignees:
                  type: array
                  items:
                    type: string
                  description: An array of GitHub user logins. Use `@me` to assign/unassign the authenticated user.
                  example: ["@me"]
                requireUnassigned:
                  type: boolean
                  default: true
                  description: |
                    Precondition gate for `action: 'add'`. When `true` (default), the tool fetches
                    current assignees and rejects with `ASSIGNEE_CONFLICT` (HTTP 409) if non-empty,
                    unless `acknowledgedReassign` is provided. Set to `false` to bypass the gate
                    (legacy blind-add path; new callers should not rely on this).
                  example: true
                acknowledgedReassign:
                  type: string
                  description: |
                    Reason-bearing override for strict-replacement reassignment. When provided
                    alongside `action: 'add'` on an occupied issue, the tool clears existing
                    assignees, assigns the new set, and posts an audit-trail comment on the
                    issue capturing this reason. Required when overriding an existing assignment.
                  example: "context-exhaustion handoff from peer who session-sunsetted"
      responses:
        '200':
          description: Assignees updated successfully. Response includes `verifiedAssignees` (post-verify state) and, for override paths, `acknowledgedReassign` + `previousAssignees`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '403':
          description: Forbidden (insufficient permissions).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Issue not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            `ASSIGNEE_CONFLICT` — precondition gate rejected blind-add on an occupied issue.
            Response includes `currentAssignees` (existing) + `attemptedAssignees` (requested)
            for caller introspection. To proceed, retry with `acknowledgedReassign: '<reason>'`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /pulls/{pr_number}/review/manage:
    post:
      summary: Manage PR Review (Create or Update — atomic body + formal-state in one call)
      operationId: manage_pr_review
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: false
      description: |
        Atomic create/update of a formal PR review. `create` posts body + flips reviewDecision and requires `pr_number`, `state` (APPROVED/REQUEST_CHANGES/COMMENT), and `body`; `update` requires `review_id` (PRR_*) + `body` and cannot change state. Returns reviewId, state, url, and submittedAt.

        Mandatory pre-step: read `.agents/skills/pr-review/SKILL.md` and use the cycle-appropriate template.

        Validation: `body` must include the 7 visible metric anchors plus silent structural template anchors; failures return `PR_REVIEW_TEMPLATE_VALIDATION_FAILED` pointing at the skill/template. Do not synthesize substitute headings. #12448 premise-snapshot fields (`Inputs Read Before Patch`, `Expected Solution Shape`, `Patch Verdict`) are optional during migration: omit all three or include all three together.
      tags: [PullRequests]
      parameters:
        - name: pr_number
          in: path
          required: true
          description: The number of the pull request (path placeholder; the request body's `pr_number` is the authoritative input for `create`).
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
                - body
              properties:
                action:
                  type: string
                  enum: [create, update]
                  description: The action to perform.
                  example: create
                pr_number:
                  type: integer
                  description: The pull request number (required for `create`).
                  example: 11273
                state:
                  type: string
                  enum: [APPROVED, REQUEST_CHANGES, COMMENT]
                  description: Review state (required for `create`).
                  example: APPROVED
                body:
                  type: string
                  description: The review body.
                review_id:
                  type: string
                  description: The GraphQL node ID of the existing review (required for `update`, e.g. `PRR_*`).
                  example: "PRR_kwDOABcDef1234567890"
      responses:
        '200':
          description: |
            Review created or updated successfully. Returns `reviewId` (PRR_* node ID), `state`, `url`, `submittedAt`, plus `databaseId` on create.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  reviewId:
                    type: string
                  state:
                    type: string
                  url:
                    type: string
                  submittedAt:
                    type: string
                  databaseId:
                    type: integer
        '400':
          description: Bad Request (invalid action / missing arguments / invalid state).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Pull request not found (create) or review id invalid (update).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: GraphQL API request failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /pulls/{pr_number}/reviewers/manage:
    post:
      summary: Manage PR Reviewers (Add or Remove)
      operationId: manage_pr_reviewers
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: false
      description: |
        Unified add/remove of GitHub PR reviewer-requests via the `gh pr edit` CLI. Pairs with the cross-family review mandate (`pull-request §6.1`) as the **invitation layer** — the mandate is the validation layer (Approved-status before merge); this tool surfaces the active invitation primitive that pairs with it.

        **Action: 'add'** — requests review from the listed users/teams.
        **Action: 'remove'** — withdraws review requests.

        At least one of `reviewers` or `team_reviewers` is required. Permission errors are surfaced via the underlying `gh` CLI's exit code.
      tags: [PullRequests]
      parameters:
        - name: pr_number
          in: path
          required: true
          description: The number of the pull request.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum: [add, remove]
                  description: The action to perform.
                  example: add
                reviewers:
                  type: array
                  items:
                    type: string
                  description: An array of GitHub user logins to add or remove as reviewers.
                  example: ["neo-gemini-3-1-pro"]
                team_reviewers:
                  type: array
                  items:
                    type: string
                  description: An array of team slugs (without owner prefix; the owner is auto-prepended).
                  example: ["maintainers"]
      responses:
        '200':
          description: Reviewer-requests updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid arguments (bad action OR missing both reviewers and team_reviewers).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: GitHub CLI command failed (typically permission or network).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  /issues/{issue_number}/content:
    get:
      summary: Get Local Issue Content by ID
      operationId: get_local_issue_by_id
      x-annotations:
        readOnlyHint: true
      description: |
        Retrieves the full markdown content of a local issue file by its number, searching both active and archived issues.

        **When to Use:**
        Use this tool for a fast, offline-capable way to read the content of an issue that is already present on the local disk. This tool reads directly from the file system and does **not** access the GitHub API.

        **Important:** The content returned reflects the state of the issue at the time of the last `sync_all` operation and may not be the most up-to-date version if remote changes have occurred since.
      tags: [Issues]
      parameters:
        - name: issue_number
          in: path
          required: true
          description: The number of the issue (e.g., "7608" or "#7608").
          schema:
            type: string
      responses:
        '200':
          description: The content and path of the issue file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalIssueResponse'
        '404':
          description: Issue file not found locally.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /issues:
    get:
      summary: List Issues
      operationId: list_issues
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: true
      description: |
        Retrieves a list of issues from the repository. Supports basic filters such as `limit`, `state`, `labels`, and `assignee`.

        **When to Use:**
        - To find open work items or review recent closed issues.
        - To look up issue numbers for use in other tools.
      tags: [Issues]
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of issues to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - name: state
          in: query
          required: false
          description: Filter issues by state.
          schema:
            type: string
            enum: [open, closed, all]
            default: open
        - name: labels
          in: query
          required: false
          description: Comma separated list of labels to filter by (all labels must be present on the issue).
          schema:
            type: string
        - name: assignee
          in: query
          required: false
          description: Filter issues by a single assignee login.
          schema:
            type: string
      responses:
        '200':
          description: A list of issues.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueListResponse'
        '500':
          description: Internal server error, e.g., GraphQL failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Create a new GitHub issue
      operationId: create_issue
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: false
      description: |
        Creates a new GitHub issue. **MANDATORY** pre-step: read `.agents/skills/ticket-create/SKILL.md` — the skill contains the full creation protocol (duplicate sweep, Fat Ticket body, label rules, post-creation chaining).

        **ProjectV2 membership:** Use the `projects` parameter to atomically attach the new issue to one or more org-level ProjectV2 boards. This is the substrate-correct primitive — labels and projects are independent first-class GitHub primitives, and `release:v*` label-as-project-proxy is a deprecated anti-pattern (#11233).
      tags: [Issues]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  description: The title of the issue.
                body:
                  type: string
                  description: The Markdown body of the issue.
                  default: ""
                labels:
                  type: array
                  items:
                    type: string
                  description: (Optional) An array of labels to add to the issue.
                  default: []
                assignees:
                  type: array
                  items:
                    type: string
                  description: (Optional) An array of GitHub user logins to assign to the issue. Use `@me` to assign the authenticated user. Requires write permissions.
                  example: ["@me"]
                  default: []
                projects:
                  type: array
                  items:
                    type: object
                    required:
                      - projectNumber
                    properties:
                      projectNumber:
                        type: integer
                        description: The org-level ProjectV2 number (e.g., `12` for "v13 Release").
                  description: |
                    (Optional) Array of ProjectV2 memberships to add atomically after issue creation.
                    Each entry specifies a project number; the issue is added via the `addProjectV2ItemById` GraphQL mutation.
                    Replaces the deprecated `release:v*` label-as-proxy pattern.
                  default: []
      responses:
        '201':
          description: Issue created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateIssueResponse'
        '500':
          description: Internal server error, e.g., `gh` command failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /issues/{issue_number}/projects/manage:
    post:
      summary: Manage Issue ProjectV2 Memberships (Add, Remove, or Update Field)
      operationId: manage_issue_projects
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: false
      description: |
        Unified tool for managing an issue's ProjectV2 memberships. Mirror-shape of `manage_issue_labels` for the project-membership substrate.

        **Action: 'add'**
        - Adds the issue to one or more ProjectV2 boards via `addProjectV2ItemById`.
        - Requires `projectNumbers` (array of org-level project numbers).

        **Action: 'remove'**
        - Removes the issue from one or more ProjectV2 boards via `deleteProjectV2Item`.
        - Requires `projectNumbers`.

        **Action: 'update_field'**
        - Updates a single-select field value (e.g., 'Status', 'Priority') on the issue's project item.
        - Requires `projectNumber`, `fieldName`, and `value`.

        **Migration substrate:** This tool is the substrate-correct replacement for the `release:v13` label-as-project-membership-proxy pattern (#11233). Labels are categorization primitives; projects are first-class membership primitives — these are independent GitHub concepts and cannot be reduced to one another without structural drift.
      tags: [Issues]
      parameters:
        - name: issue_number
          in: path
          required: true
          description: The number of the issue or pull request.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum: [add, remove, update_field]
                  description: The action to perform.
                  example: add
                projectNumbers:
                  type: array
                  items:
                    type: integer
                  description: An array of org-level ProjectV2 numbers (required for 'add' and 'remove').
                  example: [12]
                projectNumber:
                  type: integer
                  description: A single org-level ProjectV2 number (required for 'update_field').
                  example: 12
                fieldName:
                  type: string
                  description: The name of the single-select field to update (required for 'update_field').
                  example: "Status"
                value:
                  type: string
                  description: The option name for the single-select field (required for 'update_field').
                  example: "In Progress"
      responses:
        '200':
          description: Project membership(s) updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request (invalid action or missing required parameters).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Issue or project not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /discussions:
    post:
      summary: Create a new GitHub Discussion
      operationId: create_discussion
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: false
      description: |
        Creates a new discussion on GitHub. This is used for the Ideation Sandbox, keeping brainstorming separate from issues.

        **MANDATORY WORKFLOW:**
        - Always provide a clear title and body.
        - Categories are mapped internally; default is 'Ideas'. If another categorical structure is needed, specify it.
      tags: [Issues]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - body
              properties:
                title:
                  type: string
                  description: The title of the discussion.
                body:
                  type: string
                  description: The Markdown body of the discussion.
                category:
                  type: string
                  description: The name of the category (e.g., 'Ideas', 'Q&A'). Defaults to 'Ideas'.
                  default: "Ideas"
      responses:
        '201':
          description: Discussion created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateIssueResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /discussions/manage:
    post:
      summary: Manage GitHub Discussions (Update Body)
      operationId: manage_discussion
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: false
      description: |
        Manages discussion-level operations on GitHub discussions.

        **Action: 'update_body'**
        - Replaces the body of an existing discussion in place (e.g. post-publication corrections to an Ideation Sandbox entry, keeping the body as the single source of truth instead of accumulating correction comments).
        - Requires `discussion_number` and `body`.
      tags: [Issues]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
                - discussion_number
                - body
              properties:
                action:
                  type: string
                  enum: [update_body]
                  description: The action to perform.
                  example: update_body
                discussion_number:
                  type: integer
                  description: The number of the discussion to update.
                  example: 10137
                body:
                  type: string
                  description: The new Markdown body for the discussion.
      responses:
        '200':
          description: Discussion body updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  discussionId:
                    type: string
                    description: The canonical GitHub global node ID of the discussion.
                    example: "D_kwDODSospM4AmbhL"
                  url:
                    type: string
                    description: The canonical HTTP URL of the discussion on github.com.
                    example: "https://github.com/orgs/neomjs/discussions/10137"
                  updatedAt:
                    type: string
                    format: date-time
                    description: The last-modified timestamp (ISO-8601).
                    example: "2026-05-16T02:49:38Z"
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /discussions/comments/manage:
    post:
      summary: Manage Discussion Comments (Create or Update)
      operationId: manage_discussion_comment
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: false
      description: |
        Unified tool for creating and updating comments on GitHub discussions.

        **Action: 'create'**
        - Creates a new comment on a discussion.
        - Requires `agent`, `body`, and `discussion_number`.

        **Action: 'update'**
        - Updates an existing discussion comment.
        - Requires `comment_id` and `body`.
      tags: [Issues]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
                - body
              properties:
                action:
                  type: string
                  enum: [create, update]
                  description: The action to perform.
                  example: create
                discussion_number:
                  type: integer
                  description: The number of the discussion (required for 'create').
                  example: 456
                comment_id:
                  type: string
                  description: The global node ID of the comment (required for 'update').
                  example: "DC_kwDOABcD1234567890"
                body:
                  type: string
                  description: The content of the comment.
                agent:
                  type: string
                  description: The agent identity in the format '[Model Name] ([Agent Wrapper])' (required for 'create').
                  example: "Gemini 3.1 Pro (Antigravity)"
      responses:
        '200':
          description: Comment created or updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /issues/relationship:
    post:
      summary: Manage Issue Relationships (Parent-Child and Blocked-By)
      operationId: update_issue_relationship
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: false
      description: |
        Manages relationships between GitHub issues including parent-child hierarchies and blocked-by dependencies.
        This tool allows you to set or unset relationships between issues on GitHub.

        **Relationship Types:**
        - **parent_child**: Creates hierarchical relationships (epics with sub-tasks)
        - **blocked_by**: Creates dependency relationships (issue A is blocked by issue B)

        **When to Use:**
        - To organize work by creating issue hierarchies (epics with sub-tasks)
        - To track dependencies where one issue blocks another
        - To unlink issues from their relationships
        - To move a child issue from one parent to another

        **Important Notes:**
        - Changes are made directly on GitHub via the GraphQL API
        - The local markdown files will be updated on the next `sync_all` operation
        - For parent_child: An issue can only have ONE parent at a time
        - For blocked_by: An issue can be blocked by MULTIPLE issues
        - Use `replace_parent=true` to replace an existing parent relationship (parent_child only)
        - To remove relationships, call with only `child_issue` specified (omit `parent_issue`)

        **Workflow:**
        1. Identify the issue numbers and relationship type
        2. Call this tool to establish or modify the relationship
        3. Run `sync_all` to update local markdown files with the new relationship
      tags: [Issues]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - child_issue
              properties:
                relationship_type:
                  type: string
                  enum: [parent_child, blocked_by]
                  description: |
                    The type of relationship to manage:
                    - parent_child: Hierarchical parent-child relationships
                    - blocked_by: Dependency blocking relationships
                  default: parent_child
                  example: parent_child
                child_issue:
                  type: integer
                  description: |
                    The issue number of the child/blocked issue.
                    For parent_child: This is the sub-issue.
                    For blocked_by: This is the issue being blocked.
                  example: 7388
                parent_issue:
                  type: integer
                  description: |
                    The issue number of the parent/blocking issue.
                    For parent_child: This is the parent issue.
                    For blocked_by: This is the issue doing the blocking.
                    Omit this field (or set to null) to remove the relationship.
                  example: 7385
                replace_parent:
                  type: boolean
                  description: |
                    Only applicable for parent_child relationships.
                    If true, replaces the child's existing parent relationship.
                    If false and the child already has a parent, the operation will fail.
                  default: false
      responses:
        '200':
          description: Relationship updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateIssueRelationshipResponse'
        '500':
          description: Internal server error, e.g., GraphQL API failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sync-all:
    post:
      summary: Sync GitHub Issues & Releases
      operationId: sync_all
      x-annotations:
        readOnlyHint: false
      description: |
        Bi-directional sync of GitHub issues/releases with local markdown files in `resources/content/`.

        **Precondition: working tree MUST be on `dev`.** Mechanically enforced — calls from non-dev branches are rejected pre-flight with no remote calls and no local writes.

        **Use sparingly:**
        - DO: pull remote ticket updates or push manual edits to local `.md` files.
        - DON'T: after `create_issue` or `create_comment` (already in context).
        - DON'T: for code changes (syncs only ticket metadata).

        **How it works:** pulls remote data, creates `.md` files for new issues, pushes modified `.md` files to GitHub. Cached for fast no-ops.

        **Rejection:** throws `sync_all REJECTED: working-tree is on branch '<name>', not 'dev'.` with remediation guidance pointing to switch-to-dev or daemon-driven sync.
      tags: [Issues]
      responses:
        '200':
          description: Synchronization process completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncIssuesResponse'
        '500':
          description: Internal server error during the sync process.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /repository/viewer-permission:
    get:
      summary: Get Viewer Permission
      operationId: get_viewer_permission
      x-annotations:
        readOnlyHint: true
      description: |
        Retrieves the permission level of the currently authenticated user (viewer) for the repository.

        **When to Use:**
        Call this tool to determine your capabilities before attempting a restricted action (e.g., assigning an issue, merging a PR). The agent is responsible for interpreting the returned permission level.

        **Permission Levels:**
        - `ADMIN`: Can read, write, and manage the repository.
        - `MAINTAIN`: Can read, write, and manage issues and pull requests.
        - `WRITE`: Can read and write to the repository.
        - `TRIAGE`: Can manage issues and pull requests.
        - `READ`: Can read the repository.
      tags: [Repository]
      responses:
        '200':
          description: The viewer's permission level for the repository.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewerPermissionResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /system/state/transition:
    post:
      summary: Signal State Transition
      operationId: signal_state_transition
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: false
      description: |
        Provides a native state-trap for Headless Orchestration to gracefully capture execution states or signal logic failures.

        Support `state: 'PR_OPENED'` to trigger autonomous turn-completion and shutdown sequences.
        Support `state: 'BLOCKED'` and `state: 'HANDOFF'` for derailed agents, enabling them to pass a localized artifact mapping the problem back to the Orchestrator, which natively applies the `agent-task:blocked` label on GitHub.
      tags: [Issues]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - state
              properties:
                state:
                  type: string
                  enum: [PR_OPENED, BLOCKED, HANDOFF]
                  description: The execution state to signal.
                target_id:
                  type: integer
                  description: The target Issue or PR number associated with this state.
                artifact_path:
                  type: string
                  description: Optional file path to a localized artifact mapping the problem.
      responses:
        '200':
          description: State transition signal received and processed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalStateTransitionResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    HealthCheckResponse:
      type: object
      properties:
        status:
          type: string
          example: "healthy"
        timestamp:
          type: string
          format: date-time
          description: The ISO 8601 timestamp of when the health check was performed.
        version:
          type: string
          description: The version of the MCP server.
          example: "1.0.0"
        githubCli:
          type: object
          properties:
            installed:
              type: boolean
              example: true
            authenticated:
              type: boolean
              example: true
            versionOk:
              type: boolean
              example: true
            version:
              type: string
              example: "2.81.0"
            details:
              type: array
              items:
                type: string
        notificationPreview:
          type: object
          description: A passive inbox preview of unread GitHub notifications. Present only if authenticated.
          properties:
            unreadCount:
              type: integer
              description: Total number of unread notifications.
              example: 3
            latest:
              type: array
              description: The 5 most recent unread notifications.
              items:
                type: object
                properties:
                  id:
                    type: string
                  reason:
                    type: string
                  type:
                    type: string
                  title:
                    type: string
                  url:
                    type: string

    Label:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        color:
          type: string

    LabelListResponse:
      type: object
      properties:
        count:
          type: integer
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'

    PullRequest:
      type: object
      properties:
        number:
          type: integer
          example: 123
        title:
          type: string
          example: "feat: Add new component"
        author:
          type: object
          properties:
            login:
              type: string
              example: "some-contributor"
        url:
          type: string
          format: uri
          example: "https://github.com/neomjs/neo/pull/123"
        state:
          type: string
          enum: [OPEN, CLOSED, MERGED]
          example: "OPEN"
        createdAt:
          type: string
          format: date-time
          example: "2025-10-08T12:00:00.000Z"

    PullRequestListResponse:
      type: object
      properties:
        count:
          type: integer
          description: Number of pull requests returned
          example: 5
        pullRequests:
          type: array
          items:
            $ref: '#/components/schemas/PullRequest'

    PullRequestConversation:
      type: object
      properties:
        title:
          type: string
        body:
          type: string
        author:
          type: object
          properties:
            login:
              type: string
              description: The GitHub username of the PR author.
        comments:
          type: array
          items:
            type: object
            properties:
              author:
                type: object
                properties:
                  login:
                    type: string
                    description: The GitHub username of the comment author.
              body:
                type: string
              createdAt:
                type: string
                format: date-time

    SuccessResponse:
      type: object
      properties:
        message:
          type: string
          example: "Operation completed successfully"
        details:
          type: string
          description: Optional details from the CLI output.
          example: "Checked out branch 'some-contributor/my-feature-branch'"

    CommentResponse:
      type: object
      description: |
        Enriched response for comment create/update operations. Surfaces the canonical
        `commentId` (GitHub global node ID) so callers can reference the comment in
        downstream A2A propagation patterns. `createdAt` is populated on create;
        `updatedAt` on update. Superset of `SuccessResponse` — existing consumers that
        only read `message` continue to work unchanged.
      properties:
        message:
          type: string
          description: Human-readable confirmation of the operation.
          example: "Successfully created comment on PR #10272"
        commentId:
          type: string
          description: "The canonical GitHub global node ID of the comment. Use with `get_conversation({comment_id: ...})` or in A2A payloads to reference just-this-comment."
          example: "IC_kwDOABcD1234567890"
        url:
          type: string
          description: The canonical HTTP URL of the comment on github.com.
          example: "https://github.com/neomjs/neo/pull/10272#issuecomment-4309098042"
        createdAt:
          type: string
          format: date-time
          description: The creation timestamp (ISO-8601). Populated by 'create' action only.
          example: "2026-04-24T01:48:14Z"
        updatedAt:
          type: string
          format: date-time
          description: The last-modified timestamp (ISO-8601). Populated by 'update' action only.
          example: "2026-04-24T02:15:33Z"

    SyncIssuesResponse:
      type: object
      required:
        - success
        - summary
        - statistics
        - timing
      properties:
        success:
          type: boolean
          example: true
          description: Whether the sync operation completed successfully
        summary:
          type: string
          example: "Synchronization complete"
          description: Human-readable summary of the sync operation
        statistics:
          type: object
          required:
            - pushed
            - pulled
            - dropped
            - reconciled
            - releases
          properties:
            pushed:
              type: object
              properties:
                count:
                  type: integer
                  example: 2
                  description: Number of local changes pushed to GitHub
                issues:
                  type: array
                  items:
                    type: integer
                  example: [1234, 1235]
                  description: Issue numbers that were pushed
                failures:
                  type: array
                  items:
                    type: integer
                  example: [1236]
                  description: Issue numbers that failed to push
            pulled:
              type: object
              properties:
                count:
                  type: integer
                  example: 15
                  description: Total number of issues pulled from GitHub
                created:
                  type: integer
                  example: 3
                  description: Number of new issues created locally
                updated:
                  type: integer
                  example: 12
                  description: Number of existing issues updated locally
                moved:
                  type: integer
                  example: 2
                  description: Number of issues moved between directories
                issues:
                  type: array
                  items:
                    type: integer
                  example: [1230, 1231, 1232]
                  description: Issue numbers that were pulled
            dropped:
              type: object
              properties:
                count:
                  type: integer
                  example: 1
                  description: Number of dropped issues removed locally
                issues:
                  type: array
                  items:
                    type: integer
                  example: [999]
                  description: Issue numbers that were dropped
            reconciled:
              type: object
              properties:
                count:
                  type: integer
                  example: 5
                  description: Number of closed issues moved to archives during reconciliation
                issues:
                  type: array
                  items:
                    type: integer
                  example: [1200, 1201, 1202, 1203, 1204]
                  description: Issue numbers that were reconciled and archived
            releases:
              type: object
              properties:
                count:
                  type: integer
                  example: 5
                  description: Number of release notes synced
                synced:
                  type: array
                  items:
                    type: string
                  example: ['v11.0', 'v10.9', 'v10.8']
                  description: Release version tags that were synced
        timing:
          type: object
          required:
            - startTime
            - endTime
            - durationMs
          properties:
            startTime:
              type: string
              format: date-time
              example: "2025-10-21T10:00:00.000Z"
              description: ISO timestamp when sync started
            endTime:
              type: string
              format: date-time
              example: "2025-10-21T10:02:30.000Z"
              description: ISO timestamp when sync completed
            durationMs:
              type: integer
              example: 150000
              description: Total sync duration in milliseconds

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "GitHub CLI command failed"
        message:
          type: string
          example: "gh pr checkout 123 failed with exit code 1"
        code:
          type: string
          example: "GH_CLI_ERROR"

    CreateIssueResponse:
      type: object
      properties:
        issueNumber:
          type: integer
          description: The number of the newly created issue.
        url:
          type: string
          format: uri
          description: The URL of the newly created issue.

    SignalStateTransitionResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Indicates whether the state transition was recorded successfully.
          example: true
        message:
          type: string
          description: A human-readable message describing the outcome.
          example: "State PR_OPENED processed. Orchestrator turn completed."

    UpdateIssueRelationshipResponse:
      type: object
      properties:
        message:
          type: string
          description: A human-readable message describing the result of the operation.
          example: "Successfully set #7385 as parent of #7388"
        childIssue:
          type: integer
          description: The issue number of the child issue.
          example: 7388
        parentIssue:
          type: integer
          nullable: true
          description: The issue number of the parent issue, or null if the parent was removed.
          example: 7385
        oldParent:
          type: integer
          description: The previous parent issue number, if one was replaced or removed.
          example: 7380
        replaceParentApplied:
          type: boolean
          description: Indicates whether the replace_parent flag was used.
          example: false

    LocalIssueResponse:
      type: object
      properties:
        filePath:
          type: string
          description: The absolute path to the found issue file.
          example: /path/to/project/.github/ISSUE/issue-7608.md
        content:
          type: string
          description: The full markdown content of the issue file.

    ViewerPermissionResponse:
      type: object
      properties:
        permission:
          type: string
          description: The permission level of the viewer.
          enum: [ADMIN, MAINTAIN, WRITE, TRIAGE, READ]
          example: WRITE

    Issue:
      type: object
      properties:
        number:
          type: integer
          example: 7608
        title:
          type: string
        body:
          type: string
        state:
          type: string
          example: OPEN
        author:
          type: object
          properties:
            login:
              type: string
        url:
          type: string
          format: uri
        labels:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
        assignees:
          type: array
          items:
            type: object
            properties:
              login:
                type: string
        createdAt:
          type: string
          format: date-time

    IssueListResponse:
      type: object
      properties:
        count:
          type: integer
        issues:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
