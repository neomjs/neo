name: Secrets Lint

# Scans pushes to `dev`. A pull request is scanned by the shared baseline's `Secrets` job (`pr-baseline.yml`), but a
# push is not, and the data-sync pipeline commits to `dev` without a pull request: synced issue and pull-request bodies
# would reach `resources/content/**` unscanned. A pull request that edits this workflow runs it too, so a broken scan is
# not first seen on `dev`.
#
# The guard is the published `neo-agent-skills-secrets`, installed at the version `package.json` pins, so this
# repository names that version once, and into runner.temp, so nothing in the checkout stands in for it. No `paths:`
# filter on the push: the guard reads every tracked file.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
    paths: [.github/workflows/secrets-lint.yml]

concurrency:
  group: secrets-lint-${{ github.run_attempt == '1' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install the credential guard package.json pins
        env:
          SKILLS_ROOT: ${{ runner.temp }}/neo-agent-skills-secrets
        run: |
          SKILLS_VERSION=$(node -p "require('./package.json').devDependencies['neo-agent-skills']")
          npm install --prefix "${SKILLS_ROOT}" --ignore-scripts --package-lock=false --no-save "neo-agent-skills@${SKILLS_VERSION}"

      - name: Reject credential-shaped literals in the tracked tree
        env:
          SKILLS_ROOT: ${{ runner.temp }}/neo-agent-skills-secrets
        run: '"${SKILLS_ROOT}/node_modules/.bin/neo-agent-skills-secrets" --all'
