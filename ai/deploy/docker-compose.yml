services:
  chroma:
    image: chromadb/chroma:1.5.9
    volumes:
      - chroma-data:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - neo-mcp-network

  kb-server:
    build:
      context: ../..
      dockerfile: ai/deploy/Dockerfile
      args:
        TARGET_SERVER: knowledge-base
    environment:
      - NEO_TRANSPORT=sse
      - NEO_AUTO_SYNC=false
      - NEO_KB_AUTO_START_DATABASE=false
      - NEO_CHROMA_HOST=chroma
      - NEO_CHROMA_PORT=8000
      - MCP_HTTP_PORT=3000
      - NEO_MEMORY_DB_PATH=/app/.neo-ai-data/sqlite/memory-core-graph.sqlite
    volumes:
      - shared-sqlite-data:/app/.neo-ai-data/sqlite
    depends_on:
      chroma:
        condition: service_healthy
    networks:
      - neo-mcp-network
    expose:
      - "3000"

  mc-server:
    build:
      context: ../..
      dockerfile: ai/deploy/Dockerfile
      args:
        TARGET_SERVER: memory-core
    environment:
      - NEO_TRANSPORT=sse
      - NEO_MC_PRIMARY=false
      - NEO_AUTO_SUMMARIZE=false
      - NEO_MEM_AUTO_START_DATABASE=false
      - NEO_MEM_AUTO_START_INFERENCE=false
      - NEO_AUTO_DREAM=false
      - NEO_AUTO_GOLDEN_PATH=false
      - NEO_REAL_TIME_MEMORY_PARSING=false
      - NEO_AUTO_INGEST_FS=false
      - NEO_CHROMA_UNIFIED=true
      - NEO_CHROMA_HOST=chroma
      - NEO_CHROMA_PORT=8000
      - MCP_HTTP_PORT=3001
      - NEO_MEMORY_DB_PATH=/app/.neo-ai-data/sqlite/memory-core-graph.sqlite
    volumes:
      - shared-sqlite-data:/app/.neo-ai-data/sqlite
    depends_on:
      chroma:
        condition: service_healthy
    networks:
      - neo-mcp-network
    expose:
      - "3001"

    # To expose these services externally, configure a reverse proxy (e.g., Nginx, Caddy)
    # on the `neo-mcp-network` to route traffic to `kb-server:3000` and `mc-server:3001`.
    # See tracking issue #10803 for reverse proxy patterns.

networks:
  neo-mcp-network:
    driver: bridge

volumes:
  chroma-data:
  shared-sqlite-data:
