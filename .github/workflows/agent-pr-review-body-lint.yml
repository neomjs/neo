name: Agent PR Review Body Lint

# Closes the `gh pr review` CLI bypass surface (#11495), companion to PR #11494's MCP
# tool-boundary mechanical body-shape validator. Without this workflow, an agent who
# routes around `manage_pr_review` via `gh pr review --body "..."` evades the strong
# layer; this CI lint catches malformed reviews after submission and posts a corrective
# comment + sets a failed status check (visibility + correction signal — NOT a merge
# blocker, since the review is already on GitHub by the time this fires).

on:
  pull_request_review:
    types: [submitted, edited]


jobs:
  lint-pr-review-body:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Review Body
        uses: actions/github-script@v9
        with:
          script: |
            const review   = context.payload.review;
            const pr       = context.payload.pull_request;
            const reviewer = review.user.login;
            const body     = review.body || "";

            // Only enforce for known AI agent accounts. Human reviewers are exempt;
            // a `neo-`-prefix heuristic also catches future agent identities (mirrors
            // `agent-pr-body-lint.yml` author-side filter shape).
            const agentReviewers = ['neo-opus-ada', 'neo-opus-grace', 'neo-opus-vega', 'neo-gemini-pro', 'neo-gpt'];
            const isAgentReviewer = agentReviewers.includes(reviewer) || reviewer.startsWith('neo-');

            if (!isAgentReviewer) {
              console.log(`✅ Reviewer ${reviewer} is not an AI agent. Skipping lint.`);
              return;
            }

            // State-keyed enforcement: only gate-bearing reviews owe the template.
            // APPROVED / CHANGES_REQUESTED flip reviewDecision and carry merge semantics; a
            // COMMENTED review is supplementary by construction (the merge gate's own rule:
            // a comment alone is insufficient) — same-family disclosures, corpus/fixture
            // verifications, invited design reads. Forcing the gate template onto those either
            // fails peers' CI on non-gating input or breeds template theater that muddies the
            // cross-family accounting. The state field is the same SSOT the merge gate reads.
            if ((review.state || '').toLowerCase() === 'commented') {
              console.log(`✅ COMMENTED review by ${reviewer} — supplementary (non-gating); template enforcement is state-keyed to APPROVED/CHANGES_REQUESTED. Skipping lint.`);
              return;
            }

            console.log(`🔍 Linting review body for agent reviewer: ${reviewer} on PR #${pr.number} (state: ${review.state})`);

            // ──────────────────────────────────────────────────────────────────────
            // Two-layer mechanical body-shape validation (#11495, derived from PR #11494).
            //
            // VISIBLE layer: 7 evaluation-metric tags from pr-review-template.md /
            // pr-review-followup-template.md. Wire-format contract with the Retrospective-
            // daemon graph ingestor (ai/daemons/services/ConceptDiscoveryService.mjs).
            // Misses surface as a precise list in the follow-up comment + ONE diagnostic
            // anchor named in the human-facing message.
            //
            // INVISIBLE layer: structural template substrings checked SILENTLY. Misses
            // NOT named in the follow-up comment — neither in prose nor as enumeration.
            // Defeats Goodhart anchor-stuffing where a reviewer hallucinates a body that
            // contains exactly the named visible anchors but omits the actual template
            // structure (empirical anchor: review 4304287893 on PR #11499 had all 7
            // visible tags but missing structural anchors — would have passed visible-only).
            //
            // ⚠️  SYNCHRONIZATION PROTOCOL: these lists and tier checks MUST stay in sync
            // with `ai/services/github-workflow/PullRequestService.mjs` review-template
            // constants. If you edit either side, edit the other simultaneously.
            // Follow-up ticket candidate:
            // extract to shared module `ai/services/github-workflow/prReviewAnchors.mjs`
            // (see #11501 cross-surface enhancement ticket).
            // ──────────────────────────────────────────────────────────────────────

            const VISIBLE_PR_REVIEW_ANCHORS = [
              "[ARCH_ALIGNMENT]",
              "[CONTENT_COMPLETENESS]",
              "[EXECUTION_QUALITY]",
              "[PRODUCTIVITY]",
              "[IMPACT]",
              "[COMPLEXITY]",
              "[EFFORT_PROFILE]"
            ];

            const INVISIBLE_PR_REVIEW_ANCHORS = [
              "Depth Floor",
              "Required Actions",
              "Strategic-Fit Decision"
            ];

            // Required premise-snapshot anchors. Match the distinctive bold template labels,
            // not bare prose, so incidental phrases like "Patch Verdict" do not satisfy the gate.
            const REQUIRED_PR_REVIEW_PREMISE_ANCHORS = [
              {label: "Inputs Read Before Patch", token: "**Inputs Read Before Patch:**"},
              {label: "Expected Solution Shape",  token: "**Expected Solution Shape:**"},
              {label: "Patch Verdict",            token: "**Patch Verdict:**"},
              {label: "Premise Coherence",        token: "**Premise Coherence:**"}
            ];

            const MICRO_DELTA_PR_REVIEW_SHAPE_HINTS = [
              "# Pull Request Micro-Delta Review",
              "### State Vector",
              "### Micro-Delta Focus",
              "### Verdict"
            ];

            const MICRO_DELTA_PR_REVIEW_TEMPLATE_SKELETON_ANCHORS = [
              "# Pull Request Micro-Delta Review",
              "> **Context:**",
              "### State Vector",
              "- **Target SHA:**",
              "- **Current reviewDecision:**",
              "- **Semantic Status:**",
              "- **CI Status:**",
              "- **Remaining Blocker Class:**",
              "- **Measured Discussion Cost:**",
              "### Micro-Delta Focus",
              "*Only defects classified as `mechanical-hygiene` or `metadata-drift` are reviewed here.*",
              "### Verdict",
              "**APPROVED**",
              "**CHANGES_REQUESTED**",
              "**MAINTAINER POLISH FAST PATH APPLIED**"
            ];

            const MICRO_DELTA_REVIEW_BLOCKER_CLASS_PATTERN = /(?:^|[^\w-])(mechanical-hygiene|metadata-drift)(?:$|[^\w-])/i;

            // Micro-Review (Cycle-1, blast-scaled) light path — KEEP IN SYNC with
            // ai/services/github-workflow/PullRequestService.mjs MICRO_REVIEW_* constants.
            // A micro/contained PR gets a premise+correctness glance, not the full gauntlet
            // (pr-review-guide §7). Fail SAFE toward accept: the floor is the header + the Class
            // assertion (micro|contained, so the light path is not an intense-PR backdoor) + a
            // Verdict + the Glance. An intense/large PR uses the full template instead.
            if (body.includes("# PR Micro-Review")) {
              const microMisses = ["# PR Micro-Review", "**Class:**", "**Verdict:**", "**Glance:**"]
                .filter(a => !body.includes(a));
              const microClassLine = body.split("\n").find(l => l.includes("**Class:**")) || "";
              if (!/(?:^|[^\w-])(micro|contained|mechanical)(?:$|[^\w-])/i.test(microClassLine)) {
                microMisses.push("Class: micro | contained | mechanical");
              }
              if (microMisses.length === 0) {
                console.log("✅ Micro-Review body matches the blast-scaled light shape.");
                return;
              }
              core.setFailed(`Agent micro-review body missing the minimal shape (header + "**Class:** micro|contained|mechanical" + "**Verdict:**" + "**Glance:**"). See .agents/skills/pr-review/assets/pr-review-micro-review-template.md`);
              return;
            }

            const isMicroDeltaPrReview = body.includes(MICRO_DELTA_PR_REVIEW_SHAPE_HINTS[0]) || (
              body.includes("### State Vector") &&
              body.includes("### Micro-Delta Focus")
            );

            if (isMicroDeltaPrReview) {
              const microDeltaMisses = MICRO_DELTA_PR_REVIEW_TEMPLATE_SKELETON_ANCHORS
                .filter(a => !body.includes(a));
              const remainingBlockerLine = body.split("\n").find(l => l.includes("- **Remaining Blocker Class:**")) || "";

              if (!MICRO_DELTA_REVIEW_BLOCKER_CLASS_PATTERN.test(remainingBlockerLine)) {
                microDeltaMisses.push("Remaining Blocker Class: mechanical-hygiene | metadata-drift");
              }

              if (microDeltaMisses.length === 0) {
                console.log("✅ Micro-Delta body matches the documented circuit-breaker shape.");
                return;
              }

              const skillPath        = '.agents/skills/pr-review/SKILL.md';
              const circuitPath      = '.agents/skills/pr-review/audits/review-cost-circuit-breaker.md';
              const microDeltaPath   = '.agents/skills/pr-review/assets/pr-review-micro-delta-template.md';
              const reviewUrl        = `https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${pr.number}#pullrequestreview-${review.id}`;
              const diagnosticAnchor = microDeltaMisses[0] || null;

              const commentBody = [
                `## 🚨 Agent Micro-Delta Review Body Lint Violation`,
                ``,
                `@${reviewer} — your [review on PR #${pr.number}](${reviewUrl}) attempts the Micro-Delta format but does not match the documented circuit-breaker structure.`,
                ``,
                `**Required action**: read \`${skillPath}\`, \`${circuitPath}\`, and \`${microDeltaPath}\` BEFORE submitting a corrective re-review.`,
                ``,
                `Micro-Delta reviews are only valid after the Review-Loop Cost Circuit Breaker classifies the PR as state (a): semantics cleared, with only mechanical-hygiene or metadata-drift remaining.`,
                `If a semantic or contract delta exists, use the full follow-up review template instead.`,
                ``,
                diagnosticAnchor
                  ? `**Diagnostic hint**: at least one required Micro-Delta anchor like \`${diagnosticAnchor}\` is missing or invalid.`
                  : `**Diagnostic hint**: the Micro-Delta structural template anchors do not match.`,
                ``,
                `<sub>This is the CI tool-boundary lint companion to PR #11494's MCP \`manage_pr_review\` validator.`,
                `Both layers point you at the same skill substrate. Closes #11495 and #13910.</sub>`
              ].join('\n');

              await github.rest.issues.createComment({
                owner       : context.repo.owner,
                repo        : context.repo.repo,
                issue_number: pr.number,
                body        : commentBody
              });

              core.setFailed(`Agent micro-delta review body missing required circuit-breaker anchors. See follow-up comment on PR #${pr.number}.`);
              return;
            }

            const missingVisible         = VISIBLE_PR_REVIEW_ANCHORS         .filter(a => !body.includes(a));
            const missingInvisible       = INVISIBLE_PR_REVIEW_ANCHORS       .filter(a => !body.includes(a));
            const missingPremiseSnapshot = REQUIRED_PR_REVIEW_PREMISE_ANCHORS
              .filter(a => !body.includes(a.token))
              .map(a => a.label);

            if (missingVisible.length === 0 && missingInvisible.length === 0 && missingPremiseSnapshot.length === 0) {
              console.log("✅ Review body contains all required anchors.");
              return;
            }

            // Compose comment that guides toward the skill without enumerating invisible
            // anchors. Even visible-list naming is bounded — at most ONE diagnostic
            // anchor in the prose (the full visible-miss list goes in the collapsed
            // details block for programmatic access; invisible misses are NEVER named).
            const diagnosticAnchor = missingVisible[0] || missingPremiseSnapshot[0] || null;

            const skillPath    = '.agents/skills/pr-review/SKILL.md';
            const templatePath = '.agents/skills/pr-review/assets/pr-review-template.md';
            const followupPath = '.agents/skills/pr-review/assets/pr-review-followup-template.md';

            const reviewUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${pr.number}#pullrequestreview-${review.id}`;

            const commentBody = [
              `## 🚨 Agent PR Review Body Lint Violation`,
              ``,
              `@${reviewer} — your [review on PR #${pr.number}](${reviewUrl}) does not match the pr-review template structure.`,
              ``,
              `**Required action**: read \`${skillPath}\` BEFORE submitting a corrective re-review. The skill points at:`,
              `  - Cycle 1 (full template): \`${templatePath}\``,
              `  - Cycle N (follow-up template): \`${followupPath}\``,
              ``,
              `Do NOT compose a substitute template or hallucinate section headings. The validator`,
              `checks more structural anchors than this comment names. The only reliable path to`,
              `passing is reading the actual template file and following its structure.`,
              ``,
              `Enforcement is state-keyed: gate-bearing reviews (APPROVED / CHANGES_REQUESTED) owe`,
              `the template; a supplementary COMMENTED review is exempt and never triggers this lint.`,
              ``,
              missingPremiseSnapshot.length > 0
                ? `**Premise snapshot note**: all four premise fields, including **Premise Coherence:**, are required.`
                : ``,
              ``,
              diagnosticAnchor
                ? `**Diagnostic hint**: at least one recognized anchor like \`${diagnosticAnchor}\` is missing.`
                : `**Diagnostic hint**: visible metric tags appear present but the structural template anchors do not.`,
              ``,
              `<details>`,
              `<summary>Visible anchors missing (full list)</summary>`,
              ``,
              missingVisible.length > 0
                ? missingVisible.map(a => `- \`${a}\``).join('\n')
                : `(none — visible layer passed; invisible structural layer caught the miss)`,
              ``,
              `</details>`,
              ``,
              `<sub>This is the CI tool-boundary lint companion to PR #11494's MCP \`manage_pr_review\` validator.`,
              `Both layers point you at the same skill substrate. Closes #11495.</sub>`
            ].join('\n');

            await github.rest.issues.createComment({
              owner       : context.repo.owner,
              repo        : context.repo.repo,
              issue_number: pr.number,
              body        : commentBody
            });

            core.setFailed(`Agent review body missing required template anchors. See follow-up comment on PR #${pr.number}.`);
