openapi: 3.0.3
info:
  title: Neo File System MCP Server API
  description: |
    This API provides baseline environment tools to autonomous agents:
    path-jailed file system manipulation, and execution capabilities
    (syntax checking, test running) essential for agent feedback loops.

    CONTAINMENT, STATED PRECISELY. Every path argument is jailed to the project
    root. That is a guarantee about ARGUMENTS, and it is not a sandbox.

    `run_playwright_test` executes a spec, and a spec is arbitrary JavaScript,
    so what it reads and writes is bounded by the process this server runs in
    — not by the path guard. `write_file` plus `run_playwright_test` therefore
    composes past the jail without either call violating it (#16481).

    Real containment needs process or container isolation for the executor.
    Until that exists, treat this surface as: jailed arguments, unjailed
    execution. Do not grant it inputs you would not grant the host process.
  version: 1.0.0
  contact:
    name: Neo.mjs Project
    url: https://github.com/neomjs/neo
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8004
    description: Local file system server

tags:
  - name: Health
    description: Server health endpoints
  - name: IO
    description: File IO capabilities
  - name: Execution
    description: Execution sandbox

paths:
  /healthcheck:
    get:
      summary: Health Check
      operationId: healthcheck
      x-annotations:
        readOnlyHint: true
      description: Verifies that the server is running.
      tags: [Health]
      responses:
        '200':
          description: Server is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "OK"

  /tool/handbook:
    post:
      summary: Tool Handbook
      operationId: get_mcp_tool_handbook
      description: Returns lazy-loaded usage detail for one file-system MCP tool.
      tags: [Health]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toolId]
              properties:
                toolId:
                  type: string
                  description: Tool operation id to inspect.
      responses:
        '200':
          description: Tool handbook lookup result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  toolId:
                    type: string
                  found:
                    type: boolean
                  title:
                    type: string
                  description:
                    type: string
                  handbook:
                    type: string
                  source:
                    type: string
                  code:
                    type: string
                  message:
                    type: string
                  inputSchema:
                    type: object
                  outputSchema:
                    type: object

  /read_file:
    post:
      summary: Read a specific file safely.
      operationId: read_file
      description: Reads the complete text of a file from the workspace. Throws a 403 on directory escape attempts.
      x-neo-tool-summary: Read a workspace file by absolute path.
      x-neo-tool-handbook: |
        Reads the complete text of a file from the workspace sandbox. Use this for source
        inspection before editing or review. Pass an absolute path; directory traversal outside
        the permitted workspace is rejected by the file-system service rather than silently
        rewritten.
      tags: [IO]
      x-pass-as-object: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [absolutePath]
              properties:
                absolutePath:
                  type: string
                  description: The absolute path of the file to read.
      responses:
        '200':
          description: The text content of the file.
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: string

  /write_file:
    post:
      summary: Writes or overwrites a file.
      operationId: write_file
      description: Writes content to a specific file. Throws a 403 on directory escape attempts.
      tags: [IO]
      x-pass-as-object: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [absolutePath, content]
              properties:
                absolutePath:
                  type: string
                  description: The absolute path to save the file.
                content:
                  type: string
                  description: The exact string contents to write.
      responses:
        '200':
          description: A status confirming write success.

  /list_directory:
    post:
      summary: Lists the content of a directory.
      operationId: list_directory
      description: Returns an array of file/folder names inside the given directory path.
      tags: [IO]
      x-pass-as-object: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [absolutePath]
              properties:
                absolutePath:
                  type: string
                  description: The absolute directory path.
      responses:
        '200':
          description: List of directory contents.

  /check_syntax:
    post:
      summary: Checks target JS file for syntax errors.
      operationId: check_syntax
      description: Runs a native AST/syntax check against a file. Returns empty if valid, else returns the syntax error preventing execution.
      tags: [Execution]
      x-pass-as-object: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [absolutePath]
              properties:
                absolutePath:
                  type: string
                  description: The absolute path of the file.
      responses:
        '200':
          description: The result of the syntax check.

  /run_playwright_test:
    post:
      summary: Executes a single Playwright spec.
      operationId: run_playwright_test
      # `tools/list` is compacted on this server (max 120 chars) and reads this field, never the
      # description below — so the warning has to exist in BOTH places or the ordinary discovery
      # surface keeps describing runner isolation while the real limit lives one call away.
      x-neo-tool-summary: "Executes one Playwright spec. EXECUTION IS NOT JAILED — the spec runs with this server's host trust."
      description: |
        Runs the Playwright runner isolated to the requested spec file to test pass/fail conditions.

        EXECUTION IS NOT JAILED. The path argument is validated against the project root; the spec
        that runs is arbitrary JavaScript, so what it reads and writes is bounded by this server's
        host process, not by that root. Combined with write_file this reaches outside the project
        root without either call violating a guard. Do not pass this tool input you would not grant
        the host process.
      tags: [Execution]
      x-pass-as-object: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [absolutePath]
              properties:
                absolutePath:
                  type: string
                  description: The absolute path to the .spec.mjs file.
      responses:
        '200':
          description: The output trace of the test.
