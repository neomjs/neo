name: Engine Tests

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

  # The denominator these three tiers had no way to produce. `test-e2e.yml` has carried this since
  # #18505; unit, unit-tz and components did not, so a day's worth of intermittent sightings across
  # them yielded four failures and no rate. A rerun is the opposite of a sample: it marks the run
  # green and erases the observation that provoked it.
  #
  # No classifier bypass, and that was measured rather than assumed: `classify-test-scope.yml`
  # fails OPEN. On a dispatch `getChangedFiles()` matches neither the pull_request nor the push
  # branch and returns null, so the "changed files unavailable" arm sets every run flag true; the
  # sibling head check returns true for any non-pull_request event. Both gates on every step below
  # therefore pass on a dispatch already.
  workflow_dispatch:
    inputs:
      specs:
        description: 'Spec paths to run instead of the tier selection (space-separated). Empty runs the ordinary selection.'
        type: string
      repeatEach:
        description: 'Run each selected test this many times — the denominator of the measurement.'
        type: string
        default: '1'
      suite:
        description: 'Restrict the probe to one tier. Empty runs all three.'
        type: choice
        options: ['', unit, unit-tz, components]
        default: ''

concurrency:
  # Initial attempts share the ref stream so new heads still supersede old work.
  # Reruns retain their original run_id and cannot cancel a newer head (#15593).
  #
  # A DISPATCH gets its own key, per `test-e2e.yml`'s measured finding: two probes on one ref shared
  # the ref-keyed group and the second cancelled the first mid-measurement. Superseding is right for
  # a gate and wrong for an instrument, where every sample is the point.
  group: tests-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || (github.run_attempt == '1' && github.ref || github.run_id) }}
  cancel-in-progress: true


jobs:
  # The classifier moved out of this file in #17853 so the separately-piped e2e tier
  # (`test-e2e.yml`, #18408) can consume the SAME decision rather than run on every push.
  # Its predicates, and the reasoning behind each path atom, live with the job.
  #
  # Calling it changes nothing here: `needs.changes.outputs.*` resolves through the reusable
  # workflow's declared outputs exactly as it resolved through the inline job's.
  changes:
    name: Classify test scope
    uses: ./.github/workflows/classify-test-scope.yml

  test:
    name: ${{ matrix.suite }}${{ matrix.shard && format(' ({0}/{1})', matrix.shard, matrix.shards) || '' }}${{ matrix.tzLabel && format(' ({0})', matrix.tzLabel) || '' }}
    runs-on: ubuntu-latest
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        # Bucket A-F audit (#10903) closed via #10907/#10921/#10910/#10919/#10920.
        # Bucket G (#10924) substrate fixes landed via #10940 (TestLifecycleHelper
        # primitive + daemon-spec migration) + open trackers for residual flakes
        # (#10941/#10936/#10937/#10946 — all unit-skip-guarded via NEO_TEST_SKIP_CI).
        #
        # Per-suite run flag resolves the classifier output once (#15368) — every
        # step below gates on `matrix.run` instead of re-enumerating suite×flag
        # boolean pairs, which stopped scaling at the third suite.
        #
        # The components suite runs one worker per runner, so it scales across runners: each
        # entry is a Playwright shard. A shard nearing four minutes of test time gets a sibling.
        include:
          - suite: unit
            run: ${{ needs.changes.outputs.run_unit }}
          # The timezone-discriminating half of the unit tier. A local<->UTC conversion computes the
          # same answer in both implementations when the offset is zero, so a UTC runner cannot fail
          # on one - no extra test case closes that, only a non-UTC zone does (#19005). Two entries
          # because one zone catches one sign: +14 and -11, both DST-free so the runs are stable.
          - suite: unit-tz
            run: ${{ needs.changes.outputs.run_unit }}
            tz: Pacific/Kiritimati
            tzLabel: plus14
          - suite: unit-tz
            run: ${{ needs.changes.outputs.run_unit }}
            tz: Pacific/Niue
            tzLabel: minus11
          - suite: components
            run: ${{ needs.changes.outputs.run_components }}
            shard: 1
            shards: 3
          - suite: components
            run: ${{ needs.changes.outputs.run_components }}
            shard: 2
            shards: 3
          - suite: components
            run: ${{ needs.changes.outputs.run_components }}
            shard: 3
            shards: 3

    steps:
      # Re-run failed jobs does not re-run successful prerequisite jobs. Keep this
      # job-local gate so an obsolete failed suite cannot consume a full runner.
      - name: Verify current pull-request head
        id: head
        uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName !== 'pull_request') {
              core.setOutput('current', 'true');
              return;
            }

            const pull = await github.rest.pulls.get({
              owner      : context.repo.owner,
              repo       : context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            const eventHead = context.payload.pull_request.head.sha;
            const liveHead  = pull.data.head.sha;
            const current   = eventHead === liveHead;

            core.setOutput('current', String(current));

            if (!current) {
              const reason = `stale workflow head ${eventHead}; live PR head is ${liveHead}`;

              core.notice(`Skipping expensive test suite: ${reason}`);
              core.setOutput('skip_reason', reason);
              await core.summary
                .addHeading('Stale workflow attempt')
                .addRaw(`Skipped the expensive test suite because ${reason}.`)
                .write();
            }

      - name: Checkout repository
        if: ${{ matrix.run == 'true' && steps.head.outputs.current == 'true' }}
        uses: actions/checkout@v7

      - name: Setup Node.js
        if: ${{ matrix.run == 'true' && steps.head.outputs.current == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        if: ${{ matrix.run == 'true' && steps.head.outputs.current == 'true' }}
        run: npm ci

      # Required for the unit-test runner per bootstrapWorktree.mjs precedent.
      # Harmless for the other suites.
      - name: Bundle browser dependencies
        if: ${{ matrix.run == 'true' && steps.head.outputs.current == 'true' }}
        run: npm run bundle-browser-deps

      # The components suite launches real Chromium against the dev server; unit runs
      # browserless, so browser provisioning stays scoped to this suite.
      #
      # Browser provisioning has two network tails, and each has turned a five-minute
      # job into a fifteen-minute one: the browser download (20 to 40 seconds on a good
      # day, five to eleven minutes on a bad one) and the apt install of its system
      # libraries (seconds when the mirror answers, five minutes when it does not).
      #
      # The browser binaries are cached across runs, keyed on the installed Playwright
      # version: a new version ships a new browser build and misses on purpose. The
      # cache is saved right after a successful download, not at job end, so a red test
      # run still leaves the browser behind for the next one. The system libraries are
      # not installed on a schedule: a launch probe asks the browser whether anything is
      # missing, and apt runs only when it is — on the runner image that ships Chrome,
      # it is not.
      - name: Resolve Playwright version
        id: playwright
        if: ${{ matrix.run == 'true' && steps.head.outputs.current == 'true' && matrix.suite == 'components' }}
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright Chromium
        id: playwright-cache
        if: ${{ matrix.run == 'true' && steps.head.outputs.current == 'true' && matrix.suite == 'components' }}
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        if: ${{ matrix.run == 'true' && steps.head.outputs.current == 'true' && matrix.suite == 'components' && steps.playwright-cache.outputs.cache-hit != 'true' }}
        run: npx playwright install chromium

      - name: Save Playwright Chromium
        if: ${{ matrix.run == 'true' && steps.head.outputs.current == 'true' && matrix.suite == 'components' && steps.playwright-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      # A failed launch names the missing libraries in its output and hands the job to
      # the apt step below; a job that still cannot launch after it fails in the tests.
      - name: Verify Chromium launches
        id: chromium-probe
        if: ${{ matrix.run == 'true' && steps.head.outputs.current == 'true' && matrix.suite == 'components' }}
        continue-on-error: true
        run: node -e "require('@playwright/test').chromium.launch().then(browser => browser.close())"

      - name: Install Playwright system dependencies
        if: ${{ matrix.run == 'true' && steps.head.outputs.current == 'true' && matrix.suite == 'components' && steps.chromium-probe.outcome == 'failure' }}
        run: npx playwright install-deps chromium

      - name: Skip ${{ matrix.suite }} tests
        if: ${{ matrix.run != 'true' || steps.head.outputs.current != 'true' }}
        run: |
          echo "${{ matrix.suite }} skipped: ${{ steps.head.outputs.skip_reason || needs.changes.outputs.skip_reason }}"

      - name: Run ${{ matrix.suite }} tests
        if: ${{ matrix.run == 'true' && steps.head.outputs.current == 'true' && (github.event_name != 'workflow_dispatch' || inputs.suite == '' || inputs.suite == matrix.suite) }}
        env:
          # Dispatch inputs reach the shell as ENVIRONMENT, never interpolated into this script.
          # `${{ inputs.specs }}` spliced into a `run:` is a command-injection surface, and "only
          # maintainers can dispatch" is a mitigation rather than a fix. Read as `$PROBE_SPECS` the
          # value is only ever word-split into arguments, so metacharacters inside it stay data.
          PROBE_SPECS     : ${{ inputs.specs }}
          PROBE_REPEAT    : ${{ inputs.repeatEach || '1' }}
          SUITE           : ${{ matrix.suite }}
          SHARD_ARG       : ${{ matrix.shard && format('--shard={0}/{1}', matrix.shard, matrix.shards) || '' }}
          NEO_TEST_SKIP_CI: ${{ startsWith(matrix.suite, 'unit') && 'true' || '' }}
          NEO_UNIT_TZ     : ${{ matrix.tz }}
        run: |
          args=()

          [ -n "${SHARD_ARG}" ]      && args+=("${SHARD_ARG}")
          [ "${PROBE_REPEAT}" != 1 ] && args+=("--repeat-each=${PROBE_REPEAT}")

          # Word-splitting is the point here: each path in the input becomes its own argument.
          # shellcheck disable=SC2206
          [ -n "${PROBE_SPECS}" ] && args+=(${PROBE_SPECS})

          npm run "test-${SUITE}" -- "${args[@]}"

      # A probe's green means "this selection passed N times", never "the tier is covered". Saying so
      # in the summary is the difference between a measurement and a run someone later mistakes for one.
      - name: Report probe selection
        if: ${{ always() && github.event_name == 'workflow_dispatch' && matrix.run == 'true' && steps.head.outputs.current == 'true' && (inputs.suite == '' || inputs.suite == matrix.suite) }}
        env:
          PROBE_SPECS : ${{ inputs.specs }}
          PROBE_REPEAT: ${{ inputs.repeatEach || '1' }}
          SUITE       : ${{ matrix.suite }}
        run: |
          {
            echo "### Probe — ${SUITE}"
            echo
            if [ -n "${PROBE_SPECS}" ]; then
              echo "Covers this selection and nothing else, so its result says nothing about the tier:"
              echo
              echo '```'
              echo "${PROBE_SPECS}"
              echo '```'
            else
              echo "Covers the ordinary ${SUITE} selection."
            fi
            echo
            echo "Each selected test ran **${PROBE_REPEAT}×** — that is the denominator."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test artifacts on failure
        if: ${{ failure() && matrix.run == 'true' && steps.head.outputs.current == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.suite }}-${{ github.run_id }}${{ matrix.shard && format('-shard-{0}', matrix.shard) || '' }}${{ matrix.tzLabel && format('-{0}', matrix.tzLabel) || '' }}
          path: test/playwright/test-results/
          retention-days: 14
