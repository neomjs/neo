# ------------------------------------------------------------------------------
# Neo.mjs MCP Server Reference Proxy Configuration
# Target: Shared Topology (Multi-tenant)
# ------------------------------------------------------------------------------
# Security Threat Model:
# The Neo MCP architecture uses trustProxyIdentity, which allows the upstream
# MCP servers to trust the X-PREFERRED-USERNAME header for authorization.
# IT IS CRITICAL to strip any client-provided values for this header BEFORE
# allowing your authentication layer (e.g., oauth2-proxy) to inject it.
# ------------------------------------------------------------------------------

# Example oauth2-proxy upstream
upstream oauth2_proxy {
    server 127.0.0.1:4180;
}

# Example Neo MCP servers
upstream neo_kb {
    server 127.0.0.1:3000; # Port configured via MCP_HTTP_PORT
}

upstream neo_mc {
    server 127.0.0.1:3001; # Port configured via MCP_HTTP_PORT
}

server {
    listen 443 ssl http2;
    server_name mcp.example.com;

    # [Out of scope: TLS termination certificates]
    # ssl_certificate /path/to/cert.pem;
    # ssl_certificate_key /path/to/key.pem;

    # 1. Global Header Stripping (Symmetric spoofing defense)
    # Strip incoming headers so clients cannot spoof identity.
    # Note: nginx fastcgi/proxy params might need this per-location, but doing it here or
    # explicitly zeroing it in the location block is required.

    # 2. Authentication Request to oauth2-proxy
    location /oauth2/ {
        proxy_pass http://oauth2_proxy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $scheme;
    }

    # Internal auth endpoint
    location = /oauth2/auth {
        internal;
        proxy_pass http://oauth2_proxy;
        proxy_set_header Host $host;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # 3. Pathname Routing: Knowledge Base Server
    location /kb/ {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in;

        # Extract preferred username from auth response
        auth_request_set $user $upstream_http_x_auth_request_preferred_username;

        # SECURITY: Strip client-provided headers and inject trusted ones
        proxy_set_header X-PREFERRED-USERNAME "";
        proxy_set_header X-Auth-Request-Preferred-Username "";
        proxy_set_header X-PREFERRED-USERNAME $user;

        # SSE Support (Server-Sent Events require no buffering)
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        chunked_transfer_encoding on;

        proxy_pass http://neo_kb/;
    }

    # 4. Pathname Routing: Memory Core Server
    location /mc/ {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in;

        # Extract preferred username from auth response
        auth_request_set $user $upstream_http_x_auth_request_preferred_username;

        # SECURITY: Strip client-provided headers and inject trusted ones
        proxy_set_header X-PREFERRED-USERNAME "";
        proxy_set_header X-Auth-Request-Preferred-Username "";
        proxy_set_header X-PREFERRED-USERNAME $user;

        # SSE Support (Server-Sent Events require no buffering)
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        chunked_transfer_encoding on;

        proxy_pass http://neo_mc/;
    }
}
