# Version updates. Security updates are a separate surface that needs no config and already runs.
#
# MAJORS ARE INCLUDED BY NOT BEING EXCLUDED: Dependabot's default spans every SemVer level, and you
# opt out with `ignore: [{update-types: ["version-update:semver-major"]}]`. The absence of that key
# is deliberate — do not add one without changing the policy it encodes.
#
# GROUPED, because ungrouped daily updates open a PR per dependency and the queue stops being read.
# `github-actions` is here because nothing else updates the pinned action versions.
#
# No materializer, installer or drift check accompanies this file: each repository commits its own.
version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
    groups:
      all-deps:
        patterns: ["*"]
        # Both exclusions are exact-pinned, for the same reason: their diff has to be read, and a
        # standalone PR is the only place that happens. Inside the bulk bump it gets skimmed.
        #
        # Monaco: a version bump requires addon/wrapper compatibility checks.
        # neo-agent-skills: `.claude/skills/*` symlinks into it, so a release rewrites the workflows
        # every agent in this checkout obeys. A caret would let install date decide which rules an
        # agent reads; the exact pin makes that a reviewed fact instead.
        exclude-patterns: ["monaco-editor", "neo-agent-skills"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    groups:
      actions:
        patterns: ["*"]
