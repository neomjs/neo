name: Config Template SSOT Lint

on:
  pull_request:
    branches: [dev]
    paths:
      - 'ai/**/config.template.mjs'
      # `ai/**/configBase.mjs`, not `ai/configBase.mjs`: the root was the only base when this filter
      # was written, and the template/base split puts a sibling base beside every server template. A
      # root-only pattern would leave a leaf deleted from a per-server base triggering nothing — the
      # guard present, correct, and never run.
      - 'ai/**/configBase.mjs'
      # The parity snapshot is an input to the check, so editing it must re-run the check. Otherwise a
      # removal can be blessed by updating the record of what exists, with nothing re-reading reality.
      - 'ai/scripts/lint/config-leaf-parity.json'
      - 'ai/scripts/lint/lint-config-template-ssot.mjs'
      # ADR-0019's catalog and its sibling executable rule objects are inputs to the two-way
      # ownership verdict. A change to any one must run the checker on that same PR.
      - 'learn/agentos/decisions/0019-aiconfig-reactive-provider-ssot.md'
      - 'buildScripts/util/check-aiconfig-antipatterns.mjs'
      - 'buildScripts/util/check-aiconfig-test-mutation.mjs'
      - '.github/workflows/config-template-ssot-lint.yml'
      # Compose templates are SCANNED by two rules — the Compose/default parity check and the
      # behavior-binding clock projection check (#17115) — so by the scanned ⊆ watched invariant
      # stated below they must be watched. Without this, deleting a projected clock from a deploy
      # template triggers nothing, which is precisely the "guard present, correct, and never run"
      # class the filters above already call out twice. The projection rule exists because a clock
      # went unprojected across two plane generations; leaving its own trigger unwatched would
      # rebuild that blind spot one layer up.
      - 'ai/deploy/**'
      # The invariant is scanned ⊆ watched: the lint's implementation/capture rules walk every
      # `ai/**/*.mjs` and its test config-authority (C3) rule walks every `test/**/*.mjs`, so a
      # filter without these lets an introducing PR land ungated and turns the NEXT unrelated
      # template-touching run red — late, misattributed enforcement (#16628; the configBase
      # comment above already names the class: guard present, correct, and never run).
      - 'ai/**/*.mjs'
      - 'test/**/*.mjs'
  push:
    branches: [dev]
    paths:
      - 'ai/**/config.template.mjs'
      # `ai/**/configBase.mjs`, not `ai/configBase.mjs`: the root was the only base when this filter
      # was written, and the template/base split puts a sibling base beside every server template. A
      # root-only pattern would leave a leaf deleted from a per-server base triggering nothing — the
      # guard present, correct, and never run.
      - 'ai/**/configBase.mjs'
      # The parity snapshot is an input to the check, so editing it must re-run the check. Otherwise a
      # removal can be blessed by updating the record of what exists, with nothing re-reading reality.
      - 'ai/scripts/lint/config-leaf-parity.json'
      - 'ai/scripts/lint/lint-config-template-ssot.mjs'
      # ADR-0019's catalog and its sibling executable rule objects are inputs to the two-way
      # ownership verdict. A change to any one must run the checker on that same push.
      - 'learn/agentos/decisions/0019-aiconfig-reactive-provider-ssot.md'
      - 'buildScripts/util/check-aiconfig-antipatterns.mjs'
      - 'buildScripts/util/check-aiconfig-test-mutation.mjs'
      - '.github/workflows/config-template-ssot-lint.yml'
      # Compose templates are SCANNED by two rules — the Compose/default parity check and the
      # behavior-binding clock projection check (#17115) — so by the scanned ⊆ watched invariant
      # stated below they must be watched. Without this, deleting a projected clock from a deploy
      # template triggers nothing, which is precisely the "guard present, correct, and never run"
      # class the filters above already call out twice. The projection rule exists because a clock
      # went unprojected across two plane generations; leaving its own trigger unwatched would
      # rebuild that blind spot one layer up.
      - 'ai/deploy/**'
      # The invariant is scanned ⊆ watched: the lint's implementation/capture rules walk every
      # `ai/**/*.mjs` and its test config-authority (C3) rule walks every `test/**/*.mjs`, so a
      # filter without these lets an introducing PR land ungated and turns the NEXT unrelated
      # template-touching run red — late, misattributed enforcement (#16628; the configBase
      # comment above already names the class: guard present, correct, and never run).
      - 'ai/**/*.mjs'
      - 'test/**/*.mjs'

concurrency:
  group: config-template-ssot-lint-${{ github.run_attempt == '1' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint config.template.mjs leaves for inline process.env reads
        run: node ai/scripts/lint/lint-config-template-ssot.mjs
