name: Secrets Lint

# CI mirror of the `.husky/pre-commit` credential guard, so `git commit --no-verify` cannot bypass it.
#
# No `paths:` filter: the guard reads every tracked file, and a credential is as unrecallable in a JSON fixture as in
# source. The whole tree takes a few seconds, and the guard uses Node builtins only, so there is nothing to install.

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

concurrency:
  group: secrets-lint-${{ github.run_attempt == '1' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Reject credential-shaped literals in the tracked tree
        run: node ./buildScripts/util/check-secrets.mjs --all
