services:
  chroma:
    image: chromadb/chroma:0.5.20
    volumes:
      - chroma-data:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neo-mcp-network

  kb-server:
    build:
      context: ../..
      dockerfile: ai/deploy/Dockerfile
      args:
        TARGET_SERVER: knowledge-base
    environment:
      - NEO_CHROMA_HOST=chroma
      - NEO_CHROMA_PORT=8000
      - MCP_HTTP_PORT=3000
      - NEO_MEMORY_DB_PATH=/app/.neo-ai-data/sqlite/memory-core-graph.sqlite
    volumes:
      - shared-sqlite-data:/app/.neo-ai-data/sqlite
    depends_on:
      chroma:
        condition: service_healthy
    networks:
      - neo-mcp-network
    expose:
      - "3000"

  mc-server:
    build:
      context: ../..
      dockerfile: ai/deploy/Dockerfile
      args:
        TARGET_SERVER: memory-core
    environment:
      - NEO_CHROMA_UNIFIED=true
      - NEO_CHROMA_HOST=chroma
      - NEO_CHROMA_PORT=8000
      - MCP_HTTP_PORT=3001
      - NEO_MEMORY_DB_PATH=/app/.neo-ai-data/sqlite/memory-core-graph.sqlite
    volumes:
      - shared-sqlite-data:/app/.neo-ai-data/sqlite
    depends_on:
      chroma:
        condition: service_healthy
    networks:
      - neo-mcp-network
    expose:
      - "3001"

    # To expose these services externally, configure a reverse proxy (e.g., Nginx, Caddy)
    # on the `neo-mcp-network` to route traffic to `kb-server:3000` and `mc-server:3001`.
    # See tracking issue #10803 for reverse proxy patterns.

networks:
  neo-mcp-network:
    driver: bridge

volumes:
  chroma-data:
  shared-sqlite-data:
