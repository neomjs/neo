name: Data Sync Pipeline

# Watched by data-sync-watchdog.yml (staleness alarm over run-status + committed-corpus axes).
on:
  schedule:
    - cron: '0 * * * *' # Run hourly
  workflow_dispatch:
    inputs:
      preflight_only:
        # Verifies the credential topology WITHOUT side effects: mints both tokens, probes every
        # required repository, then stops. The collection stages are the ones that mutate — OptOut
        # comments on and closes real issues in `devindex-opt-out` — so a configuration check that
        # has to run them is not a check anyone will repeat. This one is safe to run as often as
        # needed, which is what makes it usable while an installation is being corrected.
        description: 'Probe repository access and exit, without collecting or publishing'
        type: boolean
        default: false

concurrency:
  group: data-sync-pipeline
  cancel-in-progress: false


jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      # `contents: read`, NOT write. This said `write # Required to push changes`, and that stopped
      # being true when checkout and publish moved to the Publisher App token — leaving a THIRD
      # repository-write credential alive for the whole job while this workflow claims two scoped
      # identities. The implicit token is not merely unused: GitHub documents that an action can
      # reach `github.token` even when the workflow never passes `GITHUB_TOKEN`, so an unused
      # write grant is still a reachable one, and per-stage env scoping cannot revoke it.
      #
      # `read` rather than `{}` deliberately: corpus emission and content-index derivation use the
      # implicit token as their scoped reader. Neither needs write authority; the Publisher App
      # remains the only identity that can publish the generated commit.
      contents: read
      # Corpus emission reads pull-request and discussion GraphQL surfaces. These remain read-only
      # on the implicit token; the Publisher App token is still reserved for the final git push.
      discussions: read
      # The run above asked for has now happened: the `content indexes and SEO` stage pages this
      # repository's labels over GraphQL and had no credential that could, so every scheduled run
      # since the per-stage scoping landed has failed at that stage. NEITHER App can serve it — the
      # Intake installation does not exist on this repository, and the Publisher holds `contents`
      # while labels are `issues` scope — so the implicit token is the only identity that fits.
      #
      # This does NOT reintroduce a third credential. The implicit token is already reachable in
      # this job per the note above; `issues: read` widens what it may read and leaves it unable
      # to write anything. `contents` stays `read`, and the two-App split is untouched: that split
      # exists so the intake identity cannot publish and the publisher cannot mutate the intake
      # repos, which a read-only grant here does not weaken.
      issues: read
      pull-requests: read

    steps:
      # Two identities, because they hold different authority and `create-github-app-token` scopes
      # ONE permission set across a whole repository set — a single App spanning all three repos
      # would let the publishing identity mutate the intake repos and let the intake identity
      # publish here. That mutation-authority separation is the whole rationale and it stands on
      # its own. The default GITHUB_TOKEN cannot do the intake job at all: it is scoped to this
      # repository, so it has no installation on the DevIndex intake repos — absent, not merely
      # underprivileged.
      #
      # It deliberately does NOT describe the Publisher as a ruleset-bypass identity. Whether a bypass
      # exists is repository configuration this workflow cannot set and an admin can change at any time,
      # so stating it here as a property of the credential is wrong the moment the ruleset is edited —
      # in either direction. See the checkout note below for how to read it.
      - name: Mint Publisher installation token
        id: publisher-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DATA_SYNC_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.DATA_SYNC_PUBLISHER_PRIVATE_KEY }}
          # Requested EXPLICITLY: without this, v3 mints a token carrying every permission the
          # installation holds. The App is scoped narrowly, so the practical delta is small — but
          # then the least-privilege property lives in a setting nobody reads at review time, and
          # widening the App silently widens this token. Stating it here makes the grant reviewable
          # in the diff and caps it independently of how the installation drifts.
          permission-contents: write

      # Installed on the DevIndex repos, not this one, so the installation must be named explicitly.
      #
      # NON-FATAL, unlike the Publisher mint above. This step ran before checkout, before Node and
      # before emission, with nothing tolerating its failure — so any intake credential fault killed
      # the job before a single corpus byte existed. That is the #17148 blast radius one layer up:
      # the corpus is emitted under the READER identity and does not consume this token at all, yet
      # an ENRICHMENT credential decided whether the whole repository published.
      #
      # `create-github-app-token` fails outright when asked for a permission the installation lacks,
      # so the realistic triggers are ordinary administration: a revoked permission, a rotated key,
      # an installation removed from one repository. #17150 adds a `contents` grant to this step,
      # which widens that surface further — the workflow line and the App grant become a pair that
      # must move together, and this guard is what keeps a drift between them from freezing the
      # corpus rather than merely disabling intake.
      #
      # Degrading here needs no new error path. A failed mint leaves `outputs.token` empty, the empty
      # `DATA_SYNC_INTAKE_TOKEN` reaches `assertDataSyncAccess`, which throws "No intake token was
      # provided", and `emitGeneratedData` already DEFERS a preflight failure: every stage still runs,
      # the corpus publishes, and the deferred error is rethrown so the run still exits non-zero. The
      # failure moves later; it does not disappear. A silently green run over a dead intake would be
      # strictly worse than the freeze this replaces.
      - name: Mint Intake installation token
        id: intake-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DATA_SYNC_INTAKE_APP_ID }}
          private-key: ${{ secrets.DATA_SYNC_INTAKE_PRIVATE_KEY }}
          owner: neomjs
          repositories: |
            devindex-opt-in
            devindex-opt-out
          # OptIn reads stargazers (metadata); OptOut comments on and closes issues. Nothing here
          # needs `contents`, and this token must never be able to write code anywhere — the
          # publisher/intake split exists precisely so the intake identity cannot publish.
          permission-issues: write
          permission-metadata: read

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # A dispatch resolves the WORKFLOW FILE from the chosen ref but this step decided the
          # SOURCE, and it was pinned to `dev` — so dispatching from a branch ran that branch's
          # workflow against dev's code. Every change to the pipeline was therefore untestable
          # before merge, which is a poor property for the script that publishes to dev.
          #
          # A preflight-only dispatch checks out the dispatched ref, because verifying a change
          # is the entire point of it. Scheduled runs and full dispatches stay pinned to `dev`:
          # they publish, and publishing must never emit from an unmerged branch.
          ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.preflight_only) && github.ref || 'dev' }}
          fetch-depth: 0
          # `actions/checkout` defaults this to TRUE, writing the token into `.git/config` as an
          # http.extraheader that survives for the whole job. Stripping credentials from a stage's
          # ENV therefore isolates nothing at the git layer: any collection stage could still push
          # as the Publisher — the identity this job intends to be the only one able to publish here.
          #
          # The publish path does not need it either: `dataSyncPipeline.mjs` pushes through its own
          # remote, so the credential can be absent from git config entirely and supplied per-command.
          persist-credentials: false
          # The publish push runs through the checkout credential, so it must be the Publisher
          # identity.
          #
          # Publishing ALSO depends on a branch-ruleset bypass, and that is repository configuration
          # this workflow cannot grant itself. `code scanning merge protection` requires a code-scanning
          # result, which a fresh generated commit cannot have — only a push produces one — so without a
          # bypass every publish is rejected with `GH013` regardless of which identity pushes. The
          # invariant is that the bypass exists only while the ruleset's own bypass list names this App;
          # this comment does not record whether it currently does, because that value is not ours.
          #
          # Verifying it needs the right instrument. The REST rulesets endpoint OMITS `bypass_actors`
          # entirely for App-type entries — the key is ABSENT, not empty — so a reader with a `[]`
          # default reports "nothing can bypass" whatever the truth is. Use GraphQL
          # `ruleset(databaseId:…).bypassActors.totalCount`, whose `nodes` are permission-shielded to
          # null while the count stays readable. A comment here cannot be the source of truth for a
          # setting an admin can change, so this names where to look rather than what it currently says.
          token: ${{ steps.publisher-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # All three tokens are handed to the runner, never to the stages. `scopedStageEnv` strips EVERY
      # source variable and re-injects only the one a stage is entitled to, so the publisher
      # credential is absent from every data-collection child rather than merely unused by it.
      #
      # `DATA_SYNC_READER_TOKEN` is passed under its own name rather than as `GITHUB_TOKEN`: the
      # scoping function strips `GITHUB_TOKEN`/`GH_TOKEN` from every child by design, so a token
      # arriving under either of those names would be discarded before any stage could read it.
      - name: Run bounded Data Sync emission and publish
        env:
          DATA_SYNC_INTAKE_TOKEN: ${{ steps.intake-token.outputs.token }}
          DATA_SYNC_PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
          DATA_SYNC_PUBLISHER_TOKEN: ${{ steps.publisher-token.outputs.token }}
          DATA_SYNC_READER_TOKEN: ${{ github.token }}
        run: node ./buildScripts/dataSyncPipeline.mjs

      # Guarded on the SAME input the pipeline reads. Without this, a preflight-only dispatch
      # short-circuited the pipeline and then fell straight into this step, which pushed 167 files
      # to `pages/main` (commit 189b7b8055) while the run reported "skipping collection and publish".
      # The side-effect-free claim was made about the pipeline and was silently false about the JOB:
      # a short-circuit inside one step cannot bound the steps after it, and the step list said
      # `success Push Data to neomjs/pages` in plain sight the whole time.
      - name: Push Data to neomjs/pages
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.preflight_only) }}
        env:
          PAGES_DEPLOY_PAT: ${{ secrets.PAGES_DEPLOY_PAT }}
        run: |
          if [ -z "$PAGES_DEPLOY_PAT" ]; then
            echo "Skipping push to pages: PAGES_DEPLOY_PAT secret is not set."
            exit 0
          fi

          echo "Cloning pages repository..."
          git clone https://x-access-token:${PAGES_DEPLOY_PAT}@github.com/neomjs/pages.git temp_pages

          # Ensure target directories exist
          mkdir -p temp_pages/node_modules/neo.mjs/apps/devindex/resources/data
          mkdir -p temp_pages/node_modules/neo.mjs/apps/portal/resources/data
          mkdir -p temp_pages/node_modules/neo.mjs/resources/content
          mkdir -p temp_pages/resources_pub/website/examples/devmode

          # Copy the data files
          cp apps/devindex/resources/data/users.jsonl temp_pages/node_modules/neo.mjs/apps/devindex/resources/data/

          # Portal data: deletion-synced recursive copy — the previous flat *.json glob missed the
          # chunked subdirectory trees (tickets/v*/, pulls/latest/), which drifted between full
          # deploys (#14496).
          rm -rf temp_pages/node_modules/neo.mjs/apps/portal/resources/data
          cp -r apps/portal/resources/data temp_pages/node_modules/neo.mjs/apps/portal/resources/

          # Project the Neo-owned Workstation preview without mutating the legacy
          # pages-side examples collection.
          cp apps/portal/resources/images/examples/devmode/workstation.png temp_pages/resources_pub/website/examples/devmode/workstation.png

          cp -f apps/portal/sitemap.xml temp_pages/ 2>/dev/null || true
          cp -f apps/portal/llms.txt temp_pages/ 2>/dev/null || true

          # learn/** content + nav index (learn/tree.json): sitemap.xml and llms.txt advertise these
          # routes hourly — advertising them without syncing the content they point at produced the
          # human-traffic 404 class (#14496). Deletion sync makes route renames propagate natively.
          rm -rf temp_pages/node_modules/neo.mjs/learn
          cp -r learn temp_pages/node_modules/neo.mjs/

          # Copy resources content (syncing deletions natively via git).
          # Per Epic #11187 7-bucket fan-out: support both legacy paths (issue-archive/,
          # pr-archive/) and the new single-root archive/ umbrella during the migration
          # transition. Legacy paths drop in a follow-up PR once corpus migration completes.
          # Missing-dir tolerance: each rm -rf and cp guarded so transitional state
          # (e.g., archive/ not yet populated at pre-merge or pr-archive/ post-AC8-migration
          # already removed) does not break the sync.
          for dir in issues pulls discussions issue-archive pr-archive archive; do
            rm -rf "temp_pages/node_modules/neo.mjs/resources/content/$dir"
            if [ -d "resources/content/$dir" ]; then
              cp -r "resources/content/$dir" temp_pages/node_modules/neo.mjs/resources/content/
            fi
          done

          cd temp_pages

          # Check for changes and push
          if [[ -n $(git status -s node_modules/neo.mjs/apps/devindex/resources/data/users.jsonl node_modules/neo.mjs/apps/portal/resources/data/ resources_pub/website/examples/devmode/workstation.png sitemap.xml llms.txt node_modules/neo.mjs/resources/content/ node_modules/neo.mjs/learn/) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add node_modules/neo.mjs/apps/devindex/resources/data/users.jsonl
            git add -A node_modules/neo.mjs/apps/portal/resources/data/
            git add resources_pub/website/examples/devmode/workstation.png
            git add sitemap.xml 2>/dev/null || true
            git add llms.txt 2>/dev/null || true
            git add -A node_modules/neo.mjs/resources/content/
            git add -A node_modules/neo.mjs/learn/

            # temp_pages is a clone of neomjs/pages (built output) — it carries no neo archaeology guard,
            # so NEO_SKIP_TICKET_ARCHAEOLOGY is intentionally absent here (only --no-verify, for whitespace).
            git commit --no-verify -m "chore(data): Sync data and content from neo repo [skip ci]"
            git push origin main
          else
            echo "No changes detected for pages repo."
          fi
