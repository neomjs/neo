name: Front Door Fingerprint

on:
  pull_request:
    branches: [dev]
    paths:
      - 'learn/benefits/Introduction.md'
      - 'ai/scripts/lint/check-front-door-fingerprint.mjs'
      - '.github/workflows/front-door-fingerprint.yml'
  push:
    branches: [dev]
    paths:
      - 'learn/benefits/Introduction.md'
      - 'ai/scripts/lint/check-front-door-fingerprint.mjs'
      - '.github/workflows/front-door-fingerprint.yml'

concurrency:
  group: front-door-fingerprint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-fingerprint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Check front-door integrity fingerprint (self-declaration stays true by construction)
        run: npm run ai:front-door-fingerprint
