name: Measure ESM vs Bundled (#21216)

# Reproducible HTTP/2 and HTTP/3 comparison of `dist/esm`, `dist/production`, and an `esbuild --splitting`
# probe across OS-level `tc netem` latency and loss arms on a hosted Linux runner.

on:
  workflow_dispatch:
    inputs:
      runs:
        description: 'Cold and warm runs per cell'
        required: false
        default: '5'
  pull_request:
    branches: [dev]
    paths:
      - 'buildScripts/util/measure-esm-vs-bundled.mjs'
      - 'test/playwright/unit/buildScripts/measureEsmVsBundled.spec.mjs'
      - '.github/workflows/measure-esm-vs-bundled.yml'

permissions:
  contents: read

concurrency:
  group: measure-esm-vs-bundled-${{ github.run_attempt == '1' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Caddy, iproute2 and OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y debian-keyring debian-archive-keyring apt-transport-https curl gnupg iproute2 openssl
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | sudo gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | sudo tee /etc/apt/sources.list.d/caddy-stable.list
          sudo apt-get update
          sudo apt-get install -y caddy
          caddy version

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run HTTP/2 and HTTP/3 measurement harness
        run: node buildScripts/util/measure-esm-vs-bundled.mjs --runs "${{ inputs.runs || '5' }}" --output-markdown measurement-report.md --output-json measurement-raw.json

      - name: Publish measurement summary
        if: always() && hashFiles('measurement-report.md') != ''
        run: cat measurement-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload measurement artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esm-vs-bundled-measurement
          path: |
            measurement-report.md
            measurement-raw.json
          if-no-files-found: warn
