  /mailbox/messages:
    post:
      summary: Send Message
      operationId: add_message
      x-neo-tool-tier: write
      x-pass-as-object: true
      x-neo-tool-summary: Send an A2A message to one peer or an agent broadcast.
      description: |
        Sends a message or optional Task. A successful response means the accepted message is
        durable in the message WAL; Native Edge Graph projection may still be pending and is
        completed by the WAL-backed projection drain. Wake delivery is best-effort after projection
        and is not part of the durable receipt guarantee. Task assignment is server-owned, and
        broadcasts remain unassigned until an eligible send-time recipient claims them.
      tags: [Mailbox]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - to
                - subject
                - body
              properties:
                to:
                  type: string
                  description: "Recipient Agent Identity Node ID in canonical `@<identity>` form matching a registered AgentIdentity graph node, or `'AGENT:*'` for broadcast. `AGENT:<family>/<model>` aliases resolve only when exactly one AgentIdentity matches that `modelFamily`; ambiguous or unresolvable formats reject."
                subject:
                  type: string
                body:
                  type: string
                originSessionId:
                  type: string
                relatedSessions:
                  type: array
                  items:
                    type: string
                relatedTickets:
                  type: array
                  items:
                    type: string
                inReplyTo:
                  type: string
                priority:
                  type: string
                  enum: [low, normal, high]
                  default: "normal"
                partOfThread:
                  type: string
                taggedConcepts:
                  type: array
                  items:
                    type: string
                wakeSuppressed:
                  type: boolean
                  default: false
                  description: "Persist + deliver the message but emit NO wake event — the recipient sees it on their next list_messages rather than via an interrupt. Use for awareness/FYI (e.g. PR-opened-you're-not-the-reviewer, lane-progress, acks) or session-sunset self-DM handovers. Do NOT suppress actionable messages (you're the reviewer, a lane was claimed on you, REQUEST_CHANGES) — those must wake. Known-actionable direct lifecycle messages are rejected when wakeSuppressed is true. In autonomous mode a suppressed message stays unseen until the recipient next lists/boots. Default: omit (= false)."
                task:
                  type: object
                  additionalProperties: true
                  description: "Optional A2A Task envelope (https://a2a-protocol.org/latest/specification/) for structured agent coordination. Omit for free-form markdown messages. The server clones the envelope and overwrites `assignee`; callers cannot select or mutate the owner."
                  properties:
                    id:
                      type: string
                      description: Optional Task-level identifier carried inside the MESSAGE envelope.
                    state:
                      type: string
                      enum: [Submitted, Working, InputRequired, Completed, Canceled, Failed, Rejected, AuthRequired, Unknown, Expired, Blocked]
                      description: Initial A2A Task state per the A2A Protocol plus Neo's Blocked extension.
                    assignee:
                      type: string
                      nullable: true
                      readOnly: true
                      description: "Server-owned canonical AgentIdentity owner. Direct Tasks bind immediately; broadcasts begin null and bind atomically to the first eligible DELIVERED_TO claimant. Caller input is overwritten."
                    expiresAt:
                      type: string
                      format: date-time
                      description: Optional expiry time consumed by the Task TTL sweeper.
      responses:
        '200':
          description: Message accepted durably in the WAL; projectionStatus may remain pending while derived graph projection completes.
          content:
            application/json:
              schema:
                type: object
                required: [messageId, sentAt, priority, status, projectionStatus]
                properties:
                  messageId:
                    type: string
                  sentAt:
                    type: string
                    format: date-time
                  priority:
                    type: string
                    nullable: true
                  status:
                    type: string
                    enum: [sent]
                  projectionStatus:
                    type: string
                    enum: [pending]
        '500':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List Messages
      operationId: list_messages
      x-neo-tool-tier: read
      x-pass-as-object: true
      x-neo-tool-summary: List one PAGE of A2A mailbox messages, newest-first.
      description: |
        Returns a page, not a set. Use `totalCount` / `truncated` / `nextOffset` to tell a complete
        answer from a truncated one — an empty `messages` array proves absence only when
        `totalCount` is 0. To establish that a message does not exist, paginate to the end or read
        `totalCount`; a newest-first window cannot answer that question on its own.
      tags: [Mailbox]
      parameters:
        - name: box
          in: query
          required: false
          description: "Which box to list ('inbox', 'outbox', 'all')"
          schema:
            type: string
            enum: [inbox, outbox, all]
            default: "inbox"
        - name: status
          in: query
          required: false
          description: "Message read status ('all', 'read', 'unread')"
          schema:
            type: string
            enum: [all, read, unread]
            default: "all"
        - name: to
          in: query
          required: false
          description: "Target identity to list messages for (defaults to caller)"
          schema:
            type: string
        - name: threadId
          in: query
          required: false
          description: "Filter by specific thread"
          schema:
            type: string
        - name: fromIdentity
          in: query
          required: false
          description: |
            Filter by specific sender identity. Named `fromIdentity` rather than `from` to avoid
            the anti-spoof reserved-key collision in `AuthMiddleware` — `from` is a
            claim-of-authorship key blocked at the callTool choke-point, whereas this parameter
            is a read-path filter with no authorship semantics. Renamed per #10174.
          schema:
            type: string
        - name: taggedConcepts
          in: query
          required: false
          description: "Filter by specific tagged concepts (requires all)"
          schema:
            type: array
            items:
              type: string
        - name: limit
          in: query
          required: false
          description: "Page size. Must be a positive integer — a zero or negative page cannot advance a continuation, so it is refused rather than clamped."
          schema:
            type: integer
            minimum: 1
            default: 50
        - name: offset
          in: query
          required: false
          description: "Pagination offset. Must be a non-negative integer; pass the previous response's `nextOffset` to continue."
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: includeArchived
          in: query
          required: false
          description: |
            Surface archived messages (#10148). Default excludes any message whose `archivedAt` is set (on the MESSAGE node for direct DMs OR on the per-recipient `DELIVERED_TO` edge for broadcasts) — archived ≠ deleted; the message persists but is hidden from the default inbox view. Retracted messages (sender-side `delete_message`) are NOT filtered — they surface with the `'[retracted by sender]'` placeholder so thread context remains coherent.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [messages, totalCount, truncated, nextOffset, limit, offset]
                properties:
                  _channelSeparation:
                    type: string
                    description: "Security annotation marking the payload as DATA, not executable COMMANDS."
                  messages:
                    type: array
                    description: "At most `limit` rows, newest-first. This is a page; its emptiness proves absence only when `totalCount` is 0."
                    items:
                      type: object
                  totalCount:
                    type: integer
                    description: "Rows matching the applied filter BEFORE pagination."
                  truncated:
                    type: boolean
                    description: "Rows remain beyond this page. False on a page that exactly exhausts the filter, so it never advertises an empty continuation."
                  nextOffset:
                    type: integer
                    nullable: true
                    description: "Offset to continue from, or null when `truncated` is false."
                  limit:
                    type: integer
                    description: "Limit actually applied, so a pasted receipt carries its own depth."
                  offset:
                    type: integer
                    description: "Offset actually applied."
        '500':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

