name: Review Admission Mergeability

on:
  # Ordinary `pull_request` workflows do NOT run when the PR is conflicted. This controller runs
  # trusted `dev` workflow code, never checks out the PR, and publishes only a source-read status.
  pull_request_target:
    branches: [dev]
    types: [opened, reopened, synchronize, ready_for_review]
  # Mergeability is a head+base relation. A `dev` merge can invalidate an unchanged PR head, so
  # every base movement must re-evaluate the whole open dev-target set. A merge IS such a push, so
  # the PR's own `closed` event is not a trigger: a `pull_request_target` run anchors its check runs
  # on the event PR's head, and a sweep anchored on a merged head leaves its red there.
  push:
    branches: [dev]
  # Hourly Data Sync commits intentionally carry `[skip ci]`, which suppresses `push` workflows.
  # Its trusted completion is the non-skippable signal for the canonical measured skipped writer.
  workflow_run:
    workflows: [Data Sync Pipeline]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  publish:
    name: "${{ github.event_name == 'pull_request_target' && format('PR #{0} mergeability', github.event.pull_request.number) || 'Publish open dev PR mergeability' }}"
    runs-on: ubuntu-latest
    concurrency:
      # `pr-<N>` serializes same-PR `pull_request_target` runs; `board` serializes base-movement sweeps
      # without blocking unrelated PR events. Cancellation is not a write fence (an in-flight status
      # POST can land after a cancelled run exits), so `cancel-in-progress` stays false. Because a
      # `pr-<N>` run and a `board` sweep do not share a concurrency key, every status write rechecks
      # `(headRefOid, refs/heads/dev tip)` immediately before and after `createCommitStatus`.
      group: review-admission-mergeability-${{ github.event_name == 'pull_request_target' && format('pr-{0}', github.event.pull_request.number) || 'board' }}
      cancel-in-progress: false
    steps:
      - name: Publish live head mergeability
        uses: actions/github-script@v9
        env:
          MERGEABILITY_API_RETRIES: '2'
          MERGEABILITY_API_RETRY_DELAY_MS: '1000'
          MERGEABILITY_CONCURRENCY: '4'
          MERGEABILITY_MAX_RESTARTS: '3'
          MERGEABILITY_POLL_ATTEMPTS: '7'
          MERGEABILITY_POLL_DELAY_MS: '2000'
          MERGEABILITY_POLL_MAX_DELAY_MS: '30000'
          MERGEABILITY_REST_WAKE_BATCH: '32'
          MERGEABILITY_REST_WAKE_BUDGET: '64'
        with:
          retries: 3
          script: |
            const baseBranch       = 'dev';
            const qualifiedBaseRef = 'refs/heads/dev';
            const contextKey       = 'review-admission/mergeability';
            const maxApiRetries    = Math.max(0, Number(process.env.MERGEABILITY_API_RETRIES ?? 2));
            const apiRetryDelayMs  = Math.max(0, Number(process.env.MERGEABILITY_API_RETRY_DELAY_MS ?? 1000));
            const concurrency      = Math.max(1, Number(process.env.MERGEABILITY_CONCURRENCY) || 4);
            const maxRestarts      = Math.max(0, Number(process.env.MERGEABILITY_MAX_RESTARTS ?? 3));
            const maxPolls         = Math.max(1, Number(process.env.MERGEABILITY_POLL_ATTEMPTS) || 7);
            const delayMs          = Math.max(0, Number(process.env.MERGEABILITY_POLL_DELAY_MS ?? 2000));
            const maxDelayMs       = Math.max(0, Number(process.env.MERGEABILITY_POLL_MAX_DELAY_MS) || 30000);
            const restWakeBatch    = Math.max(0, Number(process.env.MERGEABILITY_REST_WAKE_BATCH ?? 32));
            let   restWakeBudget   = Math.max(0, Number(process.env.MERGEABILITY_REST_WAKE_BUDGET ?? 64));

            const sleep  = ms => new Promise(resolve => setTimeout(resolve, ms));
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            const metrics = {
              graphqlCalls: 0,
              graphqlCost : 0,
              restReads   : 0,
              retries     : 0,
              statusReads : 0,
              statusWrites: 0
            };

            const formatMetrics = () =>
              `graphqlCalls=${metrics.graphqlCalls} graphqlCost=${metrics.graphqlCost} ` +
              `restReads=${metrics.restReads} statusReads=${metrics.statusReads} ` +
              `statusWrites=${metrics.statusWrites} retries=${metrics.retries}`;

            class ControllerSourceError extends Error {}
            class PullInactive extends Error {}

            const BOARD_QUERY = `
              query ReviewAdmissionBoard(
                $owner: String!,
                $repo: String!,
                $base: String!,
                $qualifiedBase: String!,
                $cursor: String,
                $contextKey: String!
              ) {
                rateLimit { cost remaining }
                repository(owner: $owner, name: $repo) {
                  ref(qualifiedName: $qualifiedBase) {
                    target { oid }
                  }
                  pullRequests(
                    states: OPEN,
                    baseRefName: $base,
                    first: 100,
                    after: $cursor,
                    orderBy: {field: CREATED_AT, direction: ASC}
                  ) {
                    totalCount
                    pageInfo { hasNextPage endCursor }
                    nodes {
                      number
                      state
                      isDraft
                      baseRefName
                      headRefOid
                      mergeable
                      commits(last: 1) {
                        nodes {
                          commit {
                            status {
                              context(name: $contextKey) { state }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const SINGLE_PR_QUERY = `
              query ReviewAdmissionSingle(
                $owner: String!,
                $repo: String!,
                $number: Int!,
                $qualifiedBase: String!,
                $contextKey: String!
              ) {
                rateLimit { cost remaining }
                repository(owner: $owner, name: $repo) {
                  ref(qualifiedName: $qualifiedBase) {
                    target { oid }
                  }
                  pullRequest(number: $number) {
                    number
                    state
                    isDraft
                    baseRefName
                    headRefOid
                    mergeable
                    commits(last: 1) {
                      nodes {
                        commit {
                          status {
                            context(name: $contextKey) { state }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const sameCoordinate = (left, right) => left.head === right.head && left.base === right.base;

            const normalizeMergeable = raw => {
              if (raw === 'MERGEABLE' || raw === true) {
                return true;
              }
              if (raw === 'CONFLICTING' || raw === false) {
                return false;
              }
              if (raw === 'UNKNOWN' || raw === null) {
                return null;
              }
              throw new ControllerSourceError(`Unsupported mergeable value: ${JSON.stringify(raw)}`);
            };

            const normalizeStatusState = raw => {
              if (typeof raw !== 'string' || raw.length === 0) {
                return null;
              }
              return raw.toLowerCase();
            };

            const parsePrNode = (node, devTip) => {
              const prNumber = node?.number;

              if (!Number.isInteger(prNumber)) {
                throw new ControllerSourceError('GraphQL pull-request node omitted integer number.');
              }

              const state       = typeof node.state === 'string' ? node.state.toUpperCase() : '';
              const baseRefName = node.baseRefName;

              if (state !== 'OPEN') {
                return {active: false, number: prNumber, reason: `PR #${prNumber} is ${state.toLowerCase() || 'closed'}; no mergeability status after close.`};
              }

              if (baseRefName !== baseBranch) {
                return {active: false, number: prNumber, reason: `PR #${prNumber} targets ${baseRefName || 'another branch'}, not ${baseBranch}; skipping status write.`};
              }

              if (typeof node.headRefOid !== 'string' || node.headRefOid.length === 0) {
                throw new ControllerSourceError(`PR #${prNumber} omitted headRefOid.`);
              }

              const commitNodes    = node.commits?.nodes;
              const statusContext  = Array.isArray(commitNodes) && commitNodes.length > 0
                ? commitNodes[commitNodes.length - 1]?.commit?.status?.context
                : null;
              const publishedState = normalizeStatusState(statusContext?.state);

              return {
                active        : true,
                baseRefName,
                coordinate    : {head: node.headRefOid, base: devTip},
                head          : node.headRefOid,
                isDraft       : Boolean(node.isDraft),
                mergeable     : normalizeMergeable(node.mergeable),
                number        : prNumber,
                publishedState
              };
            };

            const withBoundedRetry = async(label, operation) => {
              let lastError;

              for (let attempt = 0; attempt <= maxApiRetries; attempt++) {
                if (attempt > 0) {
                  metrics.retries++;
                  if (apiRetryDelayMs > 0) {
                    await sleep(Math.min(apiRetryDelayMs * (2 ** (attempt - 1)), maxDelayMs));
                  }
                }

                try {
                  return await operation();
                } catch (error) {
                  if (error instanceof PullInactive) {
                    throw error;
                  }
                  lastError = error;
                }
              }

              throw new ControllerSourceError(`${label} failed after ${maxApiRetries + 1} attempt(s): ${lastError?.message || lastError}`);
            };

            const runGraphql = async(label, query, variables) => withBoundedRetry(label, async() => {
              if (typeof github.graphql !== 'function') {
                throw new ControllerSourceError('github.graphql client is unavailable.');
              }

              const response = await github.graphql(query, variables);
              metrics.graphqlCalls++;
              metrics.graphqlCost += Number(response?.rateLimit?.cost ?? 1);

              if (Array.isArray(response?.errors) && response.errors.length > 0) {
                const detail = response.errors.map(err => err?.message || 'GraphQL error').join('; ');
                throw new ControllerSourceError(`GraphQL response carried errors: ${detail}`);
              }

              return response;
            });

            const readSinglePr = async prNumber => {
              const response = await runGraphql(`PR #${prNumber} GraphQL read`, SINGLE_PR_QUERY, {
                contextKey,
                number       : prNumber,
                owner        : context.repo.owner,
                qualifiedBase: qualifiedBaseRef,
                repo         : context.repo.repo
              });

              const devTip = response?.repository?.ref?.target?.oid;

              if (typeof devTip !== 'string' || devTip.length === 0) {
                throw new ControllerSourceError(`Repository ref ${qualifiedBaseRef} omitted target oid.`);
              }

              const node = response?.repository?.pullRequest;

              if (!node) {
                throw new ControllerSourceError(`PR #${prNumber} was not returned by GraphQL.`);
              }

              const parsed = parsePrNode(node, devTip);

              if (!parsed.active) {
                throw new PullInactive(parsed.reason);
              }

              return {...parsed, devTip};
            };

            const readBoardSnapshot = async() => {
              const byNumber      = new Map();
              const inactiveNotes = [];
              let   cursor        = null;
              let   devTip        = null;
              let   pages         = 0;

              while (true) {
                pages++;
                if (pages > 50) {
                  throw new ControllerSourceError('Board GraphQL pagination exceeded 50 pages (5,000 open PRs).');
                }

                const response = await runGraphql(`Board GraphQL page ${pages}`, BOARD_QUERY, {
                  base         : baseBranch,
                  contextKey,
                  cursor,
                  owner        : context.repo.owner,
                  qualifiedBase: qualifiedBaseRef,
                  repo         : context.repo.repo
                });

                const pageTip = response?.repository?.ref?.target?.oid;

                if (typeof pageTip !== 'string' || pageTip.length === 0) {
                  throw new ControllerSourceError(`Repository ref ${qualifiedBaseRef} omitted target oid.`);
                }

                if (devTip === null) {
                  devTip = pageTip;
                } else if (pageTip !== devTip) {
                  return {baseMoved: true, devTip: pageTip, pulls: []};
                }

                const connection = response?.repository?.pullRequests;
                const nodes      = connection?.nodes;
                const pageInfo   = connection?.pageInfo;

                if (!Array.isArray(nodes) || !pageInfo || typeof pageInfo.hasNextPage !== 'boolean') {
                  throw new ControllerSourceError(`Board GraphQL page ${pages} omitted pull-request nodes or pageInfo.`);
                }

                if (nodes.some(node => !node)) {
                  throw new ControllerSourceError(`Board GraphQL page ${pages} contained null pull-request nodes.`);
                }

                if (pages === 1 && !pageInfo.hasNextPage && Number.isInteger(connection.totalCount) && nodes.length < connection.totalCount) {
                  throw new ControllerSourceError(
                    `Board GraphQL page 1 returned ${nodes.length} of ${connection.totalCount} PRs with hasNextPage=false.`
                  );
                }

                for (const node of nodes) {
                  const parsed = parsePrNode(node, devTip);

                  if (parsed.active) {
                    byNumber.set(parsed.number, parsed);
                  } else {
                    inactiveNotes.push(parsed.reason);
                  }
                }

                if (!pageInfo.hasNextPage) {
                  break;
                }

                if (typeof pageInfo.endCursor !== 'string' || pageInfo.endCursor.length === 0) {
                  throw new ControllerSourceError(`Board GraphQL page ${pages} reported hasNextPage=true without endCursor.`);
                }

                cursor = pageInfo.endCursor;
              }

              return {
                baseMoved: false,
                devTip,
                inactiveNotes,
                pulls    : [...byNumber.values()]
              };
            };

            const wakePullViaRest = async prNumber => {
              if (restWakeBudget <= 0 || typeof github.rest?.pulls?.get !== 'function') {
                return null;
              }

              restWakeBudget--;

              return withBoundedRetry(`PR #${prNumber} REST wakeup`, async() => {
                metrics.restReads++;
                const response = await github.rest.pulls.get({
                  owner      : context.repo.owner,
                  pull_number: prNumber,
                  repo       : context.repo.repo
                });
                return response?.data || null;
              });
            };

            const writeCommitStatus = async(headSha, state, description) =>
              withBoundedRetry(`Commit status write (${state} on ${headSha.slice(0, 10)})`, async() => {
                await github.rest.repos.createCommitStatus({
                  context    : contextKey,
                  description,
                  owner      : context.repo.owner,
                  repo       : context.repo.repo,
                  sha        : headSha,
                  state,
                  target_url : runUrl
                });
                metrics.statusWrites++;
              });

            const descriptionForBoolean = mergeable => mergeable
              ? 'Mergeable with current dev base'
              : 'Conflicts with current dev base; author rebase required';

            const pendingHoldDescription = 'Mergeability still computing; recovers on bounded retry, next dev push, or workflow_dispatch';

            const publishVerifiedBoolean = async(prNumber, expectedCoordinate) => {
              const verified = await readSinglePr(prNumber);

              if (!sameCoordinate(expectedCoordinate, verified.coordinate)) {
                return {outcome: 'moved', observed: verified};
              }

              if (verified.mergeable === null) {
                return {outcome: 'unknown', observed: verified};
              }

              const state = verified.mergeable ? 'success' : 'failure';

              if (verified.publishedState !== state) {
                await writeCommitStatus(verified.head, state, descriptionForBoolean(verified.mergeable));
              } else {
                core.info(`PR #${prNumber} already publishes ${contextKey}=${state}; no duplicate status.`);
              }

              const postWrite = await readSinglePr(prNumber);

              if (!sameCoordinate(expectedCoordinate, postWrite.coordinate)) {
                return {outcome: 'moved', observed: postWrite};
              }

              if (postWrite.mergeable === null) {
                return {outcome: 'unknown', observed: postWrite};
              }

              const postState = postWrite.mergeable ? 'success' : 'failure';

              if (postWrite.publishedState !== null && postWrite.publishedState !== postState) {
                return {outcome: 'moved', observed: postWrite};
              }

              return {outcome: 'settled', observed: postWrite, state: postState};
            };

            const publishPendingHold = async(prNumber, expectedCoordinate) => {
              const verified = await readSinglePr(prNumber);

              if (!sameCoordinate(expectedCoordinate, verified.coordinate)) {
                return {outcome: 'moved', observed: verified};
              }

              if (verified.mergeable !== null) {
                return publishVerifiedBoolean(prNumber, verified.coordinate);
              }

              if (verified.publishedState !== 'pending') {
                await writeCommitStatus(verified.head, 'pending', pendingHoldDescription);
              }

              const postWrite = await readSinglePr(prNumber);

              if (!sameCoordinate(expectedCoordinate, postWrite.coordinate)) {
                return {outcome: 'moved', observed: postWrite};
              }

              return {outcome: 'pending', observed: postWrite};
            };

            const runPool = async(items, workerFn) => {
              let index       = 0;
              const poolCount = Math.min(concurrency, items.length);

              await Promise.all(
                Array.from({length: poolCount}, async() => {
                  while (index < items.length) {
                    const item = items[index++];
                    await workerFn(item);
                  }
                })
              );
            };

            const evaluateSingleEventPr = async prNumber => {
              let wokenCoordinateKey = null;

              try {
                for (let restart = 0; restart <= maxRestarts; restart++) {
                  const seed       = await readSinglePr(prNumber);
                  const coordinate = seed.coordinate;

                  if (seed.mergeable !== null) {
                    const desired = seed.mergeable ? 'success' : 'failure';

                    if (seed.publishedState === desired) {
                      core.info(`PR #${prNumber} already publishes ${contextKey}=${desired}; no duplicate status. (${formatMetrics()})`);
                      return;
                    }

                    const result = await publishVerifiedBoolean(prNumber, coordinate);

                    if (result.outcome === 'settled') {
                      core.info(`PR #${prNumber} converged on ${result.state}. (${formatMetrics()})`);
                      return;
                    }

                    if (result.outcome === 'moved') {
                      continue;
                    }
                  }

                  let coordinateMoved = false;

                  for (let poll = 1; poll < maxPolls; poll++) {
                    if (delayMs > 0) {
                      await sleep(Math.min(delayMs * (2 ** (poll - 1)), maxDelayMs));
                    }

                    const observed = await readSinglePr(prNumber);

                    if (!sameCoordinate(coordinate, observed.coordinate)) {
                      coordinateMoved = true;
                      break;
                    }

                    if (observed.mergeable === null) {
                      const coordKey = `${observed.head}:${observed.devTip}`;

                      if (wokenCoordinateKey !== coordKey) {
                        wokenCoordinateKey = coordKey;
                        const restData     = await wakePullViaRest(prNumber);

                        if (typeof restData?.mergeable === 'boolean') {
                          const wokeResult = await publishVerifiedBoolean(prNumber, coordinate);

                          if (wokeResult.outcome === 'settled') {
                            core.info(`PR #${prNumber} converged on ${wokeResult.state} after REST wakeup. (${formatMetrics()})`);
                            return;
                          }

                          if (wokeResult.outcome === 'moved') {
                            coordinateMoved = true;
                            break;
                          }
                        }
                      }

                      continue;
                    }

                    const result = await publishVerifiedBoolean(prNumber, coordinate);

                    if (result.outcome === 'settled') {
                      core.info(`PR #${prNumber} converged on ${result.state}. (${formatMetrics()})`);
                      return;
                    }

                    if (result.outcome === 'moved') {
                      coordinateMoved = true;
                      break;
                    }
                  }

                  if (coordinateMoved) {
                    continue;
                  }

                  const holdResult = await publishPendingHold(prNumber, coordinate);

                  if (holdResult.outcome === 'settled') {
                    core.info(`PR #${prNumber} resolved to ${holdResult.state} on final check. (${formatMetrics()})`);
                    return;
                  }

                  if (holdResult.outcome === 'moved') {
                    continue;
                  }

                  core.warning(
                    `PR #${prNumber} mergeability stayed UNKNOWN after ${maxPolls} polls; ${pendingHoldDescription}. (${formatMetrics()})`
                  );
                  return;
                }

                core.setFailed(
                  `PR #${prNumber} head/dev-tip moved through ${maxRestarts + 1} bounded coordinates without settling; ` +
                  `recovers on next dev push or workflow_dispatch. (${formatMetrics()})`
                );
              } catch (error) {
                if (error instanceof PullInactive) {
                  core.info(`${error.message} (${formatMetrics()})`);
                  return;
                }

                core.setFailed(
                  `PR #${prNumber} mergeability controller condition: ${error.message}. ` +
                  `No false failure published; recovers on bounded retry, next dev push, or workflow_dispatch. (${formatMetrics()})`
                );
              }
            };

            const evaluateBoard = async() => {
              const wokenKeys = new Set();

              try {
                for (let restart = 0; restart <= maxRestarts; restart++) {
                  let activeDevTip     = null;
                  let baseMoved        = false;
                  let lastUnknownPulls = [];
                  const settledHeads   = new Map();
                  const controllerErrs = [];

                  for (let poll = 0; poll < maxPolls; poll++) {
                    if (poll > 0 && delayMs > 0) {
                      await sleep(Math.min(delayMs * (2 ** (poll - 1)), maxDelayMs));
                    }

                    const snapshot = await readBoardSnapshot();

                    if (snapshot.baseMoved) {
                      baseMoved = true;
                      break;
                    }

                    for (const note of snapshot.inactiveNotes) {
                      core.info(note);
                    }

                    if (snapshot.pulls.length === 0) {
                      core.info(`No open ${baseBranch} pull requests require mergeability publication. (${formatMetrics()})`);
                      return;
                    }

                    if (activeDevTip === null) {
                      activeDevTip = snapshot.devTip;
                    } else if (snapshot.devTip !== activeDevTip) {
                      baseMoved = true;
                      break;
                    }

                    const writesNeeded = [];
                    const unknownPulls = [];

                    for (const pull of snapshot.pulls) {
                      if (pull.mergeable === null) {
                        unknownPulls.push(pull);
                        continue;
                      }

                      const desired = pull.mergeable ? 'success' : 'failure';

                      if (pull.publishedState === desired || settledHeads.get(pull.number) === `${pull.head}:${desired}`) {
                        settledHeads.set(pull.number, `${pull.head}:${desired}`);
                        continue;
                      }

                      writesNeeded.push(pull);
                    }

                    if (writesNeeded.length > 0) {
                      await runPool(writesNeeded, async pull => {
                        if (baseMoved) {
                          return;
                        }

                        try {
                          const result = await publishVerifiedBoolean(pull.number, pull.coordinate);

                          if (result.outcome === 'settled') {
                            settledHeads.set(pull.number, `${result.observed.head}:${result.state}`);
                          } else if (result.outcome === 'moved' && result.observed.devTip !== activeDevTip) {
                            baseMoved = true;
                          } else if (result.outcome === 'unknown') {
                            unknownPulls.push(result.observed);
                          }
                        } catch (error) {
                          if (error instanceof PullInactive) {
                            core.info(error.message);
                            return;
                          }
                          controllerErrs.push(`#${pull.number}: ${error.message}`);
                        }
                      });
                    }

                    if (baseMoved) {
                      break;
                    }

                    lastUnknownPulls = unknownPulls;

                    if (unknownPulls.length === 0) {
                      if (controllerErrs.length > 0) {
                        core.setFailed(
                          `Board mergeability controller encountered ${controllerErrs.length} per-PR condition(s): ` +
                          `${controllerErrs.join('; ')}. Recovers on next dev push or workflow_dispatch. (${formatMetrics()})`
                        );
                        return;
                      }

                      core.info(
                        `Board mergeability current across ${snapshot.pulls.length} open ${baseBranch} PR(s) at ${activeDevTip.slice(0, 10)}. (${formatMetrics()})`
                      );
                      return;
                    }

                    if (poll >= 1 && restWakeBudget > 0 && restWakeBatch > 0) {
                      const prioritized = [
                        ...unknownPulls.filter(pr => !pr.isDraft),
                        ...unknownPulls.filter(pr => pr.isDraft)
                      ].filter(pr => !wokenKeys.has(`${pr.number}:${pr.head}:${activeDevTip}`))
                       .slice(0, Math.min(restWakeBatch, restWakeBudget));

                      if (prioritized.length > 0) {
                        await runPool(prioritized, async pull => {
                          if (baseMoved) {
                            return;
                          }

                          wokenKeys.add(`${pull.number}:${pull.head}:${activeDevTip}`);

                          try {
                            const restData = await wakePullViaRest(pull.number);

                            if (typeof restData?.mergeable === 'boolean') {
                              const wokeResult = await publishVerifiedBoolean(pull.number, pull.coordinate);

                              if (wokeResult.outcome === 'settled') {
                                settledHeads.set(pull.number, `${wokeResult.observed.head}:${wokeResult.state}`);
                              } else if (wokeResult.outcome === 'moved' && wokeResult.observed.devTip !== activeDevTip) {
                                baseMoved = true;
                              }
                            }
                          } catch (error) {
                            if (error instanceof PullInactive) {
                              core.info(error.message);
                              return;
                            }
                            controllerErrs.push(`#${pull.number}: ${error.message}`);
                          }
                        });

                        if (baseMoved) {
                          break;
                        }

                        lastUnknownPulls = unknownPulls.filter(pull => !settledHeads.has(pull.number));

                        if (lastUnknownPulls.length === 0 && controllerErrs.length === 0) {
                          core.info(
                            `Board mergeability current across ${snapshot.pulls.length} open ${baseBranch} PR(s) after REST wakeup at ${activeDevTip.slice(0, 10)}. (${formatMetrics()})`
                          );
                          return;
                        }
                      }
                    }
                  }

                  if (baseMoved) {
                    continue;
                  }

                  const remainingUnknown = lastUnknownPulls.filter(pull => !settledHeads.has(pull.number));

                  await runPool(remainingUnknown, async pull => {
                    if (baseMoved) {
                      return;
                    }

                    try {
                      const holdResult = await publishPendingHold(pull.number, pull.coordinate);

                      if (holdResult.outcome === 'settled') {
                        settledHeads.set(pull.number, `${holdResult.observed.head}:${holdResult.state}`);
                      } else if (holdResult.outcome === 'moved' && holdResult.observed.devTip !== activeDevTip) {
                        baseMoved = true;
                      }
                    } catch (error) {
                      if (error instanceof PullInactive) {
                        core.info(error.message);
                        return;
                      }
                      controllerErrs.push(`#${pull.number}: ${error.message}`);
                    }
                  });

                  if (baseMoved) {
                    continue;
                  }

                  const stillPending = remainingUnknown
                    .filter(pull => !settledHeads.has(pull.number))
                    .map(pull => `#${pull.number}`);

                  if (stillPending.length === 0 && controllerErrs.length === 0) {
                    core.info(`Board mergeability settled on final verification pass. (${formatMetrics()})`);
                    return;
                  }

                  const reasons = [];
                  if (stillPending.length > 0) {
                    reasons.push(`${stillPending.length} PR(s) stayed UNKNOWN (${stillPending.join(', ')})`);
                  }
                  if (controllerErrs.length > 0) {
                    reasons.push(`controller errors: ${controllerErrs.join('; ')}`);
                  }

                  core.setFailed(
                    `Board mergeability incomplete: ${reasons.join(' | ')}. ` +
                    `Unresolved heads stay pending (never false failure); recovers on next dev push or workflow_dispatch. (${formatMetrics()})`
                  );
                  return;
                }

                core.setFailed(
                  `Repository ${qualifiedBaseRef} moved through ${maxRestarts + 1} bounded board sweeps without settling; ` +
                  `recovers on next dev push or workflow_dispatch. (${formatMetrics()})`
                );
              } catch (error) {
                core.setFailed(
                  `Open ${baseBranch} PR mergeability controller condition: ${error.message}. ` +
                  `No author-side failure published; recovers on bounded retry, next dev push, or workflow_dispatch. (${formatMetrics()})`
                );
              }
            };

            if (context.eventName === 'pull_request_target') {
              const eventPr = context.payload.pull_request?.number;

              if (!Number.isInteger(eventPr)) {
                core.setFailed('pull_request_target payload omitted the pull-request number.');
                return;
              }

              await evaluateSingleEventPr(eventPr);
            } else {
              await evaluateBoard();
            }
