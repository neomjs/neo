name: Guard CI Parity

# Consolidated CI mirror for the repository's `.husky/pre-commit` / `lint-staged` guards and fast
# repo-local `buildScripts/util/check-*.mjs` checks. Running checkout, Node setup, and
# `npm ci --ignore-scripts` once in a single runner job instead of booting 12 separate workflows
# preserves every guard's exact execution contract (`check-guard-ci-parity.mjs`) and watched path
# surface (`ScanSurfaceAlignment.spec.mjs`) while saving up to 11 runner slots per pull request.
on:
  pull_request:
    branches: [dev]
    paths:
      - 'package.json'
      - '.husky/pre-commit'
      - '.github/workflows/**'
      - '.github/*.md'
      - '.github/**/*.md'
      - '*.md'
      - 'learn/**'
      - 'src/**/*.mjs'
      - 'apps/**/*.mjs'
      - 'docs/app/**/*.mjs'
      - 'examples/**'
      - 'resources/scss/**/*.scss'
      - 'resources/scss/theme-neo-dark/apps/workstation/**'
      - 'resources/scss/theme-neo-light/apps/workstation/**'
      - 'resources/scss/src/apps/workstation/**'
      - 'test/playwright/unit/**/*.mjs'
      - 'test/playwright/component/**/*.mjs'
      - 'test/playwright/e2e/**/*.mjs'
      - 'buildScripts/**/*.mjs'
      - 'buildScripts/util/check-guard-ci-parity.mjs'
      - 'buildScripts/util/check-guard-ci-parity-registry.json'
      - 'buildScripts/util/check-class-module-scope-baseline.json'
      - 'buildScripts/util/check-content-root-derivations-baseline.json'
      - 'buildScripts/util/check-engine-brain-boundary-baseline.json'
      - 'buildScripts/util/check-fixed-sleeps-baseline.json'
      - 'buildScripts/util/check-theme-value-files-baseline.json'
  push:
    branches: [dev]
    paths:
      - 'package.json'
      - '.husky/pre-commit'
      - '.github/workflows/**'
      - '.github/*.md'
      - '.github/**/*.md'
      - '*.md'
      - 'learn/**'
      - 'src/**/*.mjs'
      - 'apps/**/*.mjs'
      - 'docs/app/**/*.mjs'
      - 'examples/**'
      - 'resources/scss/**/*.scss'
      - 'resources/scss/theme-neo-dark/apps/workstation/**'
      - 'resources/scss/theme-neo-light/apps/workstation/**'
      - 'resources/scss/src/apps/workstation/**'
      - 'test/playwright/unit/**/*.mjs'
      - 'test/playwright/component/**/*.mjs'
      - 'test/playwright/e2e/**/*.mjs'
      - 'buildScripts/**/*.mjs'
      - 'buildScripts/util/check-guard-ci-parity.mjs'
      - 'buildScripts/util/check-guard-ci-parity-registry.json'
      - 'buildScripts/util/check-class-module-scope-baseline.json'
      - 'buildScripts/util/check-content-root-derivations-baseline.json'
      - 'buildScripts/util/check-engine-brain-boundary-baseline.json'
      - 'buildScripts/util/check-fixed-sleeps-baseline.json'
      - 'buildScripts/util/check-theme-value-files-baseline.json'

concurrency:
  group: guard-ci-parity-lint-${{ github.run_attempt == '1' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies (acorn, catharsis, js-yaml)
        run: npm ci --ignore-scripts

      - name: Lint hook-CI guard parity
        run: node buildScripts/util/check-guard-ci-parity.mjs

      - name: Keep class logic where a subclass, a mixin or Neo.overwrites can reach it
        run: node ./buildScripts/util/check-class-module-scope.mjs

      - name: Check no new path into resources/content
        run: node ./buildScripts/util/check-content-root-derivations.mjs

      - name: Check engine does not import the Brain
        run: node ./buildScripts/util/check-engine-brain-boundary.mjs

      - name: Require fixed second-scale waits to name what they wait for
        run: node ./buildScripts/util/check-fixed-sleeps.mjs

      - name: Lint JSDoc type expressions (docs-build parser check-mode)
        run: node ./buildScripts/util/check-jsdoc-types.mjs

      - name: Check relative links in the guides and the entry docs
        run: npm run check-relative-links

      - name: Check theme coverage (whole tree)
        run: node buildScripts/util/check-theme-coverage.mjs

      - name: Require theme value files to declare variables, never selectors
        run: node ./buildScripts/util/check-theme-value-files.mjs

      - name: Check examples/ is Body-only
        run: npm run check-examples-body-only

      - name: Check Workstation skin parity and token-only views
        run: npm run check-theme-surfaces

      - name: Check front-door integrity fingerprint
        run: node ./buildScripts/util/check-front-door-fingerprint.mjs
