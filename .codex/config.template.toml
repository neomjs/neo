# Copy this file to .codex/config.toml for local Codex MCP setup.
# Keep .codex/config.toml untracked: it can contain machine-local paths,
# trust-level overrides, and environment-specific MCP settings.

# Codex project-doc discovery loads at most one instruction file per directory:
# AGENTS.override.md, then AGENTS.md, then configured fallbacks. Since the repo
# root owns AGENTS.md, .codex/CODEX.md is a reference file, not an auto-loaded
# fallback. The hooks file that used to inject it left the Engine in the Agent OS
# split (c623b2f63c) and has no replacement here yet, so treat CODEX.md as
# reference material you open rather than context you are guaranteed to receive.
project_doc_max_bytes = 131072

# Repo-local shell command execpolicy lives in .codex/rules/pr-lifecycle.rules.
# Do not add invented command allow/deny keys to this template.

# Neo.mjs marathon sessions routinely exceed Codex's conservative default effective
# context budget. As of April 2026, GPT-5.5 / GPT-5.4 expose 1M-token context
# windows, so keep compaction late enough for architectural continuity while
# reserving headroom for output and reasoning tokens.
#
# If you switch this local config to a smaller model (for example a 400K mini/codex
# model), reduce these values accordingly before starting the session.
model_context_window = 1000000
model_auto_compact_token_limit = 850000
model_max_output_tokens = 128000

# Memory Core and Knowledge Base are reached over the container-plane ingress on
# loopback, and Chroma plus the embedding services sit behind it. Keep every one of
# them bound to localhost; this flag only lets Codex sandboxed commands reach them
# from trusted checkouts.
[sandbox_workspace_write]
network_access = true

# The two stdio servers changed shape in the repository split. Their implementations moved to the
# Brain checkout (neomjs/neo-agent-brain); the Engine keeps no `ai/` tree, so the former
# `npm run ai:mcp-server-*` form cannot resolve from here. The Engine remains the working directory,
# because it is the repository under work — a stdio entry therefore names BOTH checkouts.
#
# Replace <YOUR_NEO_REPO_PATH> and <YOUR_BRAIN_REPO_PATH> with your own absolute paths.
#
# `env_vars` stays the per-server allowlist: each server receives only the credentials it needs, and
# the remote bearer below is deliberately absent here. See .github/AI_QUICK_START.md §5.
[mcp_servers."neo-mjs-github-workflow"]
command = "/bin/zsh"
args = ["-lc", "cd <YOUR_NEO_REPO_PATH> && exec node <YOUR_BRAIN_REPO_PATH>/ai/mcp/server/github-workflow/mcp-server.mjs"]
env_vars = ["GH_TOKEN", "GITHUB_TOKEN", "NEO_AGENT_IDENTITY"]
startup_timeout_sec = 30
tool_timeout_sec = 120
enabled = true

# Memory Core and Knowledge Base run inside the container plane and are reached
# through its loopback ingress. Codex speaks remote MCP natively, so these two
# tables carry `url` + `bearer_token_env_var` and no command, args, or env_vars.
# Server-side configuration (embedding provider, Chroma, inference host) belongs
# to the containers now, not to this file.
#
# THE BEARER IS RESOLVED IN THE HARNESS PROCESS ENVIRONMENT.
# `bearer_token_env_var` names a slot Codex reads from its OWN environment at MCP
# startup; the value never appears here. The retired stdio shape did not need this
# — each server loaded the repo `.env` itself — so a seat that provisions cleanly
# can still fail to authenticate if NEO_MCP_REMOTE_TOKEN is absent from the shell
# that launched Codex. Export it from your shell profile before starting the
# harness, and verify with `printenv NEO_MCP_REMOTE_TOKEN` in that same shell.
# A GUI-launched harness inherits its environment from launchd rather than from a
# shell, so this mechanism does not carry there; see
# .claude/claude_desktop_config.example.json for the form that does.
#
# NEO_MCP_REMOTE_TOKEN is the one slot for this plane, shared with the Fleet seat
# generators (which moved to the Brain checkout in the Agent OS split). A repository
# credential such as GH_TOKEN is a different authority and may never be substituted
# for it: the two hold the same value in a GitHub-based setup only by coincidence,
# and diverge for a team on GitLab.
[mcp_servers."neo-mjs-knowledge-base"]
url = "http://127.0.0.1:3102/kb/mcp"
bearer_token_env_var = "NEO_MCP_REMOTE_TOKEN"
startup_timeout_sec = 30
tool_timeout_sec = 120
enabled = true

[mcp_servers."neo-mjs-memory-core"]
url = "http://127.0.0.1:3102/mc/mcp"
bearer_token_env_var = "NEO_MCP_REMOTE_TOKEN"
startup_timeout_sec = 30
tool_timeout_sec = 120
enabled = true

[mcp_servers."neo-mjs-neural-link"]
command = "/bin/zsh"
args = ["-lc", "cd <YOUR_NEO_REPO_PATH> && exec node <YOUR_BRAIN_REPO_PATH>/ai/mcp/server/neural-link/mcp-server.mjs"]
env_vars = ["NEO_AGENT_IDENTITY"]
startup_timeout_sec = 30
tool_timeout_sec = 120
enabled = true

