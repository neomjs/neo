name: ADR Seam Table Lint

on:
  pull_request:
    branches: [dev]
    paths:
      - 'learn/agentos/decisions/**'
      - 'ai/scripts/lint/lint-adr-seam-table.mjs'
      - '.github/workflows/adr-seam-table-lint.yml'
  push:
    branches: [dev]
    paths:
      - 'learn/agentos/decisions/**'
      - 'ai/scripts/lint/lint-adr-seam-table.mjs'
      - '.github/workflows/adr-seam-table-lint.yml'

concurrency:
  group: adr-seam-table-lint-${{ github.run_attempt == '1' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Lint ADR seam table (composition record stays current by construction)
        run: node ai/scripts/lint/lint-adr-seam-table.mjs
