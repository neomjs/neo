name: Consumer Runtime Build

# The only check that builds this package from OUTSIDE itself.
#
# Every other build check runs where the repository IS the workspace, which is precisely the case in
# which consumer-owned dynamic contexts are never exercised. Five defects of that shape landed
# across #17881, #17868, #17907, and the two the #17882 review found, each invisible to a green
# suite here. A guard that reasons about relative paths would have missed the one that mattered — the
# optional-root failure was found by a physical build a minute after a simulated one reported every
# root correct — so this packs, installs and compiles for real.
#
# PR-only, and path-filtered to the two layers that own the contract plus the guard's own sources:
# `Data.mjs` / `Main.mjs` decide which roots exist, and the webpack helpers/configs decide where
# those roots live once the framework is a dependency. Changing one half without the other is the
# defect.

on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/worker/Data.mjs'
      - 'src/Main.mjs'
      - 'buildScripts/webpack/mainAddonContextPlugin.mjs'
      - 'buildScripts/webpack/workerContextRebasePlugin.mjs'
      - 'buildScripts/webpack/development/webpack.config.main.mjs'
      - 'buildScripts/webpack/development/webpack.config.worker.mjs'
      - 'buildScripts/webpack/production/webpack.config.main.mjs'
      - 'buildScripts/webpack/production/webpack.config.worker.mjs'
      - 'buildScripts/util/check-consumer-runtime-build.mjs'
      - '.github/workflows/consumer-runtime-build.yml'
      - '.npmignore'
      - 'package.json'

concurrency:
  group: consumer-runtime-build-${{ github.run_attempt == '1' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      # The guard resolves webpack from the FIXTURE, not from here, so the framework's own install is
      # needed only for `npm pack` to run against a complete tree.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build Data-worker and Main contexts from an installed copy, under an `apps/` ancestor
        run: node buildScripts/util/check-consumer-runtime-build.mjs
