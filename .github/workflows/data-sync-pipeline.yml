name: Data Sync Pipeline

# Watched by data-sync-watchdog.yml (staleness alarm over run-status + committed-corpus axes).
on:
  schedule:
    - cron: '0 * * * *' # Run hourly
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: data-sync-pipeline
  cancel-in-progress: false


jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Run bounded Data Sync emission and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ./buildScripts/dataSyncPipeline.mjs

      - name: Push Data to neomjs/pages
        env:
          PAGES_DEPLOY_PAT: ${{ secrets.PAGES_DEPLOY_PAT }}
        run: |
          if [ -z "$PAGES_DEPLOY_PAT" ]; then
            echo "Skipping push to pages: PAGES_DEPLOY_PAT secret is not set."
            exit 0
          fi

          echo "Cloning pages repository..."
          git clone https://x-access-token:${PAGES_DEPLOY_PAT}@github.com/neomjs/pages.git temp_pages

          # Ensure target directories exist
          mkdir -p temp_pages/node_modules/neo.mjs/apps/devindex/resources/data
          mkdir -p temp_pages/node_modules/neo.mjs/apps/portal/resources/data
          mkdir -p temp_pages/node_modules/neo.mjs/resources/content
          mkdir -p temp_pages/resources_pub/website/examples/devmode

          # Copy the data files
          cp apps/devindex/resources/data/users.jsonl temp_pages/node_modules/neo.mjs/apps/devindex/resources/data/

          # Portal data: deletion-synced recursive copy — the previous flat *.json glob missed the
          # chunked subdirectory trees (tickets/v*/, pulls/latest/), which drifted between full
          # deploys (#14496).
          rm -rf temp_pages/node_modules/neo.mjs/apps/portal/resources/data
          cp -r apps/portal/resources/data temp_pages/node_modules/neo.mjs/apps/portal/resources/

          # Project the Neo-owned Workstation preview without mutating the legacy
          # pages-side examples collection.
          cp apps/portal/resources/images/examples/devmode/workstation.png temp_pages/resources_pub/website/examples/devmode/workstation.png

          cp -f apps/portal/sitemap.xml temp_pages/ 2>/dev/null || true
          cp -f apps/portal/llms.txt temp_pages/ 2>/dev/null || true

          # learn/** content + nav index (learn/tree.json): sitemap.xml and llms.txt advertise these
          # routes hourly — advertising them without syncing the content they point at produced the
          # human-traffic 404 class (#14496). Deletion sync makes route renames propagate natively.
          rm -rf temp_pages/node_modules/neo.mjs/learn
          cp -r learn temp_pages/node_modules/neo.mjs/

          # Copy resources content (syncing deletions natively via git).
          # Per Epic #11187 7-bucket fan-out: support both legacy paths (issue-archive/,
          # pr-archive/) and the new single-root archive/ umbrella during the migration
          # transition. Legacy paths drop in a follow-up PR once corpus migration completes.
          # Missing-dir tolerance: each rm -rf and cp guarded so transitional state
          # (e.g., archive/ not yet populated at pre-merge or pr-archive/ post-AC8-migration
          # already removed) does not break the sync.
          for dir in issues pulls discussions issue-archive pr-archive archive; do
            rm -rf "temp_pages/node_modules/neo.mjs/resources/content/$dir"
            if [ -d "resources/content/$dir" ]; then
              cp -r "resources/content/$dir" temp_pages/node_modules/neo.mjs/resources/content/
            fi
          done

          cd temp_pages

          # Check for changes and push
          if [[ -n $(git status -s node_modules/neo.mjs/apps/devindex/resources/data/users.jsonl node_modules/neo.mjs/apps/portal/resources/data/ resources_pub/website/examples/devmode/workstation.png sitemap.xml llms.txt node_modules/neo.mjs/resources/content/ node_modules/neo.mjs/learn/) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add node_modules/neo.mjs/apps/devindex/resources/data/users.jsonl
            git add -A node_modules/neo.mjs/apps/portal/resources/data/
            git add resources_pub/website/examples/devmode/workstation.png
            git add sitemap.xml 2>/dev/null || true
            git add llms.txt 2>/dev/null || true
            git add -A node_modules/neo.mjs/resources/content/
            git add -A node_modules/neo.mjs/learn/

            # temp_pages is a clone of neomjs/pages (built output) — it carries no neo archaeology guard,
            # so NEO_SKIP_TICKET_ARCHAEOLOGY is intentionally absent here (only --no-verify, for whitespace).
            git commit --no-verify -m "chore(data): Sync data and content from neo repo [skip ci]"
            git push origin main
          else
            echo "No changes detected for pages repo."
          fi
