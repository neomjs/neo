  /issues:
    get:
      summary: List Issues
      operationId: list_issues
      x-neo-tool-tier: read
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: true
      description: |
        Retrieves a list of issues from **live GitHub** (GraphQL), not from a local cache or snapshot. `state` and `assignee` filter server-side; `labels` filters this page's rows (GitHub's own label filter is ANY-of, so ALL-of cannot be delegated).

        **When to Use:**
        - To find open work items or review recent closed issues.
        - For freshness-critical checks — assignment, ownership, and open/closed state are read live, so this reflects what GitHub holds right now.
        - Use `projection: 'title'` for title-first backlog scans where issue bodies would waste context.
        - Use the default `projection: 'full'` when you need issue bodies in the list response.
        - To look up issue numbers for use in other tools.

        **Completeness:** `limit` bounds the matches RETURNED, not the rows searched. Check `truncated` before treating a result as complete, and pass the returned `endCursor` back as `cursor` to continue.
      tags: [Issues]
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of issues to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - name: state
          in: query
          required: false
          description: Filter issues by state.
          schema:
            type: string
            enum: [open, closed, all]
            default: open
        - name: labels
          in: query
          required: false
          description: Comma separated list of labels to filter by; an issue must carry ALL of them. Applied to the rows this page returned, because GitHub's own label filter is ANY-of rather than ALL-of. `totalCount` is therefore null when this is set — use `truncated` to tell whether the answer is bounded.
          schema:
            type: string
        - name: assignee
          in: query
          required: false
          description: Filter issues by a single assignee login. Applied server-side, so `limit` bounds the MATCHES returned rather than the rows searched — check `truncated` before treating the result as this agent's complete ownership. `@me` resolves to the authenticated viewer login (the same contract `manage_issue_assignees` honors).
          schema:
            type: string
        - name: projection
          in: query
          required: false
          description: Response projection. `full` preserves the existing body-bearing shape, `summary` omits body but keeps triage metadata, and `title` / `title_only` return a compact title-scan shape. Use `get_conversation` for full context after selecting a candidate issue.
          schema:
            type: string
            enum: [full, summary, title, title_only]
            default: full
        - name: sort
          in: query
          required: false
          description: Order field. `updated` (default) sorts by last activity; `created` sorts by filing time — the freshness-sweep evidence, since updated-descending buries untouched fresh filings below recently-updated older issues.
          schema:
            type: string
            enum: [updated, created]
            default: updated
        - name: cursor
          in: query
          required: false
          description: Cursor for pagination. Pass the `endCursor` returned by a prior call to continue past a `truncated` result; omit for the first page.
          schema:
            type: string
      responses:
        '200':
          description: A list of issues.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueListResponse'
        '500':
          description: Internal server error, e.g., GraphQL failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

