name: Retired Primitives Check

on:
  pull_request:
    branches: [dev]
    paths:
      - 'ai/**/*.mjs'
      - 'ai/scripts/diagnostics/check-retired-primitives.mjs'
      - '.github/workflows/check-retired-primitives.yml'
  push:
    branches: [dev]
    paths:
      - 'ai/**/*.mjs'
      - 'ai/scripts/diagnostics/check-retired-primitives.mjs'
      - '.github/workflows/check-retired-primitives.yml'

concurrency:
  group: check-retired-primitives-${{ github.run_attempt == '1' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Check Retired Primitives
        run: npm run ai:check-retired-primitives
