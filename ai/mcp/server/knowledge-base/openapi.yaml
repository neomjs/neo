openapi: 3.0.3
info:
  title: Neo Knowledge Base MCP Server API
  description: |
    This API provides structured access to the Neo.mjs project's knowledge base.
    It enables AI agents to build, query, and manage the vector database containing
    source code, documentation, and learning materials.
  version: 1.0.0
  contact:
    name: Neo.mjs Project
    url: https://github.com/neomjs/neo
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8003
    description: Local development server

tags:
  - name: Health
    description: Server health and status endpoints
  - name: Database
    description: Operations for managing the knowledge base lifecycle
  - name: "Database Lifecycle"
    description: "Tools for starting and stopping the database process"
  - name: Documents
    description: Operations for querying knowledge base documents

# Harness tool-projection policy (mirrors neural-link). In a maintainer harness spawned with
# `--tool-projection-mode harness-embedded`, only `read`-tier tools load by default; `extended` +
# `admin` tools are withheld and reachable on demand via `get_mcp_tool_handbook`. This caps the
# loaded surface against the harness ~100-tool ceiling without removing any capability.
x-neo-harness-tool-projection:
  defaultVisibleTiers:
    - read
  operatorOnlyTiers:
    - admin

paths:
  /healthcheck:
    get:
      summary: Health Check
      operationId: healthcheck
      x-neo-tool-tier: read
      x-annotations:
        readOnlyHint: true
      description: |
        Verifies that the server is running and can successfully connect to the
        ChromaDB vector database.

        Use this tool as a first step to diagnose issues if other database-related
        tools are failing. It provides a quick status check on the server and its
        primary dependency.
      tags: [Health]
      responses:
        '200':
          description: Server is healthy and connected to the database.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
        '503':
          description: Service Unavailable. The server is running but cannot connect to the database.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ingestion/progress:
    get:
      summary: Get Ingestion Progress
      operationId: get_ingestion_progress
      x-neo-tool-tier: extended
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: true
      x-neo-tool-summary: Ingestion progress for THIS PROCESS only; pull-mode tenant lanes run elsewhere.
      description: |
        Returns a read-only snapshot for the active ingestion run, or an idle state with the last
        completed run summary. This diagnostics tool stays separate from `healthcheck` so liveness
        payloads remain compact.

        SCOPE — read before trusting a negative answer. The progress ledgers are in-memory instance
        state, so this answers only for the process serving the call, and every response says so in
        `observedScope`. `never-attempted` therefore means "no ledger in THIS process", never "this
        deployment has never ingested". Pull-mode tenant-repo ingestion runs inside the orchestrator
        and is invisible here; a wedged pull lane is visible in the deployment-state snapshot's
        `tenantRepoSync` section, which `crossProcessHint` points at.

        `status` distinguishes three idle-path outcomes that were previously all reported as `idle`:
        `never-attempted` (no ledger), `failed` (the last run failed — including a run that died
        before progress tracking began), and `idle` (a clean run finished). Top-level `errorCount`
        carries the last run's count rather than a pinned zero.
      tags: [Health]
      parameters:
        - in: query
          name: staleAfterMs
          schema:
            type: integer
            minimum: 0
            default: 60000
          description: Mark an active run stalled when no progress has occurred for this many milliseconds.
      responses:
        '200':
          description: Ingestion progress snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionProgressResponse'

  /tool/handbook:
    post:
      summary: Tool Handbook
      operationId: get_mcp_tool_handbook
      x-neo-tool-tier: read
      x-annotations:
        readOnlyHint: true
      description: Returns lazy-loaded usage detail for one Knowledge Base MCP tool.
      tags: [Documents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toolId]
              properties:
                toolId:
                  type: string
                  description: Tool operation id to inspect.
      responses:
        '200':
          description: Tool handbook lookup result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  toolId:
                    type: string
                  found:
                    type: boolean
                  title:
                    type: string
                  description:
                    type: string
                  handbook:
                    type: string
                  source:
                    type: string
                  code:
                    type: string
                  message:
                    type: string
                  inputSchema:
                    type: object
                  outputSchema:
                    type: object

  /deployment/state/snapshot:
    post:
      summary: Deployment State Snapshot
      operationId: get_deployment_state_snapshot
      x-neo-tool-tier: extended
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: true
      x-neo-tool-summary: Read the graph-independent deployment-state bridge snapshot.
      description: |
        Reads the bounded deployment-state bridge snapshot written by the internal orchestrator.
        This is a read-only public KB surface: it does not expose Docker, shell, exec, restart,
        or any public daemon/orchestrator route. It exists so MC-unhealthy / graph-unavailable
        incidents still have a KB-hosted current-state path when KB is healthy. The snapshot
        also includes redacted tenant-repo-sync scheduler/task/config state for pull-mode
        ingestion diagnostics. The snapshot can also include bridgeDiagnostics with redacted
        runtime-access config, Compose label filter details, and stable lookup-failure reasons
        for service-observation failures. Fresh snapshots missing current-schema sections return
        a degraded status with stable schemaDiagnostics reason codes.
      tags: [Health]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                staleAfterMs:
                  type: number
                  description: Optional freshness window override in milliseconds.
      responses:
        '200':
          description: Snapshot status and payload when available.
          content:
            application/json:
              schema:
                type: object

  /deployment/inspect:
    post:
      summary: Inspect Deployment
      operationId: inspect_deployment
      x-neo-tool-tier: extended
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: true
      x-neo-tool-summary: Inspect bounded cloud deployment state from the orchestrator bridge.
      description: |
        Reads the bounded deployment inspection snapshot written by the internal orchestrator.
        This is a read-only public KB surface: it exposes allowlisted service state, bounded
        log tails, current diagnoses, recent recovery-run ledger entries, and redacted
        tenant-repo-sync scheduler/task/config state without exposing
        Docker, shell, exec, restart, or any public daemon/orchestrator route. Fresh snapshots
        missing current-schema sections return a degraded status with stable schemaDiagnostics
        reason codes.
      tags: [Health]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                staleAfterMs:
                  type: number
                  description: Optional freshness window override in milliseconds.
      responses:
        '200':
          description: Inspection status and payload when available.
          content:
            application/json:
              schema:
                type: object

  /db/data/manage:
    post:
      summary: Manage Knowledge Base Data
      operationId: manage_knowledge_base
      x-neo-tool-tier: admin
      x-pass-as-object: true
      description: |
        Manages the content of the knowledge base.

        **Actions:**
        - **sync:** Full update. Creates the JSONL file from source and embeds the diff.
        - **create:** Generates the intermediate `ai-knowledge-base.jsonl` file only.
        - **embed:** Embeds the existing JSONL file into the vector database (diff-based).
        - **delete:** Permanently deletes the entire collection from ChromaDB.

        **Volume gate:** when the post-delta diff exceeds `mcpSyncMaxChunks` (default 50), this tool returns `KB_SYNC_VOLUME_EXCEEDED` instead of executing synchronously. Use `npm run ai:sync-kb` for bulk re-embedding work.
      tags: [Database]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum: [sync, create, embed, delete]
                  description: The management action to perform.
                confirmation:
                  type: string
                  description: Explicit production confirmation token required with the destructive bypass env for delete.
      responses:
        '200':
          description: Operation completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /db/data/ingest:
    post:
      summary: Ingest Source Files
      operationId: ingest_source_files
      x-neo-tool-tier: admin
      x-pass-as-object: true
      description: |
        Agent-native Knowledge Base ingestion for small batches of source files.

        Accepts raw `{path, content}` file payloads or client-side `parsed-chunk-v1`
        records, applies tenant-scoped deletion signaling, and embeds the result.
        Use this for small incremental pushes (e.g. post-commit hook batches).

        **Volume gate:** when the batch volume exceeds `mcpSyncMaxChunks`
        (default 50) this tool refuses up-front and returns a `KB_INGEST_VOLUME_EXCEEDED`
        payload instead of embedding synchronously — split the batch into smaller
        `ingest_source_files` calls. Batch volume = the summed `parsedChunks` length
        across `files`, counting each raw (un-parsed) file as 1.
      tags: [Database]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestSourceFilesRequest'
      responses:
        '200':
          description: Ingestion completed, OR refused with a KB_INGEST_VOLUME_EXCEEDED payload.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/IngestSourceFilesResponse'
                  - $ref: '#/components/schemas/KbIngestVolumeExceededResponse'
        '500':
          description: Ingestion failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /documents/query:
    post:
      summary: Query Documents
      operationId: query_documents
      x-neo-tool-tier: read
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: true
      x-neo-tool-summary: Search the Knowledge Base and return ranked source references.
      description: |
        Performs a semantic search on the knowledge base using a natural language query.
        Returns a scored and ranked list of the most relevant source files.

        **Prefer `ask_knowledge_base` for most queries.** It returns a synthesized answer
        PLUS the same top-5 ranked refs (with identical scores) that this tool returns —
        strictly a superset. Use `query_documents` only when you need exhaustive enumeration
        beyond the top ~5 refs (e.g., building an index, listing many files, or when the
        synthesis step is overhead).

        ## How to Use This Tool

        **Input:**
        - `query`: Natural language search query (1-10 words work best)
        - `type`: Optional filter by content type (all, blog, guide, src, example, ticket, release, test, skill, adr, concept)

        **Output:**
        A ranked list of file paths with relevance scores. Example:
        ```
        Most relevant source files (by weighted score):
        - /path/to/relevant/file1.mjs (Score: 350)
        - /path/to/relevant/file2.md (Score: 210)
        - /path/to/relevant/file3.mjs (Score: 150)

        Top result: /path/to/relevant/file1.mjs
        ```

        ## How to Interpret Results

        1. **Start with the top result**: Always read the highest-scoring file first.
        2. **Scan the next 5-10 results**: Check both file types and scores.
        3. **Balance source and guides**: Read top 1-2 source files (.mjs) AND top 1-2 guides (.md).
           - `.mjs` files: Implementation details, actual code
           - `.md` files: Conceptual context, architectural rationale
        4. **Prioritize content types**:
           - `guide` and `src`: Current best practices and implementation
           - `blog`: Historical context (code examples may be outdated)
           - `example`: Concrete usage patterns
           - `ticket`: Can be historical context (**closed tickets**) or potential work items (**open tickets**). Distinguish between them carefully.

        ## Query Strategies

        ### The Discovery Pattern: Broad to Narrow
        When learning about a new concept or feature area:

        1.  **Start Broad:** Query foundational concepts first.
            - For high-level questions, consult `learn/tree.json` to identify key concepts.
            - Use terms like `"benefits"`, `"architecture"`, `"fundamentals"`.
            - Prioritize reading guides from top-level directories.

        2.  **Narrow to Specifics:** Use broad results to formulate targeted queries.
            - `query_documents(query='Button component examples')`
            - `query_documents(query='what is Neo.component.Base?')`

        3.  **Filter by Type:** Use the `type` parameter for focused results.
            - Conceptual: `type='guide'`
            - Usage examples: `type='example'`
            - Implementation: `type='src'`
            - Historical context: `type='ticket'` or `type='blog'`

        ## When Queries Return No Results

        If queries consistently return no relevant results for your task:

        **Pause and document the gap:**
        - Clearly describe what you were trying to accomplish
        - List the queries you attempted (show your work)
        - Explain why existing results were insufficient
        - Consult with the user about next steps

        **Before implementing based on assumptions:**
        - Explain the knowledge gap you've identified
        - Propose your approach and its basis (general software patterns, analogous Neo.mjs patterns, etc.)
        - Get explicit user approval to proceed

        ## Handling Failures

        If this tool fails or throws an error:
        1. Run the `healthcheck` tool to diagnose the issue.
        2. If unhealthy, consult `.github/AI_QUICK_START.md` for setup guidance.
      tags: [Documents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
            examples:
              conceptual_query:
                summary: Broad Conceptual Query
                value:
                  query: "Neo.mjs benefits and architecture"
              specific_component_query:
                summary: Specific Component Query
                value:
                  query: "Button component examples"
              targeted_guide_query:
                summary: Targeted Content-Type Query
                value:
                  query: "state management"
                  type: "guide"
              targeted_source_query:
                summary: Targeted Source Code Query
                value:
                  query: "afterSet hook"
                  type: "src"
      responses:
        '200':
          description: Successfully retrieved and scored query results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '400':
          description: Bad Request. The request body is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error during query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /knowledge/ask:
    post:
      summary: Ask Knowledge Base (RAG)
      operationId: ask_knowledge_base
      x-neo-tool-tier: read
      x-pass-as-object: true
      x-neo-tool-summary: Ask the Knowledge Base for a synthesized answer with cited references.
      description: |
        Performs a semantic search and uses an LLM to synthesize an answer based on the top results.
        Use this tool to get a high-level answer without manually reading multiple files.

        ## Priority Positioning

        **This should be your DEFAULT tool for Neo.mjs knowledge queries** — both conceptual
        ("how does X work?") AND file-discovery ("which files implement Z?"). Empirically
        verified: `ask_knowledge_base` returns a synthesized answer PLUS the same top-5 ranked
        source files (with identical relevance scores) that `query_documents` would return.
        It is strictly a superset.

        Reserve `query_documents` for the narrow case where you need exhaustive enumeration
        beyond the top ~5 refs (e.g., building an index, listing many files, or when the
        synthesis step is overhead). For every other knowledge query, start here.

        ## How It Works

        This tool acts as a **zero-cost RAG subagent** — it performs semantic search across the
        entire indexed codebase (source code, guides, examples, tickets, release notes), retrieves
        the top-scoring documents, and uses an LLM to synthesize a grounded answer with cited
        references. Even lightweight local models (e.g., Gemma4-31B via MLX) can invoke this tool
        to access frontier-quality Neo.mjs knowledge.

        **Input:**
        - `query`: The question to ask. Natural language works best — ask it like you would ask a senior developer.
        - `limit`: (Optional) Number of source documents to consider (default 5). Increase for broader questions.
        - `type`: (Optional) Filter by content type (e.g., 'guide', 'src', 'all', 'skill', 'adr', 'concept').

        **Output:**
        - `answer`: Synthesized answer grounded in the current codebase.
        - `references`: List of source files used to generate the answer, with relevance scores.

        ## Example Queries

        ```
        ask_knowledge_base(query='how does the reactive config system work?')
        ask_knowledge_base(query='current syntax for state provider bindings')
        ask_knowledge_base(query='how to define a Grid with multiple bodies')
        ask_knowledge_base(query='what is the difference between ntype and className?', type='guide')
        ```

        ## When to Use This vs. query_documents

        | Query Need | Use This Tool | Use query_documents |
        |---|---|---|
        | "How does X work?" | ✅ | ❌ |
        | "What is the syntax for Y?" | ✅ | ❌ |
        | "Which files implement Z?" (top 5 refs sufficient) | ✅ | ❌ |
        | "Where is the Grid component defined?" (top 5 refs sufficient) | ✅ | ❌ |
        | "Give me 25 ranked refs for exhaustive enumeration" | ❌ | ✅ |
        | Building an index/listing (synthesis is overhead) | ❌ | ✅ |

        ## Anti-Pattern Warning

        **Do NOT attempt to answer Neo.mjs questions from training data.** Always ask the
        knowledge base first. Neo.mjs evolves rapidly — your training data is almost
        certainly outdated for syntax-level details.
      tags: [Documents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  description: The question to ask.
                type:
                  type: string
                  description: "Optional filter by content type (e.g., 'guide', 'src', 'all', 'skill', 'adr', 'concept')."
                  enum: [all, blog, guide, src, example, ticket, release, test, skill, adr, concept]
                  default: all
                limit:
                  type: integer
                  description: Number of documents to include in context.
                  default: 5
                conceptWalk:
                  type: boolean
                  default: false
                  description: "Opt-in: when true, additionally returns knowledge-base docs reached via a bounded concept-graph walk over the query (CONCEPT→FILE edges resolved to the doc whose metadata.source matches, re-authorized through the same tenant + type filter), appended to the embedding references and deduped, each carrying `via`/`conceptPath` provenance. Default false returns the embedding references only (byte-identical)."
      responses:
        '200':
          description: Successful RAG response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    type: string
                  references:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        source:
                          type: string
                        score:
                          type: number
                          nullable: true
                          description: "Embedding similarity for flat references; null for concept-walk references, which carry graph provenance rather than an embedding score."
                        via:
                          type: string
                          nullable: true
                          description: "Reference provenance: absent/null for embedding hits; 'concept-walk' for docs reached through the bounded concept-graph walk."
                        conceptPath:
                          type: object
                          nullable: true
                          description: "The complete concept-neighborhood path by which the walk reached this doc; null for embedding references."
                          properties:
                            rootConcept:
                              type: string
                              description: "The resolved concept cluster-key the walk started from."
                            depth:
                              type: integer
                              description: "Number of hops from the root concept to this doc."
                            hops:
                              type: array
                              description: "Ordered hops root→doc — each carries its edge + degrade-by-omission provenance (absent axes omitted)."
                              items:
                                type: object
                                properties:
                                  edgeType:
                                    type: string
                                    nullable: true
                                  neighborLabel:
                                    type: string
                                    nullable: true
                                  readAt:
                                    type: string
                                    nullable: true
                                  axes:
                                    type: object
                                    description: "Present provenance axes only (authority / fidelity / extractionProvenance / lifecycle)."
                  conceptWalk:
                    type: object
                    nullable: true
                    description: "Present only when the conceptWalk opt-in ran (absent on the default flat path) — the retrieval event, mirroring RETRIEVAL_EVENT_SCHEMA."
                    properties:
                      event:
                        type: string
                        description: "Event name (e.g. 'concept_walk')."
                      query:
                        type: string
                      resolvedConcepts:
                        type: array
                        items:
                          type: string
                        description: "Concept cluster-keys the query resolved to (the walk roots)."
                      walkContributed:
                        type: boolean
                        description: "Whether the walk appended at least one new reference."
                      candidatesAdded:
                        type: integer
                        description: "Concept-walk references appended after dedup + tenant/type re-authorization."
                      filteredOut:
                        type: integer
                        description: "Walk candidates dropped by re-authorization or dedup."
                      walkDurationMs:
                        type: number
                      truncated:
                        type: boolean
                        description: "True when the walk was cut short by its hop/hydration budget."
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /knowledge/agent-faqs:
    post:
      summary: List Agent FAQs
      operationId: list_agent_faqs
      x-neo-tool-tier: extended
      x-pass-as-object: true
      description: |
        Lists frequently repeated Knowledge Base questions captured from agent calls to
        `ask_knowledge_base` and `query_documents`.

        The rows come from the shared SQLite telemetry tables `kb_query_log` and
        `kb_query_faqs`. Set `refresh: true` to rebuild the materialized FAQ table from
        the raw query log before reading it. The current clustering implementation uses
        exact normalized-query grouping and records the configured similarity threshold
        as a calibration value for the later embedding-backed clustering phase.
      tags: [Documents]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                  description: Maximum number of FAQ clusters to return.
                  default: 25
                minCount:
                  type: integer
                  description: Minimum query occurrences required for a cluster.
                  default: 3
                refresh:
                  type: boolean
                  description: Rebuild the `kb_query_faqs` table from `kb_query_log` before reading.
                  default: false
                sinceTimestamp:
                  type: integer
                  description: Lower timestamp bound used when `refresh` is true.
                  default: 0
      responses:
        '200':
          description: Materialized Agent FAQ clusters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentFaqResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /knowledge/hierarchy:
    get:
      summary: Get Class Hierarchy
      operationId: get_class_hierarchy
      # The scope belongs on the DEFAULT-visible tier: `tools/list` shows this line, while the long
      # `description` below is only served on an explicit `get_mcp_tool_handbook` call. A caller who
      # never fetches the handbook is exactly the caller who would misread the scope.
      x-neo-tool-summary: Static class-hierarchy map for Neo.mjs code only — not your own or any tenant's repositories.
      x-neo-tool-tier: read
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: true
      description: |
        Retrieves the static class hierarchy of **Neo.mjs code only** — a deterministic inheritance
        map derived from the Neo.mjs engine source tree.

        **Scope — read before calling:** this covers Neo.mjs classes exclusively. It does NOT cover
        your own or any tenant's repositories, whatever else this deployment has ingested. Use
        `query_documents` or `ask_knowledge_base` for non-Neo.mjs code.

        Reads a generated build artifact, not the embedded corpus, so it is independent of ingestion
        state. It fails LOUD rather than degrading: an absent artifact errors telling you to sync the
        knowledge base, instead of returning a thinner map indistinguishable from a complete one.

        **Input:**
        - `root`: (REQUIRED) Returns this class plus its subclasses (e.g. 'Neo.component.Base').
          Bounds the payload; omitting it errors.

        **Output:**
        A JSON object keyed by class name whose value is that class's parent class name, or `null`
        where it has none. A `root` with no entry and no subclasses returns `{message}` instead.
      tags: [Documents]
      parameters:
        - name: root
          in: query
          required: true
          description: The root class name to filter by.
          schema:
            type: string
            example: "Neo.component.Base"
      responses:
        '200':
          description: The class hierarchy map.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                  nullable: true
        '404':
          description: Hierarchy file not found (requires sync).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /documents:
    get:
      summary: List Documents
      operationId: list_documents
      x-neo-tool-tier: read
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: true
      description: |
        Retrieves a paginated list of all documents from the knowledge base collection.

        **When to Use:**
        Use this tool for debugging or inspection to see the raw, chunked content that exists
        within the vector database. It can be useful for verifying the output of the
        `create` and `embed` processes.
      tags: [Documents]
      parameters:
        - name: limit
          in: query
          required: false
          description: The maximum number of documents to return.
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          required: false
          description: The number of documents to skip for pagination.
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: A paginated list of documents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /documents/{id}:
    get:
      summary: Get Document by ID
      operationId: get_document_by_id
      x-neo-tool-tier: read
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: true
      description: |
        Retrieves a single document from the collection by its unique ID.

        **When to Use:**
        Use this tool to inspect a specific chunk of content from the database, for example,
        after it has been identified by a `query` or `list` operation.
      tags: [Documents]
      parameters:
        - name: id
          in: path
          required: true
          description: The unique ID of the document to retrieve.
          schema:
            type: string
      responses:
        '200':
          description: The requested document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          description: Document not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    HealthCheckResponse:
      type: object
      properties:
        status:
          type: string
          description: Overall health status of the server. `unhealthy` means ChromaDB is unreachable; `degraded` means ChromaDB is reachable but corpus or provider readiness is incomplete.
          enum: [healthy, degraded, unhealthy]
          example: "healthy"
        timestamp:
          type: string
          format: date-time
          description: Timestamp of when the health check was performed.
          example: "2025-10-25T12:00:00Z"
        plane:
          type: object
          description: OBSERVED plane identity — the id/dataRoot THIS process resolved, read from the same per-server config the boot assertion verified (the deployment manifest's observed column). Always present.
          properties:
            id:
              type: string
              description: Opaque plane identity (never a path).
              example: "neo-local-canonical"
            dataRoot:
              type: string
              description: Absolute durable data root this process resolved.
          required: [id, dataRoot]
        deployedRevision:
          type: string
          nullable: true
          description: "Packaged source revision from the image's `.neo-revision` marker (not the `NEO_REVISION` build arg, which records what was REQUESTED). `null` when no build wrote one. Always present: an absent field reads as current to a consumer computing deployment skew."
          example: "82e26297b5fad7ad9efbc708220dc0935c4f59d0"
        runtimeFreshness:
          type: object
          description: Compact boot-vs-current runtime freshness diagnostic for detecting stale Knowledge Base MCP process attachments.
          properties:
            status:
              type: string
              enum: [current, stale, unknown]
              description: Whether service-owned config/OpenAPI identity marks the running process stale.
            startedAt:
              type: string
              format: date-time
              description: When the MCP runtime module was loaded.
            stale:
              type: object
              description: Per-identity stale flags. Null means the field could not be compared.
              properties:
                configDigest:
                  type: boolean
                  nullable: true
                openApiDigest:
                  type: boolean
                  nullable: true
            details:
              type: array
              items:
                type: string
            hint:
              type: string
              nullable: true
              description: Restart or re-handshake guidance when the runtime is stale.
        database:
          type: object
          properties:
            process:
              type: object
              properties:
                running:
                  type: boolean
                  description: True if the ChromaDB process is locally observed as running. In unified topology this can be false while connection.connected is true because ChromaDB is orchestrator-managed.
                  example: true
                pid:
                  type: integer
                  nullable: true
                  description: Process ID of the ChromaDB server, if running.
                  example: 12345
                managed:
                  type: boolean
                  description: True if the ChromaDB process is managed by this server.
                  example: true
            connection:
              type: object
              properties:
                connected:
                  type: boolean
                  description: True if the server can connect to ChromaDB.
                  example: true
                collections:
                  type: object
                  nullable: true
                  properties:
                    knowledgeBase:
                      type: object
                      properties:
                        name:
                          type: string
                          example: "neo-knowledge-base"
                        exists:
                          type: boolean
                          example: true
                        count:
                          type: integer
                          example: 1234
                        error:
                          type: string
                          description: Collection access error when the KB corpus is unavailable.
        features:
          type: object
          properties:
            embedding:
              type: boolean
              nullable: true
              description: "Latest observed embedding-path readiness: true after a healthy vector, false after a settled failure, null before any observation. Never inferred from configuration alone."
              example: true
        details:
          type: array
          items:
            type: string
          description: "A list of human-readable details about the system's status."
          example:
            - "Connected to the orchestrator-managed ChromaDB instance"
            - "All features are operational"
        version:
          type: string
          example: "1.0.0"
        uptime:
          type: number
          description: Server uptime in seconds.
          example: 3600
      # Only `deployedRevision` is guaranteed present. Its siblings are emitted in practice but not
      # contractually required, and widening this list is a separate decision per field — this entry is
      # narrow on purpose rather than the start of a convention.
      required: [deployedRevision]

    DatabaseLifecycleResponse:
      type: object
      properties:
        status:
          type: string
          enum: [started, stopped, already_running, not_running]
        pid:
          type: integer
          nullable: true

    QueryRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          description: |
            Natural language search query. Best practices:
            - Keep queries concise (1-10 words)
            - Use specific technical terms when known
            - Start broad, then narrow based on results
            - Example good queries: "Button component", "state management patterns",
              "afterSet hook implementation", "multi-window architecture"
          example: "How do I use the Tab Container component?"
        type:
          type: string
          description: |
            Filter results by content type:
            - `all`: Search all content (default)
            - `guide`: Conceptual explanations and architectural docs
            - `src`: Source code implementation
            - `example`: Working examples and demos
            - `blog`: Historical context and evolution (code may be outdated)
            - `ticket`: Issues from GitHub. Can be open (potential work) or closed (historical context).
            - `release`: Release notes and changelogs
            - `test`: Automated tests and specs
            - `skill`: Agent skill documentation and rules
            - `adr`: Architecture Decision Records
            - `concept`: Architectural concepts and primitives
          enum: [all, blog, guide, src, example, ticket, release, test, skill, adr, concept]
          default: all
        limit:
          type: integer
          description: The maximum number of results to return.
          default: 25

    QueryResultItem:
      type: object
      properties:
        source:
          type: string
          description: The file path of the relevant document.
        score:
          type: string
          description: The calculated relevance score.

    QueryResponse:
      type: object
      properties:
        topResult:
          type: string
          description: The file path of the highest-scoring result.
        results:
          type: array
          items:
            $ref: '#/components/schemas/QueryResultItem'

    AgentFaq:
      type: object
      properties:
        clusterId:
          type: string
        canonicalQuery:
          type: string
        normalizedQuery:
          type: string
        variants:
          type: array
          items:
            type: string
        count:
          type: integer
        failureCount:
          type: integer
        firstSeen:
          type: integer
        lastSeen:
          type: integer
        relatedConceptIds:
          type: array
          items:
            type: string
        hasStrongGuideCoverage:
          type: boolean
        similarityThreshold:
          type: number

    AgentFaqResponse:
      type: object
      properties:
        count:
          type: integer
        minCount:
          type: integer
        similarityThreshold:
          type: number
        faqs:
          type: array
          items:
            $ref: '#/components/schemas/AgentFaq'

    Document:
      type: object
      properties:
        id:
          type: string
        metadata:
          type: object
        content:
          type: string

    DocumentListResponse:
      type: object
      properties:
        count:
          type: integer
        documents:
          type: array
          items:
            $ref: '#/components/schemas/Document'

    SuccessResponse:
      type: object
      properties:
        message:
          type: string
          example: "Operation completed successfully"
        details:
          type: string
          description: Optional details about the operation.
          example: "Knowledge base synchronization started."

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Database connection failed"
        message:
          type: string
          example: "Could not connect to ChromaDB at the specified address."
        code:
          type: string
          example: "DB_CONNECTION_ERROR"

    IngestSourceFilesRequest:
      type: object
      description: |
        Knowledge Base ingestion push envelope (Phase 2 agent-native facade). No field is
        strictly required at this layer — the ingestion service validates and returns a
        structured summary (accumulating per-file errors) rather than throwing.
      properties:
        tenantId:
          type: string
          description: |
            Authenticated tenant id. The server stamps the authoritative value; offline
            calls fall back to `neo-shared`.
        repoSlug:
          type: string
          description: |
            Tenant-owned repo identifier used as the default repo boundary for raw files,
            explicit tombstones without their own repoSlug, and telemetry.
            Per-file, per-chunk, tombstone, manifest, and revision-resolver repoSlug
            values remain authoritative for their narrower scopes.
        visibility:
          type: string
          enum: [team, private]
          description: |
            Server-stamped visibility for the ingested chunks. Defaults to the Knowledge
            Base server's configured default visibility when omitted.
        files:
          type: array
          description: Raw file payloads or client-side parsed records to ingest.
          items:
            type: object
            additionalProperties: true
            properties:
              path:
                type: string
                description: Source path relative to the repo root.
              content:
                type: string
                description: Raw file content (omitted when parsedChunks is supplied).
              parser:
                type: string
                description: Optional parser id hint for server-side raw-file parsing.
              parsedChunks:
                type: array
                description: |
                  Optional client-side parsed `parsed-chunk-v1` records. When present,
                  these pass through to the ingestion service's Ajv `parsed-chunk-v1`
                  validator — the deep per-chunk contract is enforced there, not
                  duplicated in this tool schema.
                items:
                  type: object
                  additionalProperties: true
        deleted:
          type: array
          description: Explicit tombstones for files removed on the client.
          items:
            type: object
            additionalProperties: true
            properties:
              sourcePath:
                type: string
              repoSlug:
                type: string
        manifestSnapshot:
          type: object
          additionalProperties: true
          description: Post-push manifest used to derive orphaned-chunk deletions.
          properties:
            repoSlug:
              type: string
            pathsAfterPush:
              type: array
              items:
                type: string
        baseRevision:
          type: string
          description: Previous revision boundary (optional revision-range deletion signal).
        headRevision:
          type: string
          description: Current revision boundary (optional revision-range deletion signal).
        viaMcp:
          type: boolean
          description: |
            Work-volume-gate mode. Omitted or true keeps `VectorService.embed` MCP-safe,
            refusing batches above `mcpSyncMaxChunks`. Explicit `false` is the in-process
            bulk opt-in used by pull-mode tenant-repo sync and the `ai:ingest-tenant` CLI.
            MCP dispatch overrides any caller value to `true`, so declaring it here cannot
            widen the agent-facing gate.
        materializationAttempt:
          type: object
          additionalProperties: true
          description: |
            Orchestrator-minted identity for one full pull materialization. Pull-mode only:
            the ingestion service pairs it with the persisted manifest to emit the
            `materializationReceipt` that proves a positive effect. MCP dispatch deletes
            this field inbound and the receipt outbound, so a pushing agent can neither
            supply nor observe it.
          properties:
            attemptId:
              type: string
              description: Opaque 32-character lowercase hex attempt identity.
            ingestContractVersion:
              type: integer
              description: Checkpoint-contract version this attempt was minted under.

    IngestSourceFilesResponse:
      type: object
      description: Structured ingestion summary returned by IngestionService.
      properties:
        ingested:
          type: integer
          description: Count of chunks embedded/upserted.
        deleted:
          type: integer
          description: Count of Chroma rows removed via deletion signaling.
        embeddingsGenerated:
          type: integer
          description: Count of embeddings generated for this push.
        skippedOversized:
          type: integer
          description: Count of local-provider over-budget chunks skipped before embedding.
        errors:
          type: array
          description: Accumulated per-file caller errors; a non-empty array does not imply total failure.
          items:
            type: object
            additionalProperties: true
        tenantId:
          type: string
          description: The server-resolved authoritative tenant id.
        durationMs:
          type: integer
          description: Wall-clock duration of the ingestion in milliseconds.

    IngestionProgressResponse:
      type: object
      description: >-
        Read-only ingestion progress snapshot, scoped to THE PROCESS SERVING THE CALL. The progress
        ledgers are in-memory instance state, so this response can never describe another process:
        a Knowledge Base server reporting `never-attempted` is not evidence that the deployment has
        never ingested. Pull-mode tenant-repo ingestion runs in the orchestrator and is invisible
        here; read the deployment-state snapshot (`tenantRepoSync`) for that lane.
      additionalProperties: true
      properties:
        status:
          type: string
          enum: [idle, never-attempted, running, completed, completed_with_errors, failed]
          description: >-
            Current progress state. `never-attempted` means THIS PROCESS has no ingestion ledger at
            all, which is distinct from `idle` (a run finished and nothing is in flight). `failed` at
            this level reflects the LAST run's outcome while nothing is active — including a run that
            died before progress tracking started, which previously reported `idle` with
            `errorCount: 0` while the nested `lastRunSummary` recorded the failure.
        observedScope:
          type: string
          enum: [this-process-only]
          description: >-
            The observation boundary of this response. Always `this-process-only` — declared as a
            field rather than left implicit so a caller cannot mistake a process-local answer for a
            deployment-wide one. Present on every response state, active and idle alike.
        crossProcessHint:
          type: string
          description: >-
            Where cross-process ingestion state can actually be read, since this response cannot
            carry it. Present on every response state.
        active:
          type: boolean
          description: True when an ingestion run is currently executing.
        phase:
          type: string
          description: Current phase for an active run, or idle when no ingestion is running.
        startedAt:
          type: string
          nullable: true
          description: ISO timestamp for the active or last run start.
        updatedAt:
          type: string
          nullable: true
          description: ISO timestamp for the last progress ledger update.
        lastProgressAt:
          type: string
          nullable: true
          description: ISO timestamp for the last active progress event.
        completedAt:
          type: string
          nullable: true
          description: ISO timestamp for the last run completion.
        durationMs:
          type: integer
          description: Elapsed wall-clock duration in milliseconds.
        staleAfterMs:
          type: integer
          description: Staleness threshold used to compute stalled.
        stalled:
          type: boolean
          description: True when an active run has not advanced within staleAfterMs.
        tenantId:
          type: string
        repoSlug:
          type: string
        totalSources:
          type: integer
        seenSources:
          type: integer
        totalChunks:
          type: integer
        embeddedChunks:
          type: integer
        skippedChunks:
          type: integer
        remaining:
          type: integer
        deletedRows:
          type: integer
        errorCount:
          type: integer
        etaMs:
          type: integer
          nullable: true
        rate:
          type: object
          additionalProperties: true
          properties:
            chunksPerSecond:
              type: number
        lastRunSummary:
          type: object
          nullable: true
          additionalProperties: true

    KbIngestVolumeExceededResponse:
      type: object
      description: |
        Structured refusal returned (not thrown) when the batch volume exceeds the
        MCP-callable threshold. The KB server's `'error' in result` contract converts
        this to an MCP `isError: true` result.
      properties:
        error:
          type: string
          example: "KB ingest work volume exceeds MCP-callable threshold"
        message:
          type: string
          description: Human-readable guidance, including the split-the-batch remedy.
        code:
          type: string
          enum: [KB_INGEST_VOLUME_EXCEEDED]
        bulkPath:
          type: string
          nullable: true
          description: |
            Runnable bulk-ingestion command. Currently `null` — the tenant-scoped bulk
            ingestion facade is Phase 2C; until it ships, split the batch (see `message`).
        batchSize:
          type: integer
          description: The computed batch volume that exceeded the threshold.
        threshold:
          type: integer
          description: The `mcpSyncMaxChunks` threshold (default 50).
