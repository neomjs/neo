name: PR Baseline

# This repository's caller for the shared PR baseline (`neomjs/neo-agent-skills`). The reusable workflow
# owns the executable jobs; this file owns the trigger, the permission ceiling, the inputs and the release
# tag in `uses:`.
#
# THREE CONTEXTS: `baseline / PR baseline` (every check that runs no pull-request code), `baseline / Skills
# materialized` and `baseline / guards`. The `dev` ruleset is the authority on which of them gate a merge;
# this comment only names them. `guards` runs the list below as one context, so a guard added to the list
# needs no ruleset edit, and all of them hold one of the organization's 20 concurrent job slots.
#
# THE TRIGGER IS THE CALLER'S OBLIGATION, and `edited` is the load-bearing entry: the body checks read the
# live body, so a corrected body goes green with no push only if this workflow fires on the edit.
# `ready_for_review` re-judges a draft when it becomes reviewable. A reusable workflow cannot see its
# caller's `on:` block, so nothing upstream can assert this for us.
#
# PERMISSIONS ARE LOAD-BEARING: a called job cannot request more than its caller grants, and the body checks
# read the pull request itself. Granting only `contents: read` is rejected before any job starts, as a
# `startup_failure` with no jobs, logs or annotations.
#
# PIN: a published release tag, never a SHA or a branch. The baseline's `Release ref` step refuses any
# other ref, and Dependabot's `github-actions` updates move the tag.
#
# `pr-base-guard.yml` complements the `PR base` check rather than duplicating it: it retargets a pull
# request opened against `main` to `dev`, while the check only refuses a wrong base.
#
# THE GUARDS run from the repository root after `npm ci`, each under `bash -e -o pipefail`, every one even
# after a red. `check-guard-ci-parity.spec.mjs` holds every CI-mirrored `lint-staged` guard to this list,
# the one place where a mirror is also a gate. The job checks out at depth 1, so the spec-retirement entry
# fetches the history its `origin/dev..HEAD` range reads. The hierarchy entry runs last because it writes
# the generated docs.
#
# THE GUIDES are judged by the baseline's own guide lint, at this tag, inside `PR baseline`, so no job checks
# out the Brain to run it. `dead-script-ref` is skipped because these guides name the Brain's `ai:*` scripts,
# which this repository does not define. The Brain runs that rule over these guides at its own `neo.mjs` pin.

on:
  pull_request:
    types: [opened, edited, synchronize, ready_for_review]

# A new head supersedes the run for the old one, which would otherwise queue and hold slots for it. A rerun
# gets its own group, so it never cancels the current head's run. A body edit waits rather than cancels:
# `same-head-check-repair.yml` reruns a same-head run that was cancelled.
concurrency:
  group: pr-baseline-${{ github.run_attempt == '1' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event.action != 'edited' }}

permissions:
  contents: read
  pull-requests: read

# THE TEAM ROSTER is the input to the commit-authorship check: who our agents are, and which addresses are
# theirs. It lives in the Brain and is read at the Brain's `dev`, never from the pull request under review.
jobs:
  baseline:
    uses: neomjs/neo-agent-skills/.github/workflows/reusable-pr-baseline.yml@v1.7.0
    with:
      required_base: dev
      guides: true
      guides_skip: '["dead-script-ref"]'
      team_roster_repository: neomjs/neo-agent-brain
      team_roster_path: ai/graph/agentCoAuthorEmails.mjs
      guards: |
        [
          {"name": "guard CI parity",           "run": "node ./buildScripts/util/check-guard-ci-parity.mjs"},
          {"name": "class module scope",        "run": "node ./buildScripts/util/check-class-module-scope.mjs"},
          {"name": "content root derivations",  "run": "node ./buildScripts/util/check-content-root-derivations.mjs"},
          {"name": "engine brain boundary",     "run": "node ./buildScripts/util/check-engine-brain-boundary.mjs"},
          {"name": "fixed sleeps",              "run": "node ./buildScripts/util/check-fixed-sleeps.mjs"},
          {"name": "JSDoc types",               "run": "node ./buildScripts/util/check-jsdoc-types.mjs"},
          {"name": "relative links",            "run": "npm run check-relative-links"},
          {"name": "theme coverage",            "run": "node ./buildScripts/util/check-theme-coverage.mjs"},
          {"name": "theme value files",         "run": "node ./buildScripts/util/check-theme-value-files.mjs"},
          {"name": "examples body only",        "run": "npm run check-examples-body-only"},
          {"name": "theme surfaces",            "run": "npm run check-theme-surfaces"},
          {"name": "front door fingerprint",    "run": "node ./buildScripts/util/check-front-door-fingerprint.mjs"},
          {"name": "package contents",          "run": "npm run check-package-contents"},
          {"name": "spec retirement",           "run": "git fetch --no-tags --unshallow origin \"+${GITHUB_REF}:refs/remotes/origin/pr\" +refs/heads/dev:refs/remotes/origin/dev && node ./buildScripts/util/check-spec-retirement.mjs < /dev/null"},
          {"name": "class hierarchy freshness", "run": "npm run generate-docs-json && git diff --exit-code -- docs/output/class-hierarchy.json"}
        ]
