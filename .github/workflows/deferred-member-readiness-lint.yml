name: Deferred Member Readiness Lint

# CI mirror of the .husky/pre-commit `lint-deferred-member-readiness` guard, so `git commit
# --no-verify` cannot bypass it.
#
# Path coverage MUST span every input the predicate reads: the scan roots that define the population
# of deferred members and their readers, and the registry that records accepted sites. A narrower
# filter would let a new undisciplined read land while the gate stays unrun — the guard present,
# correct, and never triggered.
#
# The scan roots are a deliberate SUPERSET of the files actually read: the walker skips test
# directories. watched ⊇ scanned is the invariant, and a superset never under-watches. Kept in sync
# with the lint's exported SCAN_SURFACE by lintWorkflowScanRootParity.spec.mjs.
on:
  pull_request:
    branches: [dev]
    paths:
      - 'ai/**/*.mjs'
      - 'src/**/*.mjs'
      - 'apps/**/*.mjs'
      - 'buildScripts/**/*.mjs'
      - 'ai/scripts/lint/deferred-member-registry.json'
      - '.github/workflows/deferred-member-readiness-lint.yml'
  push:
    branches: [dev]
    paths:
      - 'ai/**/*.mjs'
      - 'src/**/*.mjs'
      - 'apps/**/*.mjs'
      - 'buildScripts/**/*.mjs'
      - 'ai/scripts/lint/deferred-member-registry.json'
      - '.github/workflows/deferred-member-readiness-lint.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # --ignore-scripts skips the heavy prepare lifecycle the predicate does not need: it reads
      # source files and a JSON registry, nothing more.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint deferred-member readiness (every initAsync member has a discipline)
        run: node ./ai/scripts/lint/lint-deferred-member-readiness.mjs
