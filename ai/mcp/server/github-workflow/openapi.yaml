  /pulls/{pr_number}/review/manage:
    post:
      summary: Manage PR Review (Create or Update — atomic body + formal-state in one call)
      operationId: manage_pr_review
      x-neo-tool-tier: write
      x-neo-tool-summary: Create or update one formal PR review with body and review state validation.
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: false
      description: |
        Create or update one formal PR review. Read `.agents/skills/pr-review/SKILL.md` and use its exact cycle template. Create requires `pr_number`, `state`, and `body`; update requires `review_id` and `body`.

        APPROVED requires reviewer-keyed `acknowledgedRequestChanges` for outstanding current-head RCs. REQUEST_CHANGES is budgeted on post-cutover PRs: two submitted RCs, then COMMENT/APPROVED or one complete terminal Drop+Supersede. Incomplete history fails closed. `reviewBudgetOverrideReason` is a disclosed exceptional bypass persisted in the review body. CREATE bodies must not supply service-owned `[review-budget-managed]` / `[review-budget-override]` marker lines or their reserved audit-field list entries; the service rejects them before GitHub access and appends the canonical receipt itself when applicable. Direct gh/UI submission is outside this pre-submit gate and only receives workflow telemetry.
      tags: [PullRequests]
      parameters:
        - name: pr_number
          in: path
          required: true
          description: The number of the pull request (path placeholder; the request body's `pr_number` is the authoritative input for `create`).
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
                - body
              properties:
                action:
                  type: string
                  enum: [create, update]
                  description: The action to perform.
                  example: create
                pr_number:
                  type: integer
                  description: The pull request number (required for `create`).
                  example: 11273
                state:
                  type: string
                  enum: [APPROVED, REQUEST_CHANGES, COMMENT]
                  description: Review state (required for `create`).
                  example: APPROVED
                body:
                  type: string
                  description: The human-authored review body. For `create`, service-owned review-budget marker lines and reserved audit-field list entries are rejected.
                review_id:
                  type: string
                  description: The GraphQL node ID of the existing review (required for `update`, e.g. `PRR_*`).
                  example: "PRR_kwDOABcDef1234567890"
                acknowledgedRequestChanges:
                  type: object
                  additionalProperties:
                    type: string
                  description: |
                    Optional reviewer-login to disposition map for consciously approving over live `CHANGES_REQUESTED` reviews after applying pr-review §9.1. Only used for `action: create` + `state: APPROVED`; dispositions must be `addressed-by-<current-head-sha>` or `superior-evidence: <specific evidence>`.
                  example:
                    neo-gpt: "addressed-by-abc1234"
                reviewBudgetOverrideReason:
                  type: string
                  minLength: 1
                  pattern: '^[^\r\n]+$'
                  description: Single-line disclosure for an exceptional ordinary REQUEST_CHANGES after the post-cutover budget is exhausted; persisted in the review body.
      responses:
        '200':
          description: |
            Review created or updated successfully. Returns `reviewId` (PRR_* node ID), `state`, `url`, `submittedAt`, plus `databaseId` on create.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  reviewId:
                    type: string
                  state:
                    type: string
                  url:
                    type: string
                  submittedAt:
                    type: string
                  databaseId:
                    type: integer
                  reviewBudget:
                    type: object
                    description: Present on created REQUEST_CHANGES reviews.
                    properties:
                      activatedAt:
                        type: string
                        format: date-time
                        nullable: true
                      activationIssueNumber:
                        type: integer
                        description: Stable source issue whose closing-PR relationship defines the cutover.
                      activationPullRequestNumber:
                        type: integer
                        nullable: true
                        description: Earliest merged dev closer that activates the cohort; null before activation.
                      createdAt:
                        type: string
                        format: date-time
                      applicable:
                        type: boolean
                      ordinaryLimit:
                        type: integer
                      submittedRequestChanges:
                        type: integer
                      priorTerminalDropSupersede:
                        type: integer
                      outcome:
                        type: string
                        enum: [pre-activation, grandfathered, within-budget, terminal-drop-supersede, disclosed-override]
                      overrideReason:
                        type: string
        '400':
          description: Bad Request (invalid action / missing arguments / invalid state).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Pull request not found (create) or review id invalid (update).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: GraphQL API request failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /pulls/{pr_number}/reviewers/manage:
    post:
      summary: Manage PR Reviewers (Add or Remove)
      operationId: manage_pr_reviewers
      x-neo-tool-tier: write
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: false
      description: |
        Unified add/remove of GitHub PR reviewer-requests via the REST `requested_reviewers` endpoint (`POST` add / `DELETE` remove). This needs only the `repo` scope — not the `read:org` scope `gh pr edit` requires to resolve logins via GraphQL, which agent tokens routinely lack. Pairs with the cross-family review mandate (`pull-request §6.1`) as the **invitation layer** — the mandate is the validation layer (Approved-status before merge); this tool surfaces the active invitation primitive that pairs with it.

        **Action: 'add'** — `POST`s a review request for the listed users/teams.
        **Action: 'remove'** — `DELETE`s the review requests.

        At least one of `reviewers` or `team_reviewers` is required. A leading `@` on a login is stripped. Errors surface as `GH_API_ERROR` carrying the REST `requested_reviewers` response (repo-scope semantics), not a `gh` CLI exit code.

        **The result reports the effect, not the request.** GitHub accepts an unknown login on this endpoint and seats nobody — so a successful mutation response is not evidence a reviewer was assigned (measured: that call answered 200 with the full PR object). Every requested login is checked against the reviewer state in GitHub's own response: a login `add` did not seat fails with `REVIEWER_NOT_SEATED`, a login `remove` left in place fails with `REVIEWER_STILL_REQUESTED`, both naming each target under `unseated` rather than reporting partial success. `verifiedReviewers` / `verifiedTeamReviewers` are always derived from that response, never echoed from the arguments. Trust those fields, not the request you sent.
      tags: [PullRequests]
      parameters:
        - name: pr_number
          in: path
          required: true
          description: The number of the pull request.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum: [add, remove]
                  description: The action to perform.
                  example: add
                reviewers:
                  type: array
                  items:
                    type: string
                  description: An array of GitHub user logins to add or remove as reviewers.
                  example: ["neo-gemini-pro"]
                team_reviewers:
                  type: array
                  items:
                    type: string
                  description: An array of team slugs — bare slug, no owner prefix (the REST requested_reviewers endpoint takes the slug directly; the owner is NOT prepended).
                  example: ["maintainers"]
      responses:
        '200':
          description: Reviewer-requests updated AND verified — every requested login was confirmed seated (or, for `remove`, confirmed absent) in GitHub's returned reviewer state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagePrReviewersResponse'
        '400':
          description: Invalid arguments (bad action OR missing both reviewers and team_reviewers).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The call succeeded at the HTTP layer but the effect did not happen — `REVIEWER_NOT_SEATED` (an `add` GitHub answered successfully without seating a requested login, typically a nonexistent or non-collaborator account), `REVIEWER_STILL_REQUESTED` (a `remove` whose target is still listed as a requested reviewer — the seat is NOT free), or `REVIEWER_STATE_UNVERIFIABLE` (the response did not carry the reviewer arrays, so the outcome is unknown). Never reported as success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagePrReviewersErrorResponse'
        '500':
          description: REST `requested_reviewers` call failed (`GH_API_ERROR` — typically a repo-scope/permission or network error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


