// Sample Protobuf schema for the Cloud-Native KB Ingestion worked example.
// ProtoSource (full-corpus build) and ProtoParser (push path) both chunk this file.
syntax = "proto3";

package example.inventory;

// A single stock-keeping unit in the inventory.
message Product {
  string sku          = 1;
  string display_name = 2;
  int32  quantity     = 3;
}

// A warehouse location holding products.
message Warehouse {
  string id     = 1;
  string region = 2;
  repeated Product products = 3;
}

// Inventory lookups for client agents.
service InventoryService {
  rpc GetProduct   (Product)   returns (Product);
  rpc GetWarehouse (Warehouse) returns (Warehouse);
}
