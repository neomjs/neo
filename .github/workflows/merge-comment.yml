# Comments once on each pull request from outside the team when it merges: the author's standing, up to two open
# curated issues to take next, and an invitation at a new rung. For eligible accounts it reads the badge folder on
# neomjs/pages main so the comment can introduce the badge at a first merge and link the written record thereafter.
# The words live in buildScripts/util/contributorStanding.mjs and its spec; this file only fetches and posts.
#
# `pull_request_target` runs this file from the default branch, with a token that can comment on a fork's pull request
# and without waiting for run approval. The job therefore checks out nothing but the two modules, never the pull
# request's head, and reads the payload in script, never in a shell step. Its check runs anchor on the merged head,
# where a red one would stay (see review-admission-mergeability.yml), so a failed checkout, module load, search or post
# warns and ends green: the read counts merges that got no comment, so a miss still shows.
#
# `workflow_dispatch` renders the comment for one merged pull request into the job summary, and posts it only with
# `post`. Like any dispatch, it needs this file on the default branch first.
name: Merge comment

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr:
        description: The number of a merged pull request.
        required: true
        type: number
      post:
        description: Post the comment, rather than only rendering it into the job summary.
        type: boolean
        default: false

permissions:
  contents: read        # the sparse checkout of the two modules
  issues: read          # the labels of the issues the pull request closes
  pull-requests: write  # the comment: on a pull request it needs this scope, `issues: write` is refused

jobs:
  comment:
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.pull_request.merged == true &&
        github.event.pull_request.user.type != 'Bot' &&
        !contains(fromJSON('["COLLABORATOR","MEMBER","OWNER"]'), github.event.pull_request.author_association)
      )
    concurrency:
      group: merge-comment-${{ github.event.pull_request.number || inputs.pr }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the comment modules
        id: checkout
        uses: actions/checkout@v7
        # A failed checkout still runs the script, which reads the step's raw outcome and warns instead of posting,
        # even when the step failed after writing both modules.
        continue-on-error: true
        with:
          persist-credentials: false
          sparse-checkout: |
            buildScripts/util/claimResponse.mjs
            buildScripts/util/contributorStanding.mjs
          sparse-checkout-cone-mode: false

      - name: Comment on the merge
        uses: actions/github-script@v9
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const dispatched    = context.eventName === 'workflow_dispatch';

            try {
              if (process.env.CHECKOUT_OUTCOME !== 'success') throw new Error(`the checkout ended ${process.env.CHECKOUT_OUTCOME || 'without an outcome'}`);

              const {BADGES_SINCE, badgeFolder, decideMergeComment, parseOptOut} = await import(`${process.env.GITHUB_WORKSPACE}/buildScripts/util/contributorStanding.mjs`);
              const {CURATED_LABELS, isOutsideHuman, isTeamPermission} = await import(`${process.env.GITHUB_WORKSPACE}/buildScripts/util/claimResponse.mjs`);

              const pullRequest = dispatched
                ? (await github.rest.pulls.get({owner, repo, pull_number: Number(context.payload.inputs.pr)})).data
                : context.payload.pull_request;

              if (!pullRequest.merged) {
                core.info(`No comment: #${pullRequest.number} is not merged.`);
                return
              }

              const login        = pullRequest.user.login;
              const permissionOf = async username => (await github.rest.repos.getCollaboratorPermissionLevel({owner, repo, username})).data.permission;

              // A pull request's association hides a membership that is not public: the permission names the team
              if (!isOutsideHuman(pullRequest) || isTeamPermission(await permissionOf(login))) {
                core.info(`No comment: #${pullRequest.number} is from the team or a bot.`);
                return
              }

              const mergedAt = Date.parse(pullRequest.merged_at);
              // The UTC stamp ends in Z: a `+00:00` offset reaches the search as a space, and the count reads zero
              const stamp    = ms => new Date(ms).toISOString().replace(/\.\d{3}Z$/, 'Z');
              // An incomplete answer undercounts, and an undercount reads as a first merge: no comment, not a wrong one
              const search   = async (q, perPage) => {
                const {data} = await github.rest.search.issuesAndPullRequests({q, per_page: perPage});

                if (data.incomplete_results) throw new Error(`the search answered incompletely: ${q}`);

                return data
              };

              // Searches run one at a time: GitHub's secondary rate limit refuses bursts of them
              const mergedBefore = (await search(`org:${owner} is:public is:pr is:merged author:${login} merged:<${stamp(mergedAt)}`, 1)).total_count;

              core.info(`${login} had ${mergedBefore} merged before #${pullRequest.number}.`);
              const candidates   = [];

              for (const label of CURATED_LABELS) {
                candidates.push(...(await search(`repo:${owner}/${repo} is:issue is:open label:"${label}" no:assignee -linked:pr`, 50)).items)
              }

              // Pages writes no folder for an account on its opt-out list. Only a merge that earns a badge reads it,
              // and a list that cannot be read offers no badge, with a warning
              const launched = Boolean(BADGES_SINCE) && mergedAt >= Date.parse(BADGES_SINCE);
              const optOut   = launched
                ? await github.rest.repos.getContent({owner, repo: 'pages', path: 'badges/optout.json', ref: 'main'})
                  .then(({data}) => parseOptOut(Buffer.from(data.content, 'base64').toString('utf8')))
                  .catch(() => null)
                : null;

              if (launched && optOut === null) core.warning('No badge in the merge comment: the opt-out list of neomjs/pages is unreadable.');

              let folderWritten = false;
              if (optOut && !optOut.includes(Number(pullRequest.user.id))) {
                try {
                  const path = 'badges/' + badgeFolder(login, pullRequest.user.id);
                  await github.rest.repos.getContent({owner, repo: 'pages', path, ref: 'main'});
                  folderWritten = true;
                } catch (error) {
                  if (error.status !== 404) core.warning('Could not verify the badge folder on neomjs/pages.');
                }
              }

              const [closing, files, comments] = await Promise.all([
                github.graphql(`query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      closingIssuesReferences(first: 10) { nodes { labels(first: 30) { nodes { name } } } }
                    }
                  }
                }`, {owner, repo, number: pullRequest.number}),
                github.rest.pulls.listFiles({owner, repo, pull_number: pullRequest.number, per_page: 100}),
                github.paginate(github.rest.issues.listComments, {owner, repo, issue_number: pullRequest.number, per_page: 100})
              ]);

              const decision = decideMergeComment({
                candidates,
                closedLabels:closing.repository.pullRequest.closingIssuesReferences.nodes.flatMap(issue => issue.labels.nodes.map(label => label.name)),
                comments,
                folderWritten,
                mergedBefore,
                optOut,
                paths       : files.data.map(file => file.filename),
                pullRequest,
                repoUrl     : `https://github.com/${owner}/${repo}`
              });

              if (!decision) {
                core.info(`No comment: #${pullRequest.number} already carries one, or a heads-up.`);
                return
              }

              await core.summary.addHeading(`Merge comment for #${pullRequest.number}`).addCodeBlock(decision.body, 'markdown').write();

              if (dispatched && String(context.payload.inputs.post) !== 'true') {
                core.info('Dry run: the comment is in the job summary.');
                return
              }

              await github.rest.issues.createComment({owner, repo, issue_number: pullRequest.number, body: decision.body});
              core.info(`Commented on #${pullRequest.number}.`)
            } catch (error) {
              core.warning(`No merge comment: ${error.message}`)
            }
