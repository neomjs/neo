openapi: 3.0.0
info:
  title: Neo.mjs Neural Link MCP Server
  version: 1.0.0
x-neo-harness-tool-projection:
  defaultVisibleTiers:
    - read
  withheldUntilTopologicalLocking:
    - write-locked
  operatorOnlyTiers:
    - admin
  description: >
    Harness-embedded agents receive read-tier Neural Link tools by default.
    Write-locked tools are withheld until Topological Locking and explicit-target
    semantics exist. Admin tools stay operator-only unless a later authorization
    leaf grants them deliberately.
x-neo-exact-tool-profiles:
  description: >
    Server-pinned exact profiles declare their complete operation set and any
    narrower input schemas here. ToolService compiles this single OpenAPI authority
    for both tools/list visibility and tools/call validation; unknown or malformed
    profiles fail closed.
  profiles:
    local-readonly-probe:
      description: >
        Minimal loopback interoperability probe. It exposes only health, worker
        topology, and a depth-bounded lean component tree.
      tools:
        healthcheck: {}
        get_worker_topology: {}
        get_component_tree:
          inputSchema:
            type: object
            required:
              - depth
            properties:
              rootId:
                type: string
                description: Optional root component ID. Defaults to the App's MainView if available.
              depth:
                type: integer
                minimum: 1
                maximum: 2
                description: Bounded structural depth. 1=Self, 2=Self+Children.
              lean:
                type: boolean
                enum: [true]
                default: true
                description: The exact probe always returns the lean structural projection.
              sessionId:
                type: string
                description: The target App Worker Session ID.
paths:
  /health:
    post:
      summary: Health Check
      operationId: healthcheck
      x-neo-tool-tier: read
      x-annotations:
        readOnlyHint: true
      description: |
        Checks the health of the Neural Link server, including WebSocket connectivity and active sessions.

        **When to Use:**
        Use this as a first-step diagnostic tool to ensure the Neural Link bridge to the browser is operational.
      tags: [Health]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: {}
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
        '503':
          description: Server is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tool/handbook:
    post:
      summary: Tool Handbook
      operationId: get_mcp_tool_handbook
      x-neo-tool-tier: read
      x-annotations:
        readOnlyHint: true
      description: Returns lazy-loaded usage detail for one Neural Link MCP tool.
      tags: [Health]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toolId]
              properties:
                toolId:
                  type: string
                  description: Tool operation id to inspect.
      responses:
        '200':
          description: Tool handbook lookup result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  toolId:
                    type: string
                  found:
                    type: boolean
                  title:
                    type: string
                  description:
                    type: string
                  handbook:
                    type: string
                  source:
                    type: string
                  code:
                    type: string
                  message:
                    type: string
                  inputSchema:
                    type: object
                  outputSchema:
                    type: object

  /check_namespace:
    post:
      summary: Checks if a namespace exists in the current environment.
      operationId: check_namespace
      x-neo-tool-tier: read
      x-handler: check_namespace
      x-pass-as-object: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                namespace:
                  type: string
                  description: The namespace to check (e.g., 'Neo.button.Base').
                sessionId:
                  type: string
                  description: The target App Worker Session ID.
              required:
                - namespace
      responses:
        '200':
          description: Result indicating if the namespace exists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  exists:
                    type: boolean

  /instance/find:
    post:
      summary: Find Instances
      operationId: find_instances
      x-neo-tool-tier: read
      x-pass-as-object: true
      description: |
        Finds instances matching a set of properties.
        Example: `find_instances({selector: {className: 'Neo.state.Provider'}})`

        **When to Use:**
        To discover non-component instances (StateProviders, Stores, Managers) by properties or class name.
      tags: [Instance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindInstancesRequest'
      responses:
        '200':
          description: List of matching instances
          content:
            application/json:
              schema:
                type: object
                properties:
                  instances:
                    type: array
                    items:
                      type: object
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /get_namespace_tree:
    post:
      summary: Retrieves the loaded namespace tree from the runtime.
      operationId: get_namespace_tree
      x-neo-tool-tier: read
      x-handler: get_namespace_tree
      x-pass-as-object: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                root:
                  type: string
                  description: Optional root namespace to start from (defaults to 'Neo').
                sessionId:
                  type: string
                  description: The target App Worker Session ID.
      responses:
        '200':
          description: The namespace tree structure.
          content:
            application/json:
              schema:
                type: object
                properties:
                  root:
                    type: string
                  tree:
                    type: object

  /instance/properties/get:
    post:
      summary: Get Instance Properties
      operationId: get_instance_properties
      x-neo-tool-tier: read
      x-pass-as-object: true
      description: |
        Retrieves properties from a specific instance by its ID.

        **When to Use:**
        To inspect the current state of any Neo instance (e.g., Component, Store, Controller, Manager).

        **Serialization contract (deep objects):** a property whose value is itself a Neo instance
        (e.g. `vnode`, a hosted store) arrives as a compact identity SNAPSHOT via `toJSON()`, marked
        `__truncated: 'neo-instance-snapshot'` — never as the full object graph. Treat a marked
        payload as "structure not included", not as evidence about the structure's size or content.
        For tree-shaped reads use `query_vdom`, `get_component_tree`, or
        `inspect_component_render_tree` instead.
      tags: [Instance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetInstancePropertiesRequest'
      responses:
        '200':
          description: The values of the properties
          content:
            application/json:
              schema:
                description: The property values
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /component/styles/get:
    post:
      summary: Get Computed Styles
      operationId: get_computed_styles
      x-neo-tool-tier: read
      x-pass-as-object: true
      description: |
        Retrieves the computed styles for a component.

        **When to Use:**
        To verify visual state and theming (The "Visual Gap").
      tags: [Component]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetComputedStylesRequest'
      responses:
        '200':
          description: Computed styles
          content:
            application/json:
              schema:
                type: object
                properties:
                  styles:
                    type: object
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /component/rect/get:
    post:
      summary: Get Component DOM Rects
      operationId: get_dom_rect
      x-neo-tool-tier: read
      x-pass-as-object: true
      description: |
        Retrieves the DOM rectangles for one or more components.

        **When to Use:**
        To inspect the physical layout and visibility of components.
      tags: [Component]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetDomRectRequest'
      responses:
        '200':
          description: List of DOMRects
          content:
            application/json:
              schema:
                type: object
                properties:
                  rects:
                    type: array
                    items:
                      type: object
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /component/dom/events/get:
    post:
      summary: Get DOM Event Listeners
      operationId: get_dom_event_listeners
      x-neo-tool-tier: read
      x-pass-as-object: true
      description: |
        Retrieves detailed DOM event listeners for a specific component.

        **When to Use:**
        To debug event delegation and interaction logic on a specific component.
      tags: [Component]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetDomEventListenersRequest'
      responses:
        '200':
          description: List of event listeners
          content:
            application/json:
              schema:
                type: object
                properties:
                  listeners:
                    type: array
                    items:
                      type: object
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /component/dom/events/summary:
    post:
      summary: Get DOM Event Summary
      operationId: get_dom_event_summary
      x-neo-tool-tier: read
      x-pass-as-object: true
      description: |
        Retrieves a high-level summary of the DomEvent manager state.

        **When to Use:**
        To understand the global event landscape and identify potential hotspots.
      tags: [Component]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetDomEventSummaryRequest'
      responses:
        '200':
          description: Event summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalEvents:
                    type: integer
                  byEvent:
                    type: object
                  byComponent:
                    type: object
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /component/tree:
    post:
      summary: Get Component Tree
      operationId: get_component_tree
      x-neo-tool-tier: read
      x-pass-as-object: true
      description: |
        Retrieves the full component tree of the application.

        **When to Use:**
        To understand the structure of the UI, find component IDs, or debug hierarchy issues.
      tags: [Component]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetComponentTreeRequest'
      responses:
        '200':
          description: The component tree structure
          content:
            application/json:
              schema:
                type: object
                description: The component tree
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /component/render-tree/inspect:
    post:
      summary: Inspect Component Render Tree
      operationId: inspect_component_render_tree
      x-neo-tool-tier: read
      x-pass-as-object: true
      description: |
        Retrieves the render tree (VDOM/VNode) of a component.

        **When to Use:**
        To inspect the Virtual DOM (VDOM) structure, the actual DOM-aligned VNodes, or both for debugging rendering issues.
      tags: [Component]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
              properties:
                type:
                  type: string
                  enum: [vdom, vnode, both]
                  description: "The type of tree to retrieve."
                rootId:
                  type: string
                  description: Optional root component ID. Defaults to the App's MainView if available.
                depth:
                  type: integer
                  description: Depth limit. 1=Self, 2=Self+Children, -1=Infinite.
                sessionId:
                  type: string
                  description: The target App Worker Session ID.
      responses:
        '200':
          description: The requested tree structure(s)
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /data/store/inspect:
    post:
      summary: Inspect Store
      operationId: inspect_store
      x-neo-tool-tier: read
      x-pass-as-object: true
      description: |
        Inspects a specific data store.

        **When to Use:**
        To see the actual records, filters, sorters, and count of a Store.
      tags: [Data]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectStoreRequest'
      responses:
        '200':
          description: Store details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  count:
                    type: integer
                  model:
                    oneOf:
                      - type: string
                      - type: object
                  filters:
                    type: array
                    items:
                      type: object
                  sorters:
                    type: array
                    items:
                      type: object
                  items:
                    type: array
                    items:
                      type: object

  /data/store/list:
    post:
      summary: List Stores
      operationId: list_stores
      x-neo-tool-tier: read
      x-pass-as-object: true
      description: |
        Lists all active data stores.

        **When to Use:**
        To find available stores in the application.
      tags: [Data]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListStoresRequest'
      responses:
        '200':
          description: List of stores
          content:
            application/json:
              schema:
                type: object
                properties:
                  stores:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        model:
                          oneOf:
                            - type: string
                            - type: object
                        count:
                          type: integer
                        isLoaded:
                          type: boolean

  /data/record/get:
    post:
      summary: Get Record
      operationId: get_record
      x-neo-tool-tier: read
      x-pass-as-object: true
      description: |
        Retrieves a specific data record.

        **When to Use:**
        To inspect the full data of a single record.
      tags: [Data]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetRecordRequest'
      responses:
        '200':
          description: Record data
          content:
            application/json:
              schema:
                type: object

  /data/state/inspect:
    post:
      summary: Inspect State Provider
      operationId: inspect_state_provider
      x-neo-tool-tier: read
      x-pass-as-object: true
      description: |
        Inspects a specific state provider.

        **When to Use:**
        To view the hierarchical data of a StateProvider.
      tags: [Data]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectStateProviderRequest'
      responses:
        '200':
          description: State provider data
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  data:
                    type: object

  /data/state/modify:
    post:
      summary: Modify State Provider
      operationId: modify_state_provider
      x-neo-tool-tier: write-locked
      x-pass-as-object: true
      description: |
        Modifies the data of a specific state provider.

        **When to Use:**
        To update application state stored in a StateProvider.
      tags: [Data]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModifyStateProviderRequest'
      responses:
        '200':
          description: Modification successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /drag/state:
    post:
      summary: Get Drag State
      operationId: get_drag_state
      x-neo-tool-tier: read
      x-pass-as-object: true
      description: |
        Retrieves the state of the DragCoordinator.

        **When to Use:**
        To debug drag-and-drop operations, checking what is being dragged and where.
      tags: [Inspection]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId:
                  type: string
                  description: Target App Worker Session ID
      responses:
        '200':
          description: Drag Coordinator State
          content:
            application/json:
              schema:
                type: object

  /drag/trace:
    post:
      summary: Get Drag Trace
      operationId: get_drag_trace
      x-neo-tool-tier: read
      x-pass-as-object: true
      description: |
        Retrieves the recent drag-lifecycle traces recorded by SortZone (start geometry, per-move decisions, item switches, scroll activations, end resolution, grid lock verdicts).

        **When to Use:**
        To verify or debug drag-and-drop LOGIC decisions after driving a drag. Pair with observe_motion for the rendered-geometry side.
      tags: [Inspection]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId:
                  type: string
                  description: Target App Worker Session ID
                clear:
                  type: boolean
                  description: Empty the trace ring buffer after reading
      responses:
        '200':
          description: Recent drag traces
          content:
            application/json:
              schema:
                type: object

  /dock/diffDockTopology:
    post:
      summary: Diff Dock Topology
      operationId: diff_dock_topology
      x-neo-tool-tier: read
      x-pass-as-object: true
      description: Computes the semantic diff (moves, adds, removes, resizes, tabReorders, autoHideFlips) between a supplied before-document and a live dock workspace's current layout document. Output is deterministic and fail-closed on malformed documents.
      tags: [Dock]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [componentId, beforeDocument]
              properties:
                sessionId:
                  type: string
                  description: Target App Worker Session ID
                componentId:
                  type: string
                  description: The dock workspace / document-holder component id
                beforeDocument:
                  type: object
                  description: The earlier dockZone.v1 document to compare against the live current document
                sizeEpsilon:
                  type: number
                  description: Optional resize tolerance on split size fractions
      responses:
        '200':
          description: Semantic dock topology diff
          content:
            application/json:
              schema:
                type: object

  /dock/executeDockOperation:
    post:
      summary: Execute Dock Operation
      operationId: execute_dock_operation
      x-neo-tool-tier: write-locked
      x-pass-as-object: true
      description: Applies one dockZone.v1 semantic operation (addTab, moveItem, splitNode, resizeSplit, detachItem, closeItem, setItemPinned, setItemAutoHidden) to a live dock workspace and returns the post-operation document plus executor errors. Unknown operations are rejected with the vocabulary enumerated.
      tags: [Dock]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [componentId, descriptor]
              properties:
                sessionId:
                  type: string
                  description: Target App Worker Session ID
                componentId:
                  type: string
                  description: The dock workspace / document-holder component id
                descriptor:
                  type: object
                  description: The operation descriptor with an operation field plus its operation-specific parameters
      responses:
        '200':
          description: Post-operation state
          content:
            application/json:
              schema:
                type: object

  /dock/getDockTopology:
    post:
      summary: Get Dock Topology
      operationId: get_dock_topology
      x-neo-tool-tier: read
      x-pass-as-object: true
      description: Reads a live dock workspace's serializable layout document (splits, tabs, items, auto-hide states) plus the executable operation vocabulary. Use before and after execute_dock_operation to verify layout mutations.
      tags: [Dock]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [componentId]
              properties:
                sessionId:
                  type: string
                  description: Target App Worker Session ID
                componentId:
                  type: string
                  description: The dock workspace / document-holder component id
      responses:
        '200':
          description: The layout document and operation vocabulary
          content:
            application/json:
              schema:
                type: object

  /dock/capturePerspective:
    post:
      summary: Capture Perspective
      operationId: capture_perspective
      x-neo-tool-tier: write-locked
      x-pass-as-object: true
      description: Captures a live dock workspace as a named saved-layout record and stores it on the holder's perspective store when present. captureScope 'window' (default) captures the holder's own document; 'topology' captures the ordered multi-window workspace through the holder's getDockTopologyDocuments() seam. Name collisions return a structured verdict unless replace is true.
      tags: [Dock]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [componentId, layoutId]
              properties:
                sessionId:
                  type: string
                  description: Target App Worker Session ID
                componentId:
                  type: string
                  description: The dock workspace / document-holder component id
                layoutId:
                  type: string
                  description: Stable technical id for the captured record
                perspectiveName:
                  type: string
                  description: Product-facing name (resolves first on restore)
                title:
                  type: string
                  description: Display title
                captureScope:
                  type: string
                  enum: [window, topology]
                  description: window (default) or topology — the DockZoneModel.CAPTURE_SCOPES vocabulary
                replace:
                  type: boolean
                  description: Explicit decision to retire an existing holder of the name
      responses:
        '200':
          description: The capture result with the record and store verdict
          content:
            application/json:
              schema:
                type: object

  /dock/listPerspectives:
    post:
      summary: List Perspectives
      operationId: list_perspectives
      x-neo-tool-tier: read
      x-pass-as-object: true
      description: Lists a live dock workspace's stored perspectives (summaries plus the active layout id). Fails closed with a structured error when the holder exposes no perspective store.
      tags: [Dock]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [componentId]
              properties:
                sessionId:
                  type: string
                  description: Target App Worker Session ID
                componentId:
                  type: string
                  description: The dock workspace / document-holder component id
      responses:
        '200':
          description: Perspective summaries and the active layout id
          content:
            application/json:
              schema:
                type: object

  /dock/restorePerspective:
    post:
      summary: Restore Perspective
      operationId: restore_perspective
      x-neo-tool-tier: write-locked
      x-pass-as-object: true
      description: Restores a stored perspective by name, routed by the record's own captureScope - window records ride the holder's switch seam (or the store's fail-closed load); topology records reconcile onto the live windows and commit atomically through the holder's multi-document seam, reporting restored/unrestored/displaced. A refused restore leaves the live layout untouched with structured errors.
      tags: [Dock]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [componentId, name]
              properties:
                sessionId:
                  type: string
                  description: Target App Worker Session ID
                componentId:
                  type: string
                  description: The dock workspace / document-holder component id
                name:
                  type: string
                  description: The perspective's product name or technical layoutId
      responses:
        '200':
          description: The restore verdict and post-restore document
          content:
            application/json:
              schema:
                type: object

  /component/observeMotion:
    post:
      summary: Observe Motion
      operationId: observe_motion
      x-neo-tool-tier: read
      x-pass-as-object: true
      description: Samples component and raw DOM-node client rects over a time window for rendered-geometry motion traces. Use during drag choreography or animation debugging; duration is clamped to 8000ms per call.
      tags: [Component]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId:
                  type: string
                  description: Target App Worker Session ID
                windowId:
                  type: string
                  description: Main-thread window id for node-only sampling when no component target can provide routing context
                componentIds:
                  type: array
                  items:
                    type: string
                  description: Component ids to sample; at least one of componentIds, nodeIds, or cellsOf is required
                nodeIds:
                  type: array
                  items:
                    type: string
                  description: Raw DOM element ids to sample
                cellsOf:
                  type: object
                  properties:
                    rowId:
                      type: string
                      description: Raw row DOM id whose current child node ids should be sampled
                durationMs:
                  type: number
                  description: Sampling window, clamped to [100, 8000] (default 2000)
                intervalMs:
                  type: number
                  description: Sampling interval, clamped to [16, 1000] (default 100)
      responses:
        '200':
          description: Motion trace samples
          content:
            application/json:
              schema:
                type: object

  /component/verifyConsistency:
    post:
      summary: Verify Component Consistency
      operationId: verify_component_consistency
      x-neo-tool-tier: read
      x-pass-as-object: true
      description: |
        Diffs a container's three child-order surfaces — logical items, vdom child nodes, and the rendered DOM — reporting count, order, membership and duplicate mismatches.

        **When to Use:**
        To detect engine-vs-DOM divergence, e.g. duplicated or ghost children after drag-and-drop or vdom updates.
      tags: [Component]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [componentId]
              properties:
                sessionId:
                  type: string
                  description: Target App Worker Session ID
                componentId:
                  type: string
                  description: The container component id
      responses:
        '200':
          description: Consistency report
          content:
            application/json:
              schema:
                type: object

  /component/query:
    post:
      summary: Query Components
      operationId: query_component
      x-neo-tool-tier: read
      x-pass-as-object: true
      description: |
        Finds components matching a set of properties (semantic query).
        Example: `query_component({selector: {ntype: 'button', text: 'Save'}})`

        **When to Use:**
        To find components without knowing their ID, using fuzzy matching on properties.
      tags: [Component]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryComponentRequest'
      responses:
        '200':
          description: List of matching components
          content:
            application/json:
              schema:
                type: object
                properties:
                  components:
                    type: array
                    items:
                      type: object

  /component/create:
    post:
      summary: Create Component
      operationId: create_component
      x-neo-tool-tier: write-locked
      x-pass-as-object: true
      description: |
        Creates a component inside a target container at runtime — a schema-validated, CONSTRAINED
        alternative to the admin-tier `call_method(container.add(...))`.

        Disposition: retained as component-specific convenience sugar. Use `create_instance` for the
        general primitive that can create standalone Stores/Models/Controllers or attach a created
        component to a parent container.

        **When to Use:**
        To add a new component to a live container (e.g. add a `Button` to a `Toolbar`) without granting
        admin method-call access. The `config` must declare an `ntype` (e.g. `button`) or `className`
        (e.g. `Neo.button.Base`) — a `module` is a class reference and cannot cross the wire. The target
        container is resolved by `parentId`.
      tags: [Component]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateComponentRequest'
      responses:
        '200':
          description: Component added to the container
        '400':
          description: Invalid request body (config not an object, or missing module / ntype / className)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /instance/create:
    post:
      summary: Create Instance
      operationId: create_instance
      x-neo-tool-tier: write-locked
      x-pass-as-object: true
      description: |
        Creates any JSON-addressable Neo instance by `className` or `ntype` plus a JSON config.
        With `parentId`, the created component is attached to that live container; without `parentId`,
        the instance remains standalone (for example, a `Neo.data.Store`).

        This is a write-locked Neural Link tool. It does not widen read-only `harness-embedded`
        projections; only tool projections that already receive write-locked tools can see it.

        **When to Use:**
        Use this instead of `create_component` when the target may be a Store, Model, Controller,
        StateProvider, or any other non-component instance. Use `parentId` only when the created
        instance should also be inserted into a container. The config must stay data-only: `module`
        class references and function-bearing values are rejected; pass registered handler id strings
        for later handler-registry work.
      tags: [Instance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInstanceRequest'
      responses:
        '200':
          description: Instance created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInstanceResponse'
        '400':
          description: Invalid request body (missing className/ntype, module/class reference, or function-bearing config)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /component/remove:
    post:
      summary: Remove Component
      operationId: remove_component
      x-neo-tool-tier: write-locked
      x-pass-as-object: true
      description: |
        Removes (destroys) a live component by its id — a schema-validated, CONSTRAINED alternative to
        the admin-tier `call_method(component.destroy(...))`. The symmetric counterpart to `create_component`.

        **When to Use:**
        To remove a component from the live tree at runtime (e.g. dispose a transient dialog, or a
        no-longer-needed toolbar button) without granting admin method-call access. The component is
        resolved by `componentId`; the removal also detaches the node from the parent's DOM, not just the
        instance.
      tags: [Component]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveComponentRequest'
      responses:
        '200':
          description: Component destroyed and detached from its parent
        '400':
          description: Invalid request body (componentId missing)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /component/vdom/query:
    post:
      summary: Query VDOM
      operationId: query_vdom
      x-neo-tool-tier: read
      x-pass-as-object: true
      description: |
        Finds the first VDOM node matching a set of attributes (e.g. CSS classes).
        Example: `query_vdom({selector: {cls: 'my-class'}})`

