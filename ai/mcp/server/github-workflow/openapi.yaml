      operationId: get_discussion_conversation
      x-neo-tool-tier: read
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: true
      description: |
        Retrieves a GitHub Discussion's title/body metadata plus top-level comments and nested replies.

        **When to Use:**
        Use this tool for Ideation Sandbox review/re-poll cycles where only a specific comment,
        a delta after a known comment, or a small tail of recent comments is needed.

        **Comment selectors (optional, first-match precedence):**
        - `comment_id`: fetch ONLY the matching top-level discussion comment. Accepts the node ID
          (`DC_kwDO…`), the numeric database id, a `discussioncomment-N` URL anchor, or a full
          comment URL; an unrecognised shape errors instead of returning an empty list.
          Used for A2A hand-off after `manage_discussion_comment({action: 'create'})` returns
          `commentId`.
        - `since_comment_id`: fetch top-level discussion comments AFTER the one with the given ID
          (exclusive). If the ID is not found, returns an empty comments list.
        - `last_n`: fetch the last N top-level discussion comments.

        Omitting all selectors returns the full bounded Discussion conversation shape.
      tags: [Discussions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - discussion_number
              properties:
                discussion_number:
                  type: integer
                  description: The number of the discussion to retrieve.
                  example: 10137
                comment_id:
                  type: string
                  description: >-
                    Return only the matching top-level discussion comment. Accepts a node ID (current
                    `DC_…` or legacy base64), the numeric database id, a `discussioncomment-N` URL
                    anchor, or a full comment URL. An unrecognised shape returns MALFORMED_COMMENT_ID;
                    a well-formed id absent from the thread returns an empty comments list. Scoped
                    requests omit the discussion body and set `bodyOmitted: true`.
                  example: "discussioncomment-18028896"
                since_comment_id:
                  type: string
                  description: >-
                    Return only top-level discussion comments AFTER the one with this ID (exclusive).
                    Accepts the same four spellings as `comment_id`. Unrecognised shape errors; a
                    well-formed but absent id returns empty comments. Scoped requests omit the body.
                  example: "discussioncomment-18028896"
                last_n:
                  type: integer
                  description: >-
                    Return only the last N top-level discussion comments. This is a scoped request, so
                    the discussion body is omitted and `bodyOmitted: true` is set.
                  example: 3
      responses:
        '200':
          description: Discussion conversation data, optionally narrowed by selector.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The canonical GitHub global node ID of the discussion.
                  number:
                    type: integer
                    description: The GitHub Discussion number.
                  title:
                    type: string
                  body:
                    type: string
                    description: >-
                      The discussion body. ABSENT on scoped requests — check `bodyOmitted` rather than
                      reading an absent body as an empty one.
                  bodyOmitted:
                    type: boolean
                    description: >-
                      Present and `true` only on scoped requests, where `body` was deliberately not
                      returned. Distinguishes "scoped away" from "this discussion has an empty body".
                  url:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                  author:
                    type: object
                    properties:
                      login:
                        type: string
                  category:
                    type: object
                    properties:
                      name:
                        type: string
                  comments:
                    type: object
                    properties:
                      nodes:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: The GitHub global node ID of the discussion comment.
                            author:
                              type: object
                              properties:
                                login:
                                  type: string
                            body:
                              type: string
                            createdAt:
                              type: string
                              format: date-time
                            updatedAt:
                              type: string
                              format: date-time
                            url:
                              type: string
                            isAnswer:
                              type: boolean
                            replies:
                              type: object
                              properties:
                                nodes:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      id:
                                        type: string
                                      author:
                                        type: object
                                        properties:
                                          login:
                                            type: string
                                      body:
                                        type: string
                                      createdAt:
                                        type: string
                                        format: date-time
                                      updatedAt:
                                        type: string
                                        format: date-time
                                      url:
                                        type: string
                                      isAnswer:
                                        type: boolean
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Discussion not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /discussions/comments/manage:
    post:
      summary: Manage Discussion Comments (Create or Update)
      operationId: manage_discussion_comment
      x-neo-tool-tier: extended
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: false
      description: |
        Unified tool for creating and updating comments on GitHub discussions.

        **Action: 'create'**
        - Creates a new comment on a discussion.
        - Requires `body` and `discussion_number`.
        - Posts `body` as-authored; GitHub's authenticated author is the attribution.
        - Returns `commentId` for scoped hand-off via `get_discussion_conversation`.

        **Action: 'update'**
        - Updates an existing discussion comment.
        - Requires `comment_id` and `body`.
      tags: [Issues]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
                - body
              properties:
                action:
                  type: string
                  enum: [create, update]
                  description: The action to perform.
                  example: create
                discussion_number:
                  type: integer
                  description: The number of the discussion (required for 'create').
                  example: 456
                comment_id:
                  type: string
                  description: The global node ID of the comment (required for 'update').
                  example: "DC_kwDOABcD1234567890"
                body:
                  type: string
                  description: The content of the comment.
      responses:
        '200':
          description: Comment created or updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /issues/relationship:
    post:
      summary: Manage Issue Relationships (Parent-Child and Blocked-By)
      operationId: update_issue_relationship
      x-neo-tool-tier: write
      x-neo-tool-summary: Create, replace, or remove issue parent-child and blocked-by relationships.
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: false
      description: |
        Manages relationships between GitHub issues including parent-child hierarchies and blocked-by dependencies.
        This tool allows you to set or unset relationships between issues on GitHub.

        **Relationship Types:**
        - **parent_child**: Creates hierarchical relationships (epics with sub-tasks)
        - **blocked_by**: Creates dependency relationships (issue A is blocked by issue B)

        **When to Use:**
        - To organize work by creating issue hierarchies (epics with sub-tasks)
        - To track dependencies where one issue blocks another
        - To unlink issues from their relationships
        - To move a child issue from one parent to another

        **Important Notes:**
        - Changes are made directly on GitHub via the GraphQL API
        - The local markdown mirror is refreshed by the scheduled Data Sync pipeline; use live GitHub reads when freshness matters
        - For parent_child: An issue can only have ONE parent at a time
        - For blocked_by: An issue can be blocked by MULTIPLE issues
        - Use `replace_parent=true` to replace an existing parent relationship (parent_child only)
        - To remove relationships, call with only `child_issue` specified (omit `parent_issue`)

        **Workflow:**
        1. Identify the issue numbers and relationship type
        2. Call this tool to establish or modify the relationship
        3. Read the updated relationship from live GitHub; the scheduled Data Sync pipeline refreshes the local markdown mirror
      tags: [Issues]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - child_issue
              properties:
                relationship_type:
                  type: string
                  enum: [parent_child, blocked_by]
                  description: |
                    The type of relationship to manage:
                    - parent_child: Hierarchical parent-child relationships
                    - blocked_by: Dependency blocking relationships
                  default: parent_child
                  example: parent_child
                child_issue:
                  type: integer
                  description: |
                    The issue number of the child/blocked issue.
                    For parent_child: This is the sub-issue.
                    For blocked_by: This is the issue being blocked.
                  example: 7388
                parent_issue:
                  type: integer
                  description: |
                    The issue number of the parent/blocking issue.
                    For parent_child: This is the parent issue.
                    For blocked_by: This is the issue doing the blocking.
                    Omit this field (or set to null) to remove the relationship.
                  example: 7385
                replace_parent:
                  type: boolean
                  description: |
                    Only applicable for parent_child relationships.
                    If true, replaces the child's existing parent relationship.
                    If false and the child already has a parent, the operation will fail.
                  default: false
      responses:
        '200':
          description: Relationship updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateIssueRelationshipResponse'
        '500':
          description: Internal server error, e.g., GraphQL API failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /repository/viewer-permission:
    get:
      summary: Get Viewer Permission
      operationId: get_viewer_permission
      x-neo-tool-tier: read
      x-annotations:
        readOnlyHint: true
      description: |
        Retrieves the permission level of the currently authenticated user (viewer) for the repository.

        **When to Use:**
        Call this tool to determine your capabilities before attempting a restricted action (e.g., assigning an issue, merging a PR). The agent is responsible for interpreting the returned permission level.

        **Permission Levels:**
        - `ADMIN`: Can read, write, and manage the repository.
        - `MAINTAIN`: Can read, write, and manage issues and pull requests.
        - `WRITE`: Can read and write to the repository.
        - `TRIAGE`: Can manage issues and pull requests.
        - `READ`: Can read the repository.
      tags: [Repository]
      responses:
        '200':
          description: The viewer's permission level for the repository.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewerPermissionResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /system/state/transition:
    post:
      summary: Signal State Transition
      operationId: signal_state_transition
      x-neo-tool-tier: write
      x-pass-as-object: true
      x-annotations:
        readOnlyHint: false
      description: |
        Provides a native state-trap for Headless Orchestration to gracefully capture execution states or signal logic failures.

        Support `state: 'PR_OPENED'` to trigger autonomous turn-completion and shutdown sequences.
        Support `state: 'BLOCKED'` and `state: 'HANDOFF'` for derailed agents, enabling them to pass a localized artifact mapping the problem back to the Orchestrator, which natively applies the `agent-task:blocked` label on GitHub.
      tags: [Issues]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - state
              properties:
                state:
                  type: string
                  enum: [PR_OPENED, BLOCKED, HANDOFF]
                  description: The execution state to signal.
                target_id:
                  type: integer
                  description: The target Issue or PR number associated with this state.
                artifact_path:
                  type: string
                  description: Optional file path to a localized artifact mapping the problem.
      responses:
        '200':
          description: State transition signal received and processed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalStateTransitionResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    HealthCheckResponse:
      type: object
      properties:
        status:
          type: string
          example: "healthy"
        timestamp:
          type: string
          format: date-time
          description: The ISO 8601 timestamp of when the health check was performed.
        version:
          type: string
          description: The version of the MCP server.
          example: "1.0.0"
        runtimeFreshness:
          type: object
          description: Compact boot-vs-current runtime freshness diagnostic for detecting stale GitHub Workflow MCP process attachments.
          properties:
            status:
              type: string
              enum: [current, stale, unknown]
              description: Whether service-owned OpenAPI identity marks the running process stale. Git HEAD drift is contextual only.
            startedAt:
              type: string
              format: date-time
              description: When the MCP runtime module was loaded.
            stale:
              type: object
              description: Per-identity stale flags. Null means the field could not be compared; gitHead is informational and does not by itself mark status stale.
              properties:
                gitHead:
                  type: boolean
                  nullable: true
                openApiDigest:
                  type: boolean
                  nullable: true
            details:
              type: array
              items:
                type: string
            hint:
              type: string
              nullable: true
              description: Restart or re-handshake guidance when the runtime is stale.
        githubCli:
          type: object
          properties:
            installed:
              type: boolean
              example: true
            authenticated:
              type: boolean
              example: true
            versionOk:
              type: boolean
              example: true
            version:
              type: string
              example: "2.81.0"
            details:
              type: array
              items:
                type: string
        notificationPreview:
          type: object
          description: A passive inbox preview of unread GitHub notifications. Present only if authenticated.
          properties:
            unreadCount:
              type: integer
              description: Total number of unread notifications.
              example: 3
            latest:
              type: array
              description: The 5 most recent unread notifications.
              items:
                type: object
                properties:
                  id:
                    type: string
                  reason:
                    type: string
                  type:
                    type: string
                  title:
                    type: string
                  url:
                    type: string

    Label:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        color:
          type: string

    LabelListResponse:
      type: object
      properties:
        count:
          type: integer
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'

    PullRequest:
      type: object
      required: [mergedAt, reviewDecision, reviewRequests, baseRefName, headRefOid, mergeStateStatus]
      properties:
        number:
          type: integer
          example: 123
        title:
          type: string
          example: "feat: Add new component"
        author:
          type: object
          properties:
            login:
              type: string
              example: "some-contributor"
        url:
          type: string
          format: uri
          example: "https://github.com/neomjs/neo/pull/123"
        state:
          type: string
          enum: [OPEN, CLOSED, MERGED]
          example: "OPEN"
        createdAt:
          type: string
          format: date-time
          example: "2025-10-08T12:00:00.000Z"
        mergedAt:
          type: string
          format: date-time
          nullable: true
          description: Merge timestamp, or null when the pull request is not merged.
        reviewDecision:
          type: string
          nullable: true
          description: GitHub's current aggregate review decision, or null when absent.
        reviewRequests:
          type: array
          nullable: true
          description: Complete current reviewer requests; null means unavailable, truncated, or structurally unknown.
          items:
            type: object
            required: [kind, login]
            properties:
              kind:
                type: string
                enum: [user, team]
              login:
                type: string
                description: User login or organization/team slug.
        baseRefName:
          type: string
          nullable: true
          description: Current base branch name, or null when unavailable.
        headRefOid:
          type: string
          nullable: true
          description: Current head commit object ID, or null when unavailable.
        mergeStateStatus:
          type: string
          nullable: true
          description: GitHub's current merge-state status, or null when unavailable.

    PullRequestListResponse:
      type: object
      properties:
        count:
          type: integer
          description: Number of pull requests returned
          example: 5
        pullRequests:
          type: array
          items:
            $ref: '#/components/schemas/PullRequest'
        checkedAt:
          type: string
          format: date-time
          description: Source-read completion time; present only when believedOpen is supplied.
        belief:
          $ref: '#/components/schemas/PullRequestBelief'

    PullRequestBelief:
      type: object
      required: [stillOpen, falsified, unverifiable]
      properties:
        stillOpen:
          type: array
          description: Submitted numbers whose directly resolved current state is OPEN.
          items:
            type: integer
        falsified:
          type: array
          description: Submitted numbers whose directly resolved current state is terminal.
          items:
            type: object
            required: [number, state, mergedAt]
            properties:
              number:
                type: integer
              state:
                type: string
                enum: [CLOSED, MERGED]
              mergedAt:
                type: string
                format: date-time
                nullable: true
        unverifiable:
          type: array
          description: Submitted numbers the direct lookup could not observe; these are not falsified.
          items:
            type: object
            required: [number, reason]
            properties:
              number:
                type: integer
              reason:
                type: string
                enum: [not-found-or-inaccessible]

    PullRequestConversation:
      type: object
      properties:
        title:
          type: string
        body:
          type: string
        author:
          type: object
          properties:
            login:
              type: string
              description: The GitHub username of the PR author.
        comments:
          type: array
          items:
            type: object
            properties:
              author:
                type: object
                properties:
                  login:
                    type: string
                    description: The GitHub username of the comment author.
              body:
                type: string
              createdAt:
                type: string
                format: date-time

    SuccessResponse:
      type: object
      properties:
        message:
          type: string
          example: "Operation completed successfully"
        details:
          type: string
          description: Optional details from the CLI output.
          example: "Checked out branch 'some-contributor/my-feature-branch'"

    CheckoutPullRequestResponse:
      type: object
      description: Verifiable result for `checkout_pull_request`; callers should compare `headSha` with the current PR head before executing tests.
      properties:
        message:
          type: string
          example: "Successfully checked out PR #123"
        details:
          type: string
          description: Optional details from the CLI output.
          example: "Switched to branch 'some-contributor/my-feature-branch'"
        repoPath:
          type: string
          description: Verified git top-level mutated by the checkout.
          example: "/Users/Shared/codex/neomjs/neo"
        branch:
          type: string
          description: Current branch after checkout; empty when Git leaves the worktree detached.
          example: "some-contributor/my-feature-branch"
        headSha:
          type: string
          description: "`git rev-parse HEAD` read back from `repoPath` after checkout."
          example: "0123456789abcdef0123456789abcdef01234567"

    ManagePrReviewersResponse:
      type: object
      description: |
        Verifiable result for `manage_pr_reviewers`. The reviewer lists are read out of GitHub's
        `requested_reviewers` response, NOT echoed from the request — GitHub accepts an unknown login and
        seats nobody (measured: that call answered 200 with the full PR object), so a success message built
        from the arguments would report a reviewer that does not exist. A requested change GitHub did not
        apply fails with `REVIEWER_NOT_SEATED` / `REVIEWER_STILL_REQUESTED` rather than reporting partial
        success.

        Every field is required: a success payload missing the verification fields is exactly the defect
        this response type exists to make impossible, and without a `required` list an empty object
        satisfies the declared contract.
      required: [message, pr_number, verifiedReviewers, verifiedTeamReviewers]
      properties:
        message:
          type: string
          example: "Successfully requested reviewers on PR #123: neo-gpt (verified against the returned reviewer state)"
        pr_number:
          type: integer
          description: The pull request the reviewer state was verified on.
          example: 123
        verifiedReviewers:
          type: array
          items:
            type: string
          description: User logins actually seated as requested reviewers, read back from GitHub's response after the mutation.
          example: ["neo-gpt"]
        verifiedTeamReviewers:
          type: array
          items:
            type: string
          description: Team slugs actually seated as requested reviewers, read back from GitHub's response after the mutation.
          example: []

    ManagePrReviewersErrorResponse:
      type: object
      description: |
        Structured failure for `manage_pr_reviewers` when GitHub answered successfully but the requested
        reviewer change did not take effect. Distinct from the generic `ErrorResponse` because the caller
        needs the observed state to act: which targets did not move (`unseated`) and who GitHub currently
        reports as seated (`verifiedReviewers` / `verifiedTeamReviewers`).

        `code` carries the direction that failed, and the two directions describe OPPOSITE observed states:
        `REVIEWER_NOT_SEATED` means an `add` target is ABSENT from the returned reviewer state, while
        `REVIEWER_STILL_REQUESTED` means a `remove` target is still PRESENT — so its seat is not free, and
        remediation aimed at a nonexistent login would be wrong.

        `unseated` and the verified arrays are documented but NOT required, because
        `REVIEWER_STATE_UNVERIFIABLE` is the case where the response carried no reviewer arrays at all.
        Requiring them there would force this schema to publish empty arrays, which read as "GitHub reports
        nobody seated" — a definite claim about the exact state that is unknown. Only the four fields that
        every failure can honestly supply are required.
      required: [error, message, code, pr_number]
      properties:
        error:
          type: string
          example: "Reviewer still requested"
        message:
          type: string
          example: "neo-gpt remain requested reviewers on PR #123: the removal was not applied."
        code:
          type: string
          enum: [REVIEWER_NOT_SEATED, REVIEWER_STILL_REQUESTED, REVIEWER_STATE_UNVERIFIABLE]
          description: Which postcondition failed. `REVIEWER_NOT_SEATED` — an `add` target is absent. `REVIEWER_STILL_REQUESTED` — a `remove` target is still present. `REVIEWER_STATE_UNVERIFIABLE` — the response carried no reviewer arrays, so the outcome is unknown.
          example: "REVIEWER_STILL_REQUESTED"
        pr_number:
          type: integer
          description: The pull request whose reviewer state was read.
          example: 123
        unseated:
          type: array
          items:
            type: string
          description: Targets whose requested change was not applied — absent after `add`, still present after `remove`. Omitted on `REVIEWER_STATE_UNVERIFIABLE`, where no per-target verdict could be reached.
          example: ["neo-gpt"]
        verifiedReviewers:
          type: array
          items:
            type: string
          description: User logins GitHub reports as seated right now — the same meaning as on the success path. Omitted on `REVIEWER_STATE_UNVERIFIABLE`.
          example: ["neo-gpt"]
        verifiedTeamReviewers:
          type: array
          items:
            type: string
          description: Team slugs GitHub reports as seated right now. Omitted on `REVIEWER_STATE_UNVERIFIABLE`.
          example: []

    CommentResponse:
      type: object
      description: |
        Enriched response for comment create/update operations. Surfaces the canonical
        `commentId` (GitHub global node ID) so callers can reference the comment in
        downstream A2A propagation patterns. `createdAt` is populated on create;
        `updatedAt` on update. Superset of `SuccessResponse` — existing consumers that
        only read `message` continue to work unchanged.
      properties:
        message:
          type: string
          description: Human-readable confirmation of the operation.
          example: "Successfully created comment on PR #10272"
        commentId:
          type: string
          description: "The canonical GitHub global node ID of the comment. Use with `get_conversation({comment_id: ...})` or in A2A payloads to reference just-this-comment."
          example: "IC_kwDOABcD1234567890"
        url:
          type: string
          description: The canonical HTTP URL of the comment on github.com.
          example: "https://github.com/neomjs/neo/pull/10272#issuecomment-4309098042"
        createdAt:
          type: string
          format: date-time
          description: The creation timestamp (ISO-8601). Populated by 'create' action only.
          example: "2026-04-24T01:48:14Z"
        updatedAt:
          type: string
          format: date-time
          description: The last-modified timestamp (ISO-8601). Populated by 'update' action only.
          example: "2026-04-24T02:15:33Z"

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "GitHub CLI command failed"
        message:
          type: string
          example: "gh pr checkout 123 failed with exit code 1"
        code:
          type: string
          example: "GH_CLI_ERROR"

    CreateIssueResponse:
      type: object
      properties:
        issueNumber:
          type: integer
          description: The number of the newly created issue.
        url:
          type: string
          format: uri
          description: The URL of the newly created issue.

    SignalStateTransitionResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Indicates whether the state transition was recorded successfully.
          example: true
        message:
          type: string
          description: A human-readable message describing the outcome.
          example: "State PR_OPENED processed. Orchestrator turn completed."

    UpdateIssueRelationshipResponse:
      type: object
      properties:
        message:
          type: string
          description: A human-readable message describing the result of the operation.
          example: "Successfully set #7385 as parent of #7388"
        childIssue:
          type: integer
          description: The issue number of the child issue.
          example: 7388
        parentIssue:
          type: integer
          nullable: true
          description: The issue number of the parent issue, or null if the parent was removed.
          example: 7385
        oldParent:
          type: integer
          description: The previous parent issue number, if one was replaced or removed.
          example: 7380
        replaceParentApplied:
          type: boolean
          description: Indicates whether the replace_parent flag was used.
          example: false

    LocalIssueResponse:
      type: object
      properties:
        filePath:
          type: string
          description: The absolute path to the found issue file.
          example: /path/to/project/.github/ISSUE/issue-7608.md
        content:
          type: string
          description: The full markdown content of the issue file.

    ViewerPermissionResponse:
      type: object
      properties:
        permission:
          type: string
          description: The permission level of the viewer.
          enum: [ADMIN, MAINTAIN, WRITE, TRIAGE, READ]
          example: WRITE

    Issue:
      type: object
      properties:
        number:
          type: integer
          example: 7608
        title:
          type: string
        body:
          type: string
        state:
          type: string
          example: OPEN
        author:
          type: object
          properties:
            login:
              type: string
        url:
          type: string
          format: uri
        labels:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
        assignees:
          type: array
          items:
            type: object
            properties:
              login:
                type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    IssueListResponse:
      type: object
      properties:
        count:
          type: integer
          description: How many issues THIS page returned. Compare with `totalCount` before treating it as the whole answer.
        totalCount:
          type: integer
          nullable: true
          description: How many issues match the SERVER-side filters (state, assignee) in total. `count < totalCount` means the answer is bounded, not complete. Null when a `labels` filter is set, because the server's count then describes a broader query than you asked — an admitted unknown rather than a wrong number you cannot detect.
        truncated:
          type: boolean
          description: True when more matches exist beyond this page. A bounded answer that cannot say it was bounded is indistinguishable from a complete one.
        endCursor:
          type: string
          nullable: true
          description: Cursor for the next page when `truncated` is true; null otherwise.
        issues:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
