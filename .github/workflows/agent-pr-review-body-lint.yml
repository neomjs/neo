name: Agent PR Review Body Lint

# Post-submit telemetry for the `gh pr review` / UI bypass surface (#11495), companion
# to the managed tool's pre-submit template + review-budget gates. This workflow catches
# malformed reviews and posts a corrective signal after submission; it cannot undo a
# third ordinary RC or otherwise reproduce the managed gate.

on:
  pull_request_review:
    types: [submitted, edited]


jobs:
  lint-pr-review-body:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Review Body
        uses: actions/github-script@v9
        with:
          script: |
            const review   = context.payload.review;
            const pr       = context.payload.pull_request;
            const reviewer = review.user.login;
            const body     = review.body || "";

            // Only enforce for known AI agent accounts. Human reviewers are exempt;
            // a `neo-`-prefix heuristic also catches future agent identities (mirrors
            // `agent-pr-body-lint.yml` author-side filter shape).
            const agentReviewers = ['neo-opus-ada', 'neo-opus-grace', 'neo-opus-vega', 'neo-gemini-pro', 'neo-gpt'];
            const isAgentReviewer = agentReviewers.includes(reviewer) || reviewer.startsWith('neo-');

            if (!isAgentReviewer) {
              console.log(`✅ Reviewer ${reviewer} is not an AI agent. Skipping lint.`);
              return;
            }

            const reviewState = (review.state || '').toLowerCase();
            const selectsCommentedClosure = body.includes('# Pull Request Micro-Delta Review') &&
              /^\s*-\s*\[[xX]\]\s*\*\*COMMENTED CLOSURE\*\*/m.test(body);
            const isCommentedClosure = reviewState === 'commented' && selectsCommentedClosure;
            const reviewLines = body.split("\n").map(line => line.trim());
            const dropSupersedeStatus = reviewLines.includes("**Status:** Drop+Supersede");
            const dropSupersedeDecision = reviewLines.includes("- **Decision**: Drop+Supersede");
            const dropSupersedeIntent = dropSupersedeStatus || dropSupersedeDecision;

            if (dropSupersedeIntent) {
              if (reviewState !== 'changes_requested') {
                core.setFailed('A terminal Drop+Supersede verdict must use GitHub review state CHANGES_REQUESTED.');
                return;
              }

              const dispositions = new Set([
                'implementation-off',
                'ticket-prescription-off',
                'ticket-premise-dead'
              ]);
              const contractFields = [
                'Source-coordinate falsifiers',
                'Salvage map',
                'Successor landing pad',
                'Successor map citation'
              ];
              const fieldValue = label => {
                const prefix = `- **${label}:**`;
                const line   = body.split("\n").find(candidate => candidate.trim().startsWith(prefix));
                return line ? line.trim().slice(prefix.length).trim() : '';
              };
              const missing = contractFields.filter(label => {
                const value = fieldValue(label);
                return !value || /^\[.*\]$/.test(value) || /^(?:todo|tbd)$/i.test(value);
              });
              const disposition = fieldValue('Disposition');

              if (!dropSupersedeStatus || !dropSupersedeDecision) missing.unshift('Status + Decision');
              if (!dispositions.has(disposition)) missing.unshift('Disposition');

              if (missing.length > 0) {
                core.setFailed(`Drop+Supersede body is incomplete: ${missing.join(', ')}.`);
                return;
              }
            }

            if (selectsCommentedClosure && reviewState !== 'commented') {
              core.setFailed('COMMENTED CLOSURE must use GitHub review state COMMENTED; it cannot create another REQUEST_CHANGES review.');
              return;
            }

            // A Round 2 declares itself in its H1, and it is checked HERE rather than further down
            // because the generic COMMENTED skip below used to return first. That ordering exempted
            // the exact shape the format prescribes: a disposition carrying a STILL_OPEN item posts
            // as COMMENTED precisely so it spends no new Request-Changes round and the original
            // Round-1 review stays authoritative for that item — and CI then skipped it entirely.
            // The one state the terminal-round design depends on was the one state it was never
            // validated in.
            const isRound2Disposition = /^#[ \t]+PR Review — Round 2\b/m.test(body);

            // Body-only Status coherence, mirroring `getRound2StateCoherenceFailure` in
            // `PullRequestService.mjs`. Deliberately scoped to what a body alone decides: the
            // prior-round relation checks (row count, verbatim quoting) need PR history and stay
            // submit-only. Without this, the exact contradiction the managed dry-run now refuses
            // stays submittable by clicking, which is the bypass this workflow exists to observe.
            if (isRound2Disposition) {
              const LEGAL_ROUND_2_STATUSES = ['Approved', 'Approve+Follow-Up', 'Comment'];
              const DISPOSITIONS           = ['ADDRESSED', 'DEFENDED', 'STILL_OPEN'];
              const statusMatch            = body.match(/^\*\*Status:\*\*[ \t]*(.+?)[ \t]*$/m);
              const declaredStatus         = statusMatch ? statusMatch[1].replace(/[*_`]/g, '').trim() : null;

              const dispositionCells = body.split('\n')
                .filter(line => line.trim().startsWith('|') && DISPOSITIONS.some(verb => line.includes(verb)))
                .map(line => line.split('|').slice(1, -1).map(cell => cell.trim()))
                .map(cells => cells.find(cell => DISPOSITIONS.includes(cell)))
                .filter(Boolean);

              if (!declaredStatus) {
                core.setFailed(`Round-2 review by ${reviewer} declares no \`**Status:**\`. State exactly one of ${LEGAL_ROUND_2_STATUSES.join(', ')} — any STILL_OPEN row means Comment.`);
                return;
              }

              if (!LEGAL_ROUND_2_STATUSES.some(status => status.toLowerCase() === declaredStatus.toLowerCase())) {
                core.setFailed(`Round-2 review by ${reviewer} declares \`**Status:** ${declaredStatus}\`, which is not a legal Round-2 status (${LEGAL_ROUND_2_STATUSES.join(', ')}). Request Changes is not among them: a discharged round approves, an open one comments.`);
                return;
              }

              if (dispositionCells.includes('STILL_OPEN') && declaredStatus.toLowerCase() !== 'comment') {
                core.setFailed(`Round-2 review by ${reviewer} carries a STILL_OPEN row while \`**Status:**\` reads "${declaredStatus}". A STILL_OPEN round keeps the ORIGINAL review authoritative, so its Status is Comment.`);
                return;
              }
            }

            // Ordinary COMMENTED reviews remain supplementary and skip the heavy template.
            // The RC2 closure packet is one exception (it carries the budget's frozen semantic
            // contract and receives the narrow Micro-Delta validation below); a Round-2 disposition
            // is the other, for the reason above.
            if (reviewState === 'commented' && !isCommentedClosure && !isRound2Disposition) {
              // ...but "supplementary" stopped being true of one thing. A COMMENT may no longer mint
              // a new action packet: the managed path refuses it. Skipping this state entirely left
              // the DIRECT gh/UI path neither refused nor observed, so the guard was avoidable by
              // clicking — the third time this skip has exempted a shape that later acquired a gate
              // (the Round-2 disposition above was the second).
              //
              // A post-submit lint cannot refuse; the review is already public. It REPORTS, which is
              // what the ticket's "where observable" means. The heavy template stays skipped — this
              // review never owed it.
              //
              // The rule is duplicated from the managed path rather than imported: this job runs
              // without a repo checkout. Duplication is the established shape in this file (the
              // closure-packet pattern above is the same), and the risk it carries is real — keep
              // this in step with `collectDemandedActionItems` in `PullRequestService.mjs`, whose
              // scoping rationale (section-scoped so a verdict block is not read as a demand) is the
              // authority.
              const demandLines = (() => {
                const items = [];
                let   fence = null, inSection = false;

                for (const line of String(body).split(/\r\n|[\n\r]/)) {
                  const fenceMatch = /^[ \t]{0,3}(`{3,}|~{3,})/.exec(line);

                  if (fenceMatch) {
                    if (fence === null)                     fence = fenceMatch[1][0];
                    else if (fenceMatch[1][0] === fence)    fence = null;
                    continue;
                  }
                  if (fence !== null) continue;

                  if (/^[ \t]{0,3}#{1,6}[ \t]/.test(line)) {
                    inSection = /Required\s+Actions?\b/i.test(line);
                    continue;
                  }

                  if (inSection && (/^[ \t]*[-*][ \t]+\[[ \t]*\][ \t]*\S/.test(line)
                                 || /^[ \t]*(?:[-*][ \t]+)?\*{0,2}RA[-_ ]?\d+\*{0,2}[ \t]*[:.)—-][ \t]*\S/i.test(line))) {
                    items.push(line.trim());
                  }
                }

                return items;
              })();

              if (demandLines.length > 0) {
                const managed = body.includes('[review-budget-managed]');
                const bypass  = /^\[review-budget-bypass\]\s+reason:\s*\S.*$/im.test(body);

                if (!managed && !bypass) {
                  core.setFailed(`COMMENTED review by ${reviewer} raises ${demandLines.length} new required-action item(s) without managed-path provenance or a \`[review-budget-bypass] reason: ...\` disclosure. A COMMENT carries a disposition over existing actions; a first demand round is a REQUEST_CHANGES, which the budget counts. Use manage_pr_review, or disclose the direct gh/UI bypass.`);
                  return;
                }
              }

              console.log(`✅ COMMENTED review by ${reviewer} — supplementary (non-gating); template enforcement is state-keyed to APPROVED/CHANGES_REQUESTED. Skipping lint.`);
              return;
            }

            // The managed mutation appends durable provenance. A raw gh/UI Request Changes
            // submission must disclose the documented bypass marker so telemetry can distinguish
            // a deliberate bypass from an accidental missing pre-submit gate.
            if (reviewState === 'changes_requested') {
              const activationIssueNumber = 15257;
              const activationBaseRefName = 'dev';
              const activationData = await github.graphql(`
                query ReviewBudgetActivation($owner: String!, $repo: String!, $issueNumber: Int!) {
                  repository(owner: $owner, name: $repo) {
                    activationIssue: issue(number: $issueNumber) {
                      id
                      closedByPullRequestsReferences(first: 100, includeClosedPrs: true) {
                        totalCount
                        nodes {
                          number
                          state
                          mergedAt
                          baseRefName
                        }
                        pageInfo {
                          hasNextPage
                        }
                      }
                    }
                  }
                }
              `, {
                owner      : context.repo.owner,
                repo       : context.repo.repo,
                issueNumber: activationIssueNumber
              });
              const activationIssue = activationData?.repository?.activationIssue;
              const references      = activationIssue?.closedByPullRequestsReferences;
              const nodes           = references?.nodes;

              if (!activationIssue?.id) {
                core.setFailed(`Cannot resolve review-budget activation issue #${activationIssueNumber}.`);
                return;
              }

              if (!Array.isArray(nodes) || references?.pageInfo?.hasNextPage !== false ||
                  !Number.isInteger(references?.totalCount) || references.totalCount !== nodes.length) {
                core.setFailed(`Cannot prove the complete closing-PR history for review-budget activation issue #${activationIssueNumber}.`);
                return;
              }

              const malformedMerged = nodes.filter(reference =>
                reference?.state === 'MERGED' && reference?.baseRefName === activationBaseRefName &&
                !Number.isFinite(Date.parse(reference?.mergedAt || ''))
              );

              if (malformedMerged.length > 0) {
                core.setFailed(`Review-budget activation issue #${activationIssueNumber} has a merged ${activationBaseRefName} closer without a valid mergedAt.`);
                return;
              }

              const activationPr = nodes
                .filter(reference => reference?.state === 'MERGED' && reference?.baseRefName === activationBaseRefName)
                .sort((left, right) => Date.parse(left.mergedAt) - Date.parse(right.mergedAt) || left.number - right.number)[0];
              const activatedMs = Date.parse(activationPr?.mergedAt || '');
              const createdMs   = Date.parse(pr.created_at || '');

              if (activationPr && !Number.isFinite(createdMs)) {
                core.setFailed(`Cannot determine the review-budget cohort for PR #${pr.number}; created_at is invalid.`);
                return;
              }

              const postCutover = Number.isFinite(activatedMs) && Number.isFinite(createdMs) && createdMs > activatedMs;

              if (postCutover) {
                const managed = body.includes('[review-budget-managed]');
                const override = body.includes('[review-budget-override]');
                const bypass  = /^\[review-budget-bypass\]\s+reason:\s*\S.*$/im.test(body);

                if (override && !managed) {
                  core.setFailed('`[review-budget-override]` is valid only with managed-path provenance.');
                  return;
                }

                if (!managed && !bypass) {
                  core.setFailed('Post-activation agent REQUEST_CHANGES review lacks managed-path provenance or `[review-budget-bypass] reason: ...` disclosure. Use manage_pr_review or disclose the direct gh/UI bypass.');
                  return;
                }
              }
            }

            console.log(`🔍 Linting review body for agent reviewer: ${reviewer} on PR #${pr.number} (state: ${review.state})`);

            // ──────────────────────────────────────────────────────────────────────
            // Two-layer mechanical body-shape validation (#11495, derived from PR #11494).
            //
            // VISIBLE layer: 7 evaluation-metric tags from pr-review-template.md /
            // pr-review-followup-template.md. Wire-format contract with the Retrospective-
            // Brain graph ingestor.
            // Misses surface as a precise list in the follow-up comment + ONE diagnostic
            // anchor named in the human-facing message.
            //
            // INVISIBLE layer: structural template substrings checked SILENTLY. Misses
            // NOT named in the follow-up comment — neither in prose nor as enumeration.
            // Defeats Goodhart anchor-stuffing where a reviewer hallucinates a body that
            // contains exactly the named visible anchors but omits the actual template
            // structure (empirical anchor: review 4304287893 on PR #11499 had all 7
            // visible tags but missing structural anchors — would have passed visible-only).
            //
            // ⚠️  SYNCHRONIZATION PROTOCOL: these lists and tier checks MUST stay in sync
            // with the Brain GitHub-workflow service's review-template
            // constants. If you edit either side, edit the other simultaneously.
            // Follow-up ticket candidate:
            // extract to a shared Brain review-anchor module
            // (see #11501 cross-surface enhancement ticket).
            // ──────────────────────────────────────────────────────────────────────

            const VISIBLE_PR_REVIEW_ANCHORS = [
              "[ARCH_ALIGNMENT]",
              "[CONTENT_COMPLETENESS]",
              "[EXECUTION_QUALITY]",
              "[PRODUCTIVITY]",
              "[IMPACT]",
              "[COMPLEXITY]",
              "[EFFORT_PROFILE]"
            ];

            const INVISIBLE_PR_REVIEW_ANCHORS = [
              "Depth Floor",
              "Required Actions",
              "Strategic-Fit Decision"
            ];

            // Required premise-snapshot anchors. Match the distinctive bold template labels,
            // not bare prose, so incidental phrases like "Patch Verdict" do not satisfy the gate.
            const REQUIRED_PR_REVIEW_PREMISE_ANCHORS = [
              {label: "Inputs Read Before Patch", token: "**Inputs Read Before Patch:**"},
              {label: "Expected Solution Shape",  token: "**Expected Solution Shape:**"},
              {label: "Patch Verdict",            token: "**Patch Verdict:**"},
              {label: "Premise Coherence",        token: "**Premise Coherence:**"}
            ];

            const PR_REVIEW_ORIGIN_SESSION_PATTERN = /^\s*[*-]\s+\*\*Origin Session ID:\*\*\s+[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}\s*$/im;

            const MICRO_DELTA_PR_REVIEW_SHAPE_HINTS = [
              "# Pull Request Micro-Delta Review",
              "### State Vector",
              "### Micro-Delta Focus",
              "### Verdict"
            ];

            const MICRO_DELTA_PR_REVIEW_TEMPLATE_SKELETON_ANCHORS = [
              "# Pull Request Micro-Delta Review",
              "> **Context:**",
              "### State Vector",
              "- **Target SHA:**",
              "- **Origin Session ID:**",
              "- **Current reviewDecision:**",
              "- **Semantic Status:**",
              "- **CI Status:**",
              "- **Remaining Blocker Class:**",
              "- **Measured Discussion Cost:**",
              "### Micro-Delta Focus",
              "*Only defects classified as `mechanical-hygiene` or `metadata-drift` are reviewed here.*",
              "### Verdict",
              "**APPROVED**",
              "**COMMENTED CLOSURE**",
              "**MAINTAINER POLISH FAST PATH APPLIED**"
            ];

            const MICRO_DELTA_REVIEW_BLOCKER_CLASS_PATTERN = /(?:^|[^\w-])(mechanical-hygiene|metadata-drift)(?:$|[^\w-])/i;
            const MICRO_DELTA_CLOSURE_PACKET_FIELDS = [
              'Consumer sweep',
              'Falsifier/property matrix',
              'Carried-vs-new census',
              'Truth-fold',
              'Semantic-surface freeze'
            ];

            // Micro-Review (Cycle-1, blast-scaled) light path — KEEP IN SYNC with
            // the Brain GitHub-workflow service's MICRO_REVIEW_* constants.
            // A micro/contained PR gets a premise+correctness glance, not the full gauntlet
            // (pr-review-guide §6.4). Fail SAFE toward accept: the floor is the header + the Class
            // assertion (micro|contained|mechanical, so the light path is not an intense-PR
            // backdoor) + a Verdict + the Glance + the canonical origin-session line. Selection is
            // a REAL H1 outside fenced blocks — a full review that merely DISCUSSES the light form
            // must not be routed to the micro floor.
            const isMicroReviewBody = (() => {
              let fence = null;
              for (const line of body.split(/\r\n|[\n\r]/)) {
                const fenceMatch = /^[ \t]{0,3}(`{3,}|~{3,})/.exec(line);
                if (fenceMatch) {
                  if (fence === null) fence = fenceMatch[1][0];
                  else if (fenceMatch[1][0] === fence) fence = null;
                  continue;
                }
                if (fence === null && /^#[ \t]+PR Micro-Review\b/.test(line)) return true;
              }
              return false;
            })();

            if (isMicroReviewBody) {
              const microMisses = ["# PR Micro-Review", "**Class:**", "**Verdict:**", "**Glance:**", "- **Origin Session ID:**"]
                .filter(a => !body.includes(a));
              const microClassLine = body.split("\n").find(l => l.includes("**Class:**")) || "";
              if (!/(?:^|[^\w-])(micro|contained|mechanical)(?:$|[^\w-])/i.test(microClassLine)) {
                microMisses.push("Class: micro | contained | mechanical");
              }
              if (microMisses.length === 0) {
                console.log("✅ Micro-Review body matches the blast-scaled light shape.");
                return;
              }
              core.setFailed(`Agent micro-review body missing the minimal shape (header + "**Class:** micro|contained|mechanical" + "**Verdict:**" + "**Glance:**" + "- **Origin Session ID:**"). See .agents/skills/pr-review/assets/pr-review-micro-review-template.md`);
              return;
            }

            // Ordinary Round 2, checked BEFORE the heavier shapes. It carries no premise snapshot by
            // design, so falling through to the canonical path would refuse it for omitting exactly
            // what the terminal-round decision removed — CI would then reject the shape the substrate
            // prescribes. Mirrors the service's tier dispatch in `PullRequestService.mjs`.
            const ROUND_2_PR_REVIEW_TEMPLATE_SKELETON_ANCHORS = [
              "# PR Review — Round 2",
              "### ⚓ Anchor",
              "### 📋 Disposition",
              "### 🔚 Verdict"
            ];

            // Kept byte-for-byte in step with `getRound2PrReviewTemplateValidationFailure()` in
            // the Brain GitHub-workflow service. The two copies of this contract
            // already drifted once — CI required a valid origin line for a Round 2 while the managed
            // service did not — so the service admitted bodies this lint then rejected. A format that
            // lands in one copy only makes the managed path and CI disagree about what is valid.
            //
            // Selection is the H1 ALONE, not any-of-three-hints: matching a section heading routed a
            // canonical review into this branch and skipped its premise validation, which is a wider
            // hole than a lenient tier because it opens the canonical path.
            const ROUND_2_DISPOSITION_ROW_PATTERN = /\|[^|\n]*\b(ADDRESSED|DEFENDED|STILL_OPEN)\b[^|\n]*\|/g;

            if (isRound2Disposition) {
              const round2Misses = ROUND_2_PR_REVIEW_TEMPLATE_SKELETON_ANCHORS.filter(a => !body.includes(a));

              if (!PR_REVIEW_ORIGIN_SESSION_PATTERN.test(body)) {
                round2Misses.push("Origin Session ID: Neo Memory Core UUID");
              }

              if (!/\*\*Round-1 Review ID:\*\*\s*(?!\[)\S/.test(body)) {
                round2Misses.push("Round-1 Review ID: the round this dispositions");
              }

              if ([...body.matchAll(ROUND_2_DISPOSITION_ROW_PATTERN)].length === 0) {
                round2Misses.push("at least one disposition row (ADDRESSED / DEFENDED / STILL_OPEN)");
              }

              if (/^[ \t]*[-*][ \t]+\[[ x]\]/im.test(body)) {
                round2Misses.push("no new action checklist — carry prior actions in the disposition table");
              }

              if (round2Misses.length === 0) {
                console.log("✅ Round-2 disposition body matches the documented shape.");
                return;
              }

              core.setFailed(
                "Round-2 disposition review is missing: " + round2Misses.join(", ") +
                "\nRead .agents/skills/pr-review/assets/pr-review-round-2-template.md before retrying."
              );
              return;
            }

            const isMicroDeltaPrReview = body.includes(MICRO_DELTA_PR_REVIEW_SHAPE_HINTS[0]) || (
              body.includes("### State Vector") &&
              body.includes("### Micro-Delta Focus")
            );

            if (isMicroDeltaPrReview) {
              const microDeltaMisses = MICRO_DELTA_PR_REVIEW_TEMPLATE_SKELETON_ANCHORS
                .filter(a => !body.includes(a));
              const remainingBlockerLine = body.split("\n").find(l => l.includes("- **Remaining Blocker Class:**")) || "";

              if (!PR_REVIEW_ORIGIN_SESSION_PATTERN.test(body)) {
                microDeltaMisses.push("Origin Session ID: Neo Memory Core UUID");
              }

              if (!MICRO_DELTA_REVIEW_BLOCKER_CLASS_PATTERN.test(remainingBlockerLine)) {
                microDeltaMisses.push("Remaining Blocker Class: mechanical-hygiene | metadata-drift");
              }

              if (isCommentedClosure) {
                if (!body.includes('### RC2 Closure Packet')) {
                  microDeltaMisses.push('RC2 Closure Packet');
                }

                MICRO_DELTA_CLOSURE_PACKET_FIELDS.forEach(label => {
                  const prefix = `- **${label}:**`;
                  const line   = body.split('\n').find(candidate => candidate.trim().startsWith(prefix));
                  const value  = line ? line.trim().slice(prefix.length).trim() : '';

                  if (!value || /^\[.*\]$/.test(value) || /^(?:todo|tbd)$/i.test(value)) {
                    microDeltaMisses.push(label);
                  }
                });
              }

              if (microDeltaMisses.length === 0) {
                console.log("✅ Micro-Delta body matches the documented circuit-breaker shape.");
                return;
              }

              const skillPath        = '.agents/skills/pr-review/SKILL.md';
              const circuitPath      = '.agents/skills/pr-review/audits/review-cost-circuit-breaker.md';
              const microDeltaPath   = '.agents/skills/pr-review/assets/pr-review-micro-delta-template.md';
              const reviewUrl        = `https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${pr.number}#pullrequestreview-${review.id}`;
              const diagnosticAnchor = microDeltaMisses[0] || null;

              const commentBody = [
                `## 🚨 Agent Micro-Delta Review Body Lint Violation`,
                ``,
                `@${reviewer} — your [review on PR #${pr.number}](${reviewUrl}) attempts the Micro-Delta format but does not match the documented circuit-breaker structure.`,
                ``,
                `**Required action**: read \`${skillPath}\`, \`${circuitPath}\`, and \`${microDeltaPath}\` BEFORE submitting a corrective re-review.`,
                ``,
                `Micro-Delta reviews are only valid after semantic review is complete, with only mechanical-hygiene or metadata-drift remaining.`,
                `If a semantic or contract delta exists, use the full follow-up review template instead.`,
                ``,
                diagnosticAnchor
                  ? `**Diagnostic hint**: at least one required Micro-Delta anchor like \`${diagnosticAnchor}\` is missing or invalid.`
                  : `**Diagnostic hint**: the Micro-Delta structural template anchors do not match.`,
                ``,
                `<sub>This is the CI tool-boundary lint companion to PR #11494's MCP \`manage_pr_review\` validator.`,
                `Both layers point you at the same skill substrate. Closes #11495 and #13910.</sub>`
              ].join('\n');

              await github.rest.issues.createComment({
                owner       : context.repo.owner,
                repo        : context.repo.repo,
                issue_number: pr.number,
                body        : commentBody
              });

              core.setFailed(`Agent micro-delta review body missing required circuit-breaker anchors. See follow-up comment on PR #${pr.number}.`);
              return;
            }

            const missingVisible         = VISIBLE_PR_REVIEW_ANCHORS         .filter(a => !body.includes(a));
            const missingInvisible       = INVISIBLE_PR_REVIEW_ANCHORS       .filter(a => !body.includes(a));
            const missingPremiseSnapshot = REQUIRED_PR_REVIEW_PREMISE_ANCHORS
              .filter(a => !body.includes(a.token))
              .map(a => a.label);
            const missingOriginSession = PR_REVIEW_ORIGIN_SESSION_PATTERN.test(body)
              ? []
              : ["Origin Session ID: Neo Memory Core UUID"];

            if (missingVisible.length === 0 && missingInvisible.length === 0 && missingPremiseSnapshot.length === 0 && missingOriginSession.length === 0) {
              console.log("✅ Review body contains all required anchors.");
              return;
            }

            // Compose comment that guides toward the skill without enumerating invisible
            // anchors. Even visible-list naming is bounded — at most ONE diagnostic
            // anchor in the prose (the full visible-miss list goes in the collapsed
            // details block for programmatic access; invisible misses are NEVER named).
            const diagnosticAnchor = missingVisible[0] || missingPremiseSnapshot[0] || missingOriginSession[0] || null;

            const skillPath    = '.agents/skills/pr-review/SKILL.md';
            const templatePath = '.agents/skills/pr-review/assets/pr-review-template.md';
            const followupPath = '.agents/skills/pr-review/assets/pr-review-followup-template.md';

            const reviewUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${pr.number}#pullrequestreview-${review.id}`;

            const commentBody = [
              `## 🚨 Agent PR Review Body Lint Violation`,
              ``,
              `@${reviewer} — your [review on PR #${pr.number}](${reviewUrl}) does not match the pr-review template structure.`,
              ``,
              `**Required action**: read \`${skillPath}\` BEFORE submitting a corrective re-review. The skill points at:`,
              `  - Cycle 1 (full template): \`${templatePath}\``,
              `  - Cycle N (follow-up template): \`${followupPath}\``,
              ``,
              `Do NOT compose a substitute template or hallucinate section headings. The validator`,
              `checks more structural anchors than this comment names. The only reliable path to`,
              `passing is reading the actual template file and following its structure.`,
              ``,
              `Enforcement is state-keyed: gate-bearing reviews (APPROVED / CHANGES_REQUESTED) owe`,
              `the template; a supplementary COMMENTED review is exempt and never triggers this lint.`,
              ``,
              missingPremiseSnapshot.length > 0
                ? `**Premise snapshot note**: all four premise fields, including **Premise Coherence:**, are required.`
                : ``,
              ``,
              missingOriginSession.length > 0
                ? `**Origin-session note**: provide the reviewer's Neo Memory Core session UUID, not a harness, task, or transcript identifier.`
                : ``,
              ``,
              diagnosticAnchor
                ? `**Diagnostic hint**: at least one recognized anchor like \`${diagnosticAnchor}\` is missing.`
                : `**Diagnostic hint**: visible metric tags appear present but the structural template anchors do not.`,
              ``,
              `<details>`,
              `<summary>Visible anchors missing (full list)</summary>`,
              ``,
              missingVisible.length > 0
                ? missingVisible.map(a => `- \`${a}\``).join('\n')
                : `(none — visible layer passed; invisible structural layer caught the miss)`,
              ``,
              `</details>`,
              ``,
              `<sub>This is the CI tool-boundary lint companion to PR #11494's MCP \`manage_pr_review\` validator.`,
              `Both layers point you at the same skill substrate. Closes #11495.</sub>`
            ].join('\n');

            await github.rest.issues.createComment({
              owner       : context.repo.owner,
              repo        : context.repo.repo,
              issue_number: pr.number,
              body        : commentBody
            });

            core.setFailed(`Agent review body missing required template anchors. See follow-up comment on PR #${pr.number}.`);
