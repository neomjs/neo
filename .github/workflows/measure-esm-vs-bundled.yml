name: Measure ESM vs Bundled (#21216)

# Reproducible HTTP/2 and HTTP/3 comparison of `dist/esm`, `dist/production`, and an `esbuild --splitting`
# probe across OS-level `tc netem` latency and loss arms on a hosted Linux runner.

on:
  workflow_dispatch:
    inputs:
      runs:
        description: 'Cold and warm runs per cell'
        required: false
        default: '5'
  pull_request:
    branches: [dev]
    paths:
      - 'buildScripts/util/measure-esm-vs-bundled.mjs'
      - 'test/playwright/unit/buildScripts/measureEsmVsBundled.spec.mjs'
      - '.github/workflows/measure-esm-vs-bundled.yml'

permissions:
  contents: read

concurrency:
  group: measure-esm-vs-bundled-${{ github.run_attempt == '1' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Caddy static binary and verify iproute2/OpenSSL
        run: |
          if ! command -v tc >/dev/null 2>&1; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends iproute2
          fi
          curl -fsSL -o /tmp/caddy.tar.gz https://github.com/caddyserver/caddy/releases/download/v2.8.4/caddy_2.8.4_linux_amd64.tar.gz
          echo "b8bec15d14fb033562af9f207850027bcbaa1f891edc9efe00d38bf39e1bf9944f8b6b8eba041ddd4c171cd70c905174c704d705be2f23bc678fe1eaf37a2485  /tmp/caddy.tar.gz" | sha512sum -c -
          sudo tar -xzf /tmp/caddy.tar.gz -C /usr/local/bin caddy
          rm -f /tmp/caddy.tar.gz
          caddy version
          ip -V
          tc -V
          openssl version

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run HTTP/2 and HTTP/3 measurement harness
        env:
          RUNS: ${{ inputs.runs || '5' }}
        run: node buildScripts/util/measure-esm-vs-bundled.mjs --runs "$RUNS" --output-markdown measurement-report.md --output-json measurement-raw.json

      - name: Publish measurement summary
        if: always() && hashFiles('measurement-report.md') != ''
        run: cat measurement-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload measurement artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: esm-vs-bundled-measurement
          path: |
            measurement-report.md
            measurement-raw.json
          if-no-files-found: warn
