services:
  chroma:
    image: chromadb/chroma:1.5.9
    # One flat unified persist dir, identical local + cloud (ADR 0003 / Epic #12153).
    # PERSIST_DIRECTORY is REQUIRED: the image persists to its WORKDIR-relative default
    # (/chroma/chroma) and IGNORES a mount elsewhere, so the env must point at the same
    # leaf as the tmpfs mount or the daemon writes outside the tmpfs.
    environment:
      - PERSIST_DIRECTORY=/chroma/unified
    # Tmpfs-mode option for Chroma when used as test fixture (cross-link to #10805)
    tmpfs:
      - /chroma/unified
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - neo-mcp-network
    ports:
      - "8000:8000"

  kb-server:
    build:
      context: ../..
      dockerfile: ai/deploy/Dockerfile
      args:
        NEO_SOURCE: local  # build the local checkout for dev iteration, not a remote clone
        TARGET_SERVER: knowledge-base
    environment:
      - NEO_TRANSPORT=sse
      - NEO_AUTO_SYNC=false
      - NEO_KB_AUTO_START_DATABASE=false
      - NEO_CHROMA_HOST=chroma
      - NEO_CHROMA_PORT=8000
      - MCP_HTTP_PORT=3000
      - NEO_MEMORY_DB_PATH=/app/.neo-ai-data/sqlite/memory-core-graph.sqlite

    volumes:
      - ../..:/app
    depends_on:
      chroma:
        condition: service_healthy
    networks:
      - neo-mcp-network
    ports:
      - "3000:3000"

  mc-server:
    build:
      context: ../..
      dockerfile: ai/deploy/Dockerfile
      args:
        NEO_SOURCE: local  # build the local checkout for dev iteration, not a remote clone
        TARGET_SERVER: memory-core
    environment:
      - NEO_TRANSPORT=sse
      - NEO_MC_PRIMARY=false
      - NEO_AUTO_SUMMARIZE=false
      - NEO_MEM_AUTO_START_DATABASE=false
      - NEO_MEM_AUTO_START_INFERENCE=false
      - NEO_AUTO_DREAM=false
      - NEO_AUTO_GOLDEN_PATH=false
      - NEO_REAL_TIME_MEMORY_PARSING=false
      - NEO_AUTO_INGEST_FS=false
      - NEO_CHROMA_HOST=chroma
      - NEO_CHROMA_PORT=8000
      - MCP_HTTP_PORT=3001
      - NEO_MEMORY_DB_PATH=/app/.neo-ai-data/sqlite/memory-core-graph.sqlite

    volumes:
      - ../..:/app
    depends_on:
      chroma:
        condition: service_healthy
    networks:
      - neo-mcp-network
    ports:
      - "3001:3001"

networks:
  neo-mcp-network:
    driver: bridge
