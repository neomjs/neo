      responses:
        '200':
          description: Commit-transaction result
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /instance/method/call:
    post:
      summary: Call Instance Method
      operationId: call_method
      x-neo-tool-tier: admin
      x-pass-as-object: true
      description: |
        Calls a method on a specific instance.

        **When to Use:**
        To trigger behavior on an instance (e.g. `store.load()`, `form.isValid()`, `grid.scrollToRow()`).
      tags: [Instance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallMethodRequest'
      responses:
        '200':
          description: Method called successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    description: The return value of the method
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /component/highlight:
    post:
      summary: Highlight Component
      operationId: highlight_component
      x-neo-tool-tier: write-locked
      x-pass-as-object: true
      description: |
        Highlights a component visually for debugging purposes.

        **When to Use:**
        To visually identify a component on the page during debugging or interaction sessions.
      tags: [Component]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HighlightComponentRequest'
      responses:
        '200':
          description: Component highlighted successfully
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /class/inspect:
    post:
      summary: Inspect Class
      operationId: inspect_class
      x-neo-tool-tier: read
      x-pass-as-object: true
      description: |
        Inspects a Neo.mjs class to retrieve its **Rich Blueprint**.

        Returns a detailed schema including:
        - **Hierarchy:** Full `ntypeChain` and `superClass`.
        - **Mixins:** Resolved list of applied mixins.
        - **Methods:** Cleaned public API (filtering out lifecycle noise).
        - **Configs:** A rich map where each key contains:
          - `value`: The resolved default value.
          - `meta`: Descriptor properties (e.g., `merge: 'shallow'`).
          - `hooks`: List of active reactive hooks (`beforeSet`, `afterSet`) found on the prototype.

        **When to Use:**
        To understand the *capabilities* and *reactivity* of a class. Use this to read the "manual" before instantiating or modifying a component.
      tags: [Introspection]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectClassRequest'
      responses:
        '200':
          description: Class schema
          content:
            application/json:
              schema:
                type: object

  /code/source/get:
    post:
      summary: Get Method Source
      operationId: get_method_source
      x-neo-tool-tier: read
      x-pass-as-object: true
      description: |
        Retrieves the source code of a class method.

        **When to Use:**
        To inspect the current implementation of a method before hot-patching it.
      tags: [Runtime]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetMethodSourceRequest'
      responses:
        '200':
          description: Source code retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  source:
                    type: string
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /code/patch:
    post:
      summary: Patch Code
      operationId: patch_code
      x-neo-tool-tier: admin
      x-pass-as-object: true
      description: |
        Replaces a method implementation on a class prototype at runtime.
        **Requires** `Neo.config.enableHotPatching = true`.

        **Best Practice:**
        Always use `get_method_source` first to retrieve the current implementation before creating a patch. This ensures you are modifying the correct version of the code.

        **When to Use:**
        To hot-patch a bug in a live application without reloading.
      tags: [Runtime]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchCodeRequest'
      responses:
        '200':
          description: Patch successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /runtime/config/manage:
    post:
      summary: Manage Neo Config
      operationId: manage_neo_config
      x-neo-tool-tier: admin
      x-pass-as-object: true
      description: |
        Manages the global Neo.config object (get/set).

        **When to Use:**
        To inspect or modify the global configuration of the engine at runtime.
      tags: [Configuration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum: [get, set]
                  description: "The action to perform: 'get' to retrieve, 'set' to update."
                config:
                  type: object
                  description: "The partial config object to merge (required for 'set')."
                windowId:
                  type: string
                  description: "Optional window ID to retrieve specific boot config (only for 'get')."
                sessionId:
                  type: string
                  description: The target App Worker Session ID.
      responses:
        '200':
          description: Configuration result
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /interaction/simulate_event:
    post:
      summary: Simulate DOM Event
      operationId: simulate_event
      x-neo-tool-tier: write-locked
      x-pass-as-object: true
      description: |
        Simulates a native DOM event on a specific component or a sequence of events.

        **When to Use:**
        To trigger user interactions like clicks, keyboard input, or drag sequences for E2E testing.
      tags: [Interaction]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateEventRequest'
      responses:
        '200':
          description: Event(s) dispatched successfully
          content:
            application/json:
              schema:
                type: boolean
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    HealthCheckResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy, degraded]
        timestamp:
          type: string
          format: date-time
        bridge:
          type: object
          properties:
            connected:
              type: boolean
            agentId:
              type: string
            port:
              type: integer
        sessions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              connectedAt:
                type: number
              activeApps:
                type: integer
        windows:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              appName:
                type: string
              width:
                type: number
              height:
                type: number
              x:
                type: number
              y:
                type: number
        agents:
          type: array
          items:
            type: string
        version:
          type: string
        uptime:
          type: number

    FindInstancesRequest:
      type: object
      required:
        - selector
      properties:
        selector:
          type: object
          description: "JSON object with property/value pairs to match (e.g., {className: 'Neo.state.Provider'})."
        returnProperties:
          type: array
          items:
            type: string
          description: "Optional list of properties to return. Supports nested dot-notation (e.g. 'store.count'). If provided, returns a lean response (id, className, properties)."
        sessionId:
          type: string
          description: The target App Worker Session ID

    GetInstancePropertiesRequest:
      type: object
      required:
        - id
        - properties
      properties:
        id:
          type: string
          description: The instance ID
        properties:
          type: array
          items:
            type: string
          description: List of property names to retrieve. Supports nested dot-notation (e.g. 'store.data.length').
        sessionId:
          type: string
          description: The target App Worker Session ID

    GetComputedStylesRequest:
      type: object
      required:
        - componentId
        - variables
      properties:
        componentId:
          type: string
          description: The component ID
        variables:
          type: array
          items:
            type: string
          description: The list of style properties/variables to retrieve
        sessionId:
          type: string
          description: The target App Worker Session ID

    GetDomRectRequest:
      type: object
      required:
        - componentIds
      properties:
        componentIds:
          type: array
          items:
            type: string
          description: List of component IDs to inspect.
        sessionId:
          type: string
          description: The target App Worker Session ID

    GetDomEventListenersRequest:
      type: object
      required:
        - componentId
      properties:
        componentId:
          type: string
          description: The component ID to inspect
        sessionId:
          type: string
          description: The target App Worker Session ID

    GetDomEventSummaryRequest:
      type: object
      properties:
        sessionId:
          type: string
          description: The target App Worker Session ID

    QueryComponentRequest:
      type: object
      required:
        - selector
      properties:
        selector:
          type: object
          description: "JSON object with property/value pairs to match (e.g., {ntype: 'button', text: 'Save'})."
        rootId:
          type: string
          description: Optional ID of a component to search within (scoped search).
        returnProperties:
          type: array
          items:
            type: string
          description: "Optional list of properties to return. If provided, returns a lean response (id, className, properties) instead of the full component serialization."
        sessionId:
          type: string
          description: The target App Worker Session ID

    QueryVdomRequest:
      type: object
      required:
        - selector
      properties:
        selector:
          type: object
          description: "JSON object with property/value pairs to match (e.g., {cls: 'my-class'})."
        rootId:
          type: string
          description: Optional ID of a component to search within (scoped search).
        sessionId:
          type: string
          description: The target App Worker Session ID

    GetComponentTreeRequest:
      type: object
      properties:
        rootId:
          type: string
          description: Optional root component ID. Defaults to the App's MainView if available.
        depth:
          type: integer
          description: Depth limit. 1=Self, 2=Self+Children, -1=Infinite.
        lean:
          type: boolean
          default: true
          description: If true, returns a strict subset of properties (id, className, items) for token efficiency.
        sessionId:
          type: string
          description: The target App Worker Session ID

    GetConsoleLogsRequest:
      type: object
      properties:
        sessionId:
          type: string
          description: The target App Worker Session ID
        filter:
          type: string
          description: Optional string to filter logs by message content.
        type:
          type: string
          enum: [log, warn, error, info]
          description: Optional filter by log type.

    ReloadPageRequest:
      type: object
      properties:
        sessionId:
          type: string
          description: The target App Worker Session ID

    UndoRequest:
      type: object
      properties:
        sessionId:
          type: string
          description: The target App Worker Session ID

    RedoRequest:
      type: object
      properties:
        sessionId:
          type: string
          description: The target App Worker Session ID

    ListTransactionsRequest:
      type: object
      properties:
        sessionId:
          type: string
          description: The target App Worker Session ID

    SaveTransactionRequest:
      type: object
      required:
        - txId
      properties:
        sessionId:
          type: string
          description: The target App Worker Session ID
        txId:
          type: string
          description: The committed transaction id to archive.
        name:
          type: string
          description: Optional human-facing archive label.

    ReplayTransactionRequest:
      type: object
      required:
        - archiveId
      properties:
        sessionId:
          type: string
          description: The target App Worker Session ID
        archiveId:
          type: string
          description: The archived transaction id to replay.

    AbortTransactionRequest:
      type: object
      properties:
        sessionId:
          type: string
          description: The target App Worker Session ID

    BeginTransactionRequest:
      type: object
      properties:
        sessionId:
          type: string
          description: The target App Worker Session ID
        name:
          type: string
          description: A non-empty human-facing name for the batch (the user intent it groups); becomes the transaction's audit identity. An empty name is a recoverable error.

    CommitTransactionRequest:
      type: object
      properties:
        sessionId:
          type: string
          description: The target App Worker Session ID

    GetRouteHistoryRequest:
      type: object
      properties:
        windowId:
          type: string
          description: Optional window ID to get history for.
        sessionId:
          type: string
          description: The target App Worker Session ID

    OpenComponentWindowRequest:
      type: object
      required:
        - componentId
      properties:
        componentId:
          type: string
          description: The live component ID to open in a popup.
        dashboardId:
          type: string
          description: Optional dashboard/container ID that owns the popup primitive.
        windowId:
          type: string
          description: Optional known source window ID from window topology.
        rect:
          type: object
          description: Optional source rectangle used for popup placement.
          properties:
            x:
              type: number
            y:
              type: number
            width:
              type: number
            height:
              type: number
        sessionId:
          type: string
          description: The target App Worker Session ID

    CloseWindowRequest:
      type: object
      required:
        - windowId
      properties:
        windowId:
          type: string
          description: The known live popup ID from window topology.
        sessionId:
          type: string
          description: The target App Worker Session ID

    PositionWindowRequest:
      type: object
      required:
        - windowId
        - x
        - y
      properties:
        windowId:
          type: string
          description: The known live window ID from topology.
        x:
          type: number
          description: The target screen x coordinate.
        y:
          type: number
          description: The target screen y coordinate.
        sessionId:
          type: string
          description: The target App Worker Session ID

    FocusWindowRequest:
      type: object
      required:
        - windowId
      properties:
        windowId:
          type: string
          description: The known live window ID from topology.
        sessionId:
          type: string
          description: The target App Worker Session ID

    SetRouteRequest:
      type: object
      required:
        - hash
      properties:
        hash:
          type: string
          description: The new hash value to set (e.g., "#mainview=home").
        windowId:
          type: string
          description: Optional window ID to target.
        sessionId:
          type: string
          description: The target App Worker Session ID

    SetInstancePropertiesRequest:
      type: object
      required:
        - id
        - properties
      properties:
        id:
          type: string
          description: The instance ID
        properties:
          type: object
          description: Key-value pairs of properties to set
        sessionId:
          type: string
          description: The target App Worker Session ID

    CallMethodRequest:
      type: object
      required:
        - id
        - method
      properties:
        id:
          type: string
          description: The instance ID
        method:
          type: string
          description: The method name (e.g. 'load' or 'series.push')
        args:
          type: array
          items:
            oneOf:
              - type: string
                nullable: true
              - type: number
              - type: boolean
              - type: object
                additionalProperties: true
              - type: array
                items: {}
          description: Arguments to pass to the method (heterogeneous — any JSON-serializable value — string, number, boolean, object, array, or null). Pass values natively; strings are forwarded verbatim.
        sessionId:
          type: string
          description: The target App Worker Session ID

    CreateInstanceRequest:
      type: object
      properties:
        className:
          type: string
          description: Fully-qualified Neo class name to instantiate. Provide exactly one of className or ntype.
        ntype:
          type: string
          description: Neo ntype shortcut to instantiate. Provide exactly one of className or ntype.
        config:
          type: object
          default: {}
          description: JSON-safe instance config. Must not contain `module` class references or function-bearing values.
        parentId:
          type: string
          description: Optional target container id; when present, the created instance is attached via parent.add(instance).
        sessionId:
          type: string
          description: The target App Worker Session ID

    CreateInstanceResponse:
      type: object
      properties:
        id:
          type: string
          description: The created live instance id.
        className:
          type: string
          description: The created instance class name.
        parentId:
          type: string
          description: Present when the created instance was attached to a parent container.

    CreateComponentRequest:
      type: object
      required:
        - parentId
        - config
      properties:
        parentId:
          type: string
          description: The target container's component ID (the parent to add into)
        config:
          type: object
          description: The component configuration; declare an `ntype` (e.g. `button`) or `className` (e.g. `Neo.button.Base`). A `module` (class reference) cannot cross the wire — use `ntype`/`className`.
        sessionId:
          type: string
          description: The target App Worker Session ID

    RemoveComponentRequest:
      type: object
      required:
        - componentId
      properties:
        componentId:
          type: string
          description: The id of the component to destroy (also detached from the parent DOM)
        sessionId:
          type: string
          description: The target App Worker Session ID

    InspectStoreRequest:
      type: object
      required:
        - storeId
      properties:
        storeId:
          type: string
          description: The ID of the store to inspect
        limit:
          type: integer
          default: 50
          description: Maximum number of records to return
        offset:
          type: integer
          default: 0
          description: The record index to start from
        sessionId:
          type: string
          description: The target App Worker Session ID

    ListStoresRequest:
      type: object
      properties:
        sessionId:
          type: string
          description: The target App Worker Session ID

    GetRecordRequest:
      type: object
      required:
        - recordId
      properties:
        recordId:
          type: string
          description: The ID of the record to retrieve
        storeId:
          type: string
          description: Optional Store ID to scope the search
        sessionId:
          type: string
          description: The target App Worker Session ID

    InspectStateProviderRequest:
      type: object
      required:
        - providerId
      properties:
        providerId:
          type: string
          description: The ID of the state provider to inspect
        sessionId:
          type: string
          description: The target App Worker Session ID

    ModifyStateProviderRequest:
      type: object
      required:
        - providerId
        - data
      properties:
        providerId:
          type: string
          description: The ID of the state provider to modify
        data:
          type: object
          description: The data object to merge into the provider
        sessionId:
          type: string
          description: The target App Worker Session ID

    HighlightComponentRequest:
      type: object
      required:
        - componentId
      properties:
        componentId:
          type: string
          description: The component ID
        options:
          type: object
          properties:
            color:
              type: string
              description: Highlight color (default 'red')
            duration:
              type: integer
              description: Duration in ms (default 2000)
            style:
              type: string
              enum: [outline, box-shadow]
              description: Highlight style (default 'outline')
        sessionId:
          type: string
          description: The target App Worker Session ID

    InspectClassRequest:
      type: object
      required:
        - className
      properties:
        className:
          type: string
          description: The fully qualified class name (e.g., "Neo.button.Base").
        detail:
          type: string
          enum: [standard, compact]
          default: standard
          description: Level of detail to return. 'compact' returns only own configs/methods. 'standard' returns full inheritance.
        sessionId:
          type: string
          description: The target App Worker Session ID

    GetMethodSourceRequest:
      type: object
      required:
        - className
        - methodName
      properties:
        className:
          type: string
          description: The fully qualified class name.
        methodName:
          type: string
          description: The name of the method.
        sessionId:
          type: string
          description: The target App Worker Session ID

    PatchCodeRequest:
      type: object
      required:
        - className
        - methodName
        - source
      properties:
        className:
          type: string
          description: The fully qualified class name.
        methodName:
          type: string
          description: The name of the method to patch.
        source:
          type: string
          description: "The new function source code (e.g., 'function(args) { ... }')."
        sessionId:
          type: string
          description: The target App Worker Session ID

    SimulateEventRequest:
      type: object
      required:
        - events
      properties:
        sessionId:
          type: string
          description: The target App Worker Session ID
        events:
          type: array
          items:
            type: object
            required:
              - targetId
              - type
              - windowId
            properties:
              targetId:
                type: string
                description: The DOM ID of the target element.
              type:
                type: string
                description: "The event type (e.g., 'click', 'keydown')."
              options:
                type: object
                description: "Event constructor options (e.g., {bubbles: true})."
              delay:
                type: integer
                description: "Delay in ms before this event."
              windowId:
                type: string
                description: "Target window ID."
          description: "Sequence of events to dispatch."

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
