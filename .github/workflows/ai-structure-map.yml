name: AI Structure Map

on:
  pull_request:
    branches: [dev]
    paths:
      - 'ai/**'
      - 'test/playwright/unit/ai/scripts/diagnostics/structureMap.spec.mjs'
      - 'package.json'
      - '.github/workflows/ai-structure-map.yml'
  push:
    branches: [dev]
    paths:
      - 'ai/**'
      - 'test/playwright/unit/ai/scripts/diagnostics/structureMap.spec.mjs'
      - 'package.json'
      - '.github/workflows/ai-structure-map.yml'

concurrency:
  group: ai-structure-map-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate current structure map
        run: |
          npm run --silent ai:structure-map -- --files --loc > /tmp/ai-structure-map.json
          test -s /tmp/ai-structure-map.json
          node -e "JSON.parse(require('fs').readFileSync('/tmp/ai-structure-map.json', 'utf8'))"
