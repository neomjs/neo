      tags: [Component]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryVdomRequest'
      responses:
        '200':
          description: Matching VDOM node
          content:
            application/json:
              schema:
                type: object
                properties:
                  vdom:
                    type: object
                  index:
                    type: integer
                  parentId:
                    type: string

